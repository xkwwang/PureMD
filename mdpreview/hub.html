    // ---- 文本索引：把正文所有可见文本拼成一条字符串，并记录每个文本节点的区间 ----
    function hlWalker(doc) {
      return doc.createTreeWalker(doc.body, 4 /* SHOW_TEXT */, {
        acceptNode: function (n) {
          var p = n.parentNode;
          if (!p) return 2;
          var tag = p.nodeName;
          if (tag === "SCRIPT" || tag === "STYLE" || tag === "NOSCRIPT") return 2;
          return 1;
        }
      });
    }
    function hlIndex(doc) {
      var nodes = [], parts = [], pos = 0, n, w = hlWalker(doc);
      while ((n = w.nextNode())) {
        var v = n.nodeValue || "";
        if (!v) continue;
        nodes.push({ node: n, start: pos, end: pos + v.length });
        parts.push(v);
        pos += v.length;
      }
      return { text: parts.join(""), nodes: nodes };
    }
    function hlText(doc) { return hlIndex(doc).text; }
    // 统计 range 覆盖的可见文本长度（跳过 script/style，和上面的索引口径一致）
    function hlTextLenInRange(doc, range) {
      var w = hlWalker(doc), n, len = 0;
      while ((n = w.nextNode())) {
        var hit = false;
        try { hit = range.intersectsNode(n); } catch (e) { hit = false; }
        if (!hit) continue;
        var s = (range.startContainer === n) ? range.startOffset : 0;
        var e = (range.endContainer === n) ? range.endOffset : n.nodeValue.length;
        if (e > s) len += e - s;
      }
      return len;
    }
    function hlNodeAt(idx, pos) {
      var ns = idx.nodes;
      for (var i = 0; i < ns.length; i++) {
        if (pos >= ns[i].start && pos < ns[i].end) return { node: ns[i].node, off: pos - ns[i].start };
        if (pos === ns[i].end) {
          if (i + 1 < ns.length && ns[i + 1].start === pos) continue;
          return { node: ns[i].node, off: ns[i].end - ns[i].start };
        }
      }
      return null;
    }
    function hlRangeAt(doc, start, end) {
      var idx = hlIndex(doc);
      var a = hlNodeAt(idx, start), b = hlNodeAt(idx, end);
      if (!a || !b) return null;
      var r = doc.createRange();
      try { r.setStart(a.node, a.off); r.setEnd(b.node, b.off); } catch (e) { return null; }
      return r;
    }

    // ---- 由选区算出锚点（文字 + 前后文 + 第几次出现） ----
    function hlMakeAnchor(doc, range) {
      try {
        var full = hlText(doc);
        var pre = doc.createRange();
        pre.selectNodeContents(doc.body);
        pre.setEnd(range.startContainer, range.startOffset);
        var start = hlTextLenInRange(doc, pre);
        var len = hlTextLenInRange(doc, range);
        if (!len) return null;
        var text = full.substr(start, len);
        if (!text || !text.replace(/\s/g, "")) return null;
        var occ = 0, from = 0, i;
        while ((i = full.indexOf(text, from)) !== -1 && i < start) { occ++; from = i + 1; }
        return {
          text: text,
          prefix: full.slice(Math.max(0, start - 48), start),
          suffix: full.slice(start + len, start + len + 48),
          occ: occ
        };
      } catch (e) { return null; }
    }
    function hlFindRange(doc, h) {
      var t = h.text || "";
      if (!t) return null;
      var full = hlText(doc);
      var best = -1, fb = -1, occ = 0, from = 0, i;
      while ((i = full.indexOf(t, from)) !== -1) {
        var p = full.slice(Math.max(0, i - 48), i);
        var s = full.slice(i + t.length, i + t.length + 48);
        var okP = !h.prefix || p.slice(-h.prefix.length) === h.prefix;
        var okS = !h.suffix || s.slice(0, h.suffix.length) === h.suffix;
        if (okP && okS) { best = i; break; }
        if (fb < 0 && occ === (h.occ || 0)) fb = i;
        occ++; from = i + 1;
      }
      if (best < 0) best = fb;
      if (best < 0) return null;
      return hlRangeAt(doc, best, best + t.length);
    }

    // ---- 把 range 拆成「每个文本节点一段」，分别包 <mark> ----
    // 不用 surroundContents 整段包：跨段落时它会复制外层标签、破坏正文结构。
    function hlWrapRange(doc, range, id, color) {
      var w = hlWalker(doc), n, segs = [];
      while ((n = w.nextNode())) {
        var hit = false;
        try { hit = range.intersectsNode(n); } catch (e) { hit = false; }
        if (!hit || !n.nodeValue) continue;
        var p = n.parentNode;
        if (p && p.closest && p.closest("mark.pm-hl")) continue;   // 已有高亮：跳过，避免套娃
        var s = (range.startContainer === n) ? range.startOffset : 0;
        var e = (range.endContainer === n) ? range.endOffset : n.nodeValue.length;
        if (e > s) segs.push({ node: n, s: s, e: e });
      }
      for (var i = segs.length - 1; i >= 0; i--) {
        var sg = segs[i];
        try {
          var r = doc.createRange();
          r.setStart(sg.node, sg.s);
          r.setEnd(sg.node, sg.e);
          var mk = doc.createElement("mark");
          mk.className = "pm-hl" + (color && color !== "y" ? " pm-hl-" + color : "");
          if (id) mk.setAttribute("data-hid", id);          // 配置里的高亮（本地标注）
          else mk.setAttribute("data-c", color || "y");     // 编辑模式下直接写进文档的高亮
          r.surroundContents(mk);
        } catch (e2) {}
      }
    }
    function hlUnwrap(m) {
      var p = m.parentNode;
      if (!p) return;
      while (m.firstChild) p.insertBefore(m.firstChild, m);
      p.removeChild(m);
      try { p.normalize(); } catch (e) {}
    }
    function hlMarkTitle(doc, h) {
      if (!doc) return;
      var ms = doc.querySelectorAll('mark.pm-hl[data-hid="' + h.id + '"]');
      for (var i = 0; i < ms.length; i++) {
        ms[i].setAttribute("title", h.note ? ("备注：" + h.note) : "点击编辑高亮");
      }
    }

    // ---- 恢复一篇文档的全部高亮 ----
    function applyHighlightsFor(t) {
      try {
        var doc = hlDocOf(t);
        if (!doc || !doc.body) return;
        hlEnsureStyle(doc);
        var items = hlItems(t);
        for (var i = 0; i < items.length; i++) {
          var h = items[i];
          if (doc.querySelector('mark.pm-hl[data-hid="' + h.id + '"]')) continue;
          var r = hlFindRange(doc, h);
          if (!r) continue;
          hlWrapRange(doc, r, h.id, h.color);
          hlMarkTitle(doc, h);
        }
      } catch (e) {}
    }

    // ---- 气泡定位（坐标由 iframe 内 rect 换算到主窗口） ----
    function hlPlace(rect) {
      var p = document.getElementById("hlPop");
      if (!p || !rect) return;
      p.style.display = "block";
      var w = p.offsetWidth || 246, h = p.offsetHeight || 120;
      var cx = (rect.left + rect.right) / 2;
      var left = cx - w / 2;
      left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
      var top = rect.bottom + 8;
      if (top + h > window.innerHeight - 8) top = rect.top - h - 8;
      if (top < 8) top = 8;
      p.style.left = Math.round(left) + "px";
      p.style.top = Math.round(top) + "px";
    }
    function hlPaintSwatches(c) {
      try {
        var sw = document.querySelectorAll("#hlPop .hl-sw");
        for (var i = 0; i < sw.length; i++) {
          sw[i].classList.toggle("active", sw[i].getAttribute("data-c") === c);
        }
      } catch (e) {}
    }
    function closeHlPop() {
      hlMode = null; hlPending = null; hlEditTab = null; hlEditId = null;
      var p = document.getElementById("hlPop");
      if (p) p.style.display = "none";
    }

    function hlNewId() {
      return "h" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    // 把当前待处理选区变成一条高亮；成功后切换到「编辑」态，方便接着写备注
    function hlCreateFromPending(color) {
      if (!hlPending) return null;
      var t = hlPending.t, doc = hlDocOf(t);
      if (!doc || !doc.body) return null;
      var range = hlPending.range;
      if (!range) return null;
      var anchor = hlMakeAnchor(doc, range);
      if (!anchor) { setStatus("这段选不中正文文字，换个位置再试"); return null; }
      var h = {
        id: hlNewId(), color: color || hlColor, note: "",
        text: anchor.text, prefix: anchor.prefix, suffix: anchor.suffix,
        occ: anchor.occ, ts: Date.now()
      };
      var key = hlKey(t);
      if (!HL[key]) HL[key] = [];
      HL[key].push(h);
      hlWrapRange(doc, range, h.id, h.color);
      if (!doc.querySelector('mark.pm-hl[data-hid="' + h.id + '"]')) {
        HL[key].pop();                      // 一个字都没标上（选区异常），不留空记录
        if (!HL[key].length) delete HL[key];
        setStatus("这段内容没能标上，换个位置再试");
        return null;
      }
      hlMarkTitle(doc, h);
      hlColor = h.color;
      saveCfg({ hl_color: hlColor });
      hlWrite();                            // 新建/删除/改色是低频动作，立刻落盘，防手快关窗口丢标注
      hlMode = "edit"; hlEditTab = t; hlEditId = h.id; hlActiveId = h.id; hlPending = null;
      var lab = document.getElementById("hlPopLabel");
      if (lab) lab.textContent = "已高亮";
      var del = document.getElementById("hlDel");
      if (del) del.style.display = "";
      hlPaintSwatches(h.color);
      if (sbMode === "hl") renderHlList();
      setStatus("已高亮（只存标注，不改 .md）");
      return h;
    }

    function hlSetColor(c) {
      if (!HL_COLORS[c]) return;
      if (hlMode === "new" && hlPending) { hlCreateFromPending(c); return; }
      if (hlMode !== "edit" || !hlEditTab) return;
      var h = hlFindItem(hlEditTab, hlEditId);
      if (!h) return;
      h.color = c;
      var doc = hlDocOf(hlEditTab);
      if (doc) {
        var ms = doc.querySelectorAll('mark.pm-hl[data-hid="' + h.id + '"]');
        for (var i = 0; i < ms.length; i++) {
          ms[i].className = "pm-hl" + (c === "y" ? "" : " pm-hl-" + c);
        }
      }
      hlColor = c;
      saveCfg({ hl_color: c });
      hlWrite();
      hlPaintSwatches(c);
      updateHlChip();
      if (sbMode === "hl") renderHlList();
    }

    function hlRemove(t, id) {
      var doc = hlDocOf(t);
      if (doc) {
        var ms = doc.querySelectorAll('mark.pm-hl[data-hid="' + id + '"]');
        for (var i = 0; i < ms.length; i++) hlUnwrap(ms[i]);
      }
      var key = hlKey(t), arr = HL[key] || [];
      for (var j = arr.length - 1; j >= 0; j--) if (arr[j].id === id) arr.splice(j, 1);
      if (!arr.length) delete HL[key];
      hlWrite();
      renderHlList();
      if (hlEditId === id) closeHlPop();
      setStatus("已删除高亮");
    }

    function hlJump(t, h) {
      var doc = hlDocOf(t);
      if (!doc) return;
      var m = doc.querySelector('mark.pm-hl[data-hid="' + h.id + '"]');
      if (!m) { setStatus("这条高亮在正文里找不到对应文字（源文件可能改过），可删掉重新标注"); return; }
      try {
        var w = doc.defaultView;
        var r = m.getBoundingClientRect();
        var y = r.top + (w.pageYOffset || 0) - 110;
        w.scrollTo(0, Math.max(0, y));
        m.classList.add("hl-flash");
        setTimeout(function () { try { m.classList.remove("hl-flash"); } catch (e) {} }, 1500);
      } catch (e) {}
      hlActiveId = h.id;
      renderHlList();
    }

    // ---- 侧栏「高亮」列表 ----
    function renderHlList() {
      var box = document.getElementById("hlList");
      if (!box) return;
      var t = activeTab();
      box.innerHTML = "";
      if (!t) {
        box.innerHTML = '<div class="sb-err" style="color:#6e7781">（没有打开的文档）</div>';
        return;
      }
      var items = hlItems(t);
      // 文件里自带的高亮（==文字== / <mark style>）也要列出来，否则正文一片黄、侧栏却说"没有高亮"
      var fileMks = [];
      try {
        var d0 = hlDocOf(t);
        if (d0) {
          var ms0 = d0.querySelectorAll("mark.pm-hl:not([data-hid])");
          for (var fi = 0; fi < ms0.length; fi++) fileMks.push(ms0[fi]);
        }
      } catch (e) {}
      if (!items.length && !fileMks.length) {
        box.innerHTML = '<div class="sb-err" style="color:#6e7781;line-height:1.7">' +
          "本文还没有高亮。<br>选中正文里的文字，点弹出的颜色即可标注；<br>再点高亮可改色、写备注、删除。</div>";
        return;
      }
      var frag = document.createDocumentFragment();
      for (var i = 0; i < items.length; i++) {
        (function (h) {
          var row = document.createElement("div");
          row.className = "hl-item" + (hlActiveId === h.id ? " active" : "");
          var dot = document.createElement("span");
          dot.className = "hl-dot " + (h.color || "y");
          var body = document.createElement("span");
          body.className = "hl-body";
          var tx = document.createElement("span");
          tx.className = "hl-txt";
          tx.textContent = (h.text || "").replace(/\s+/g, " ");
          body.appendChild(tx);
          if (h.note) {
            var nt = document.createElement("span");
            nt.className = "hl-nt";
            nt.textContent = h.note;
            body.appendChild(nt);
          }
          var del = document.createElement("button");
          del.type = "button";
          del.className = "hl-del2";
          del.textContent = "\u00d7";
          del.title = "删除这条高亮";
          del.addEventListener("click", function (e) {
            e.stopPropagation();
            hlRemove(t, h.id);
          });
          row.title = h.note ? ("备注：" + h.note) : ((h.text || "").slice(0, 120));
          row.appendChild(dot); row.appendChild(body); row.appendChild(del);
          row.addEventListener("click", function () { hlJump(t, h); });
          frag.appendChild(row);
        })(items[i]);
      }
      box.appendChild(frag);
      // ---- 文件里自带的高亮（只读列表；要删就进编辑模式再删） ----
      for (var fj = 0; fj < fileMks.length; fj++) {
        (function (mk) {
          var row = document.createElement("div");
          row.className = "hl-item";
          var dot = document.createElement("span");
          var c = mk.getAttribute("data-c") || "";
          if (c && HL_COLORS[c]) dot.className = "hl-dot " + c;
          else {
            dot.className = "hl-dot";
            var bg = (mk.style && mk.style.backgroundColor) || "";
            dot.style.background = bg || "#ffd400";
          }
          var body = document.createElement("span");
          body.className = "hl-body";
          var tx = document.createElement("span");
          tx.className = "hl-txt";
          tx.textContent = (mk.textContent || "").replace(/\s+/g, " ").slice(0, 120);
          var tag = document.createElement("span");
          tag.className = "hl-file-tag";
          tag.textContent = "文件中";
          tag.title = "这条高亮已经写在 .md 里（==文字==），任何支持高亮的编辑器都能看到";
          body.appendChild(tx); body.appendChild(tag);
          var del = document.createElement("button");
          del.type = "button";
          del.className = "hl-del2";
          del.textContent = "\u00d7";
          del.title = "移除这处高亮（需在编辑模式下）";
          del.addEventListener("click", function (e) {
            e.stopPropagation();
            if (!t.editing) { setStatus("这是写进文件的高亮，进入编辑模式后即可移除"); return; }
            hlUnwrap(mk);
            markDirty(t);
            renderHlList();
            setStatus("已移除这处高亮（保存后生效）");
          });
          row.title = tx.textContent;
          row.appendChild(dot); row.appendChild(body); row.appendChild(del);
          row.addEventListener("click", function () {
            try {
              var w = mk.ownerDocument.defaultView;
              var r = mk.getBoundingClientRect();
              w.scrollTo(0, Math.max(0, r.top + (w.pageYOffset || 0) - 110));
              mk.classList.add("hl-flash");
              setTimeout(function () { try { mk.classList.remove("hl-flash"); } catch (e) {} }, 1500);
            } catch (e) {}
          });
          box.appendChild(row);
        })(fileMks[fj]);
      }
    }

    // ---- iframe 内交互：选区 → 出现颜色条；点高亮 → 编辑 ----
    function hlOnMouseUp(t, ev) {
      var tg = ev.target;
      if (tg && tg.closest && tg.closest("mark.pm-hl")) return;
      setTimeout(function () {
        try {
          var doc = hlDocOf(t);
          if (!doc || !doc.body) return;
          var sel = doc.getSelection ? doc.getSelection() : null;
          if (!sel || sel.isCollapsed || !sel.rangeCount) {
            closeHlPop();                     // 点在空白处：收起气泡（编辑中也是）
            return;
          }
          var range = sel.getRangeAt(0);
          if (!range.toString().replace(/\s/g, "")) return;
          // 动作条上的「高亮」工具开着：选中即标注，不弹气泡
          if (hlToolOn) {
            if (t && t.editing) {
              editToggleMark(t, range);       // 编辑模式：直接加进文档，保存时写成 ==文字==
            } else {
              hlPending = { t: t, range: range.cloneRange() };
              hlMode = "new";
              var made = hlCreateFromPending(hlColor);
              closeHlPop();
              try { sel.removeAllRanges(); } catch (e3) {}
              if (made) setStatus("已高亮（" + (HL_NAMES[hlColor] || "黄") + "，只存标注不改 .md）");
            }
            return;
          }
          if (t && t.editing) { closeHlPop(); return; }   // 编辑模式里不自动弹气泡，免得挡住打字
          var rects = range.getClientRects();
          var rc = rects.length ? rects[rects.length - 1] : range.getBoundingClientRect();
          if (!rc || (!rc.width && !rc.height)) return;
          var fr = t.iframe.getBoundingClientRect();
          hlMode = "new"; hlPending = { t: t, range: range.cloneRange() };
          hlEditTab = null; hlEditId = null; hlActiveId = null;
          var lab = document.getElementById("hlPopLabel");
          if (lab) lab.textContent = "高亮";
          var note = document.getElementById("hlNote");
          if (note) note.value = "";
          var del = document.getElementById("hlDel");
          if (del) del.style.display = "none";
          hlPaintSwatches(hlColor);
          hlPlace({
            left: fr.left + rc.left, right: fr.left + rc.right,
            top: fr.top + rc.top, bottom: fr.top + rc.bottom
          });
        } catch (e) {}
      }, 0);
    }

    function hlOpenEditor(t, mark) {
      var id = mark.getAttribute("data-hid");
      var h = hlFindItem(t, id);
      if (!h) return;
      hlMode = "edit"; hlEditTab = t; hlEditId = id; hlActiveId = id; hlPending = null;
      var lab = document.getElementById("hlPopLabel");
      if (lab) lab.textContent = "编辑高亮";
      var note = document.getElementById("hlNote");
      if (note) note.value = h.note || "";
      var del = document.getElementById("hlDel");
      if (del) del.style.display = "";
      hlPaintSwatches(h.color || "y");
      try {
        var r = mark.getBoundingClientRect();
        var fr = t.iframe.getBoundingClientRect();
        hlPlace({
          left: fr.left + r.left, right: fr.left + r.right,
          top: fr.top + r.top, bottom: fr.top + r.bottom
        });
      } catch (e) {}
      if (sbMode === "hl") renderHlList();
    }

    function hlAttachTo(t) {
      try {
        var doc = hlDocOf(t);
        if (!doc || !doc.body) return;
        hlEnsureStyle(doc);
        if (doc.__pmHlWired) return;
        doc.__pmHlWired = true;
        doc.addEventListener("mouseup", function (ev) { hlOnMouseUp(t, ev); }, true);
        doc.addEventListener("click", function (ev) {
          if (t.editing) return;                    // 编辑时要能正常把光标放进高亮里改字
          var el = ev.target;
          var m = (el && el.closest) ? el.closest("mark.pm-hl") : null;
          if (!m) return;
          ev.preventDefault();
          ev.stopPropagation();
          hlOpenEditor(t, m);
        }, true);
        doc.addEventListener("keydown", function (ev) {
          if (ev.key === "Escape") {
            closeHlPop();
            if (t.editing) { ev.preventDefault(); leaveEdit(t); }
            return;
          }
          if ((ev.ctrlKey || ev.metaKey) && !ev.shiftKey && (ev.key === "s" || ev.key === "S")) {
            ev.preventDefault();                 // 焦点在正文里时 Ctrl+S 也要能存
            saveTab(t);
            return;
          }
          if ((ev.ctrlKey || ev.metaKey) && ev.shiftKey && (ev.key === "H" || ev.key === "h")) {
            var sel = doc.getSelection ? doc.getSelection() : null;
            if (sel && !sel.isCollapsed && sel.rangeCount) {
              ev.preventDefault();
              if (t.editing) { editToggleMark(t, sel.getRangeAt(0)); return; }
              hlPending = { t: t, range: sel.getRangeAt(0).cloneRange() };
              var h = hlCreateFromPending(hlColor);
              if (h) closeHlPop();
            }
          }
        }, true);
        doc.addEventListener("scroll", function () {
          if (hlMode === "new") closeHlPop();   // 选区位置会漂，直接收起，避免工具条指错地方
        }, { passive: true });
      } catch (e) {}
    }

    // ---- 气泡按钮 ----
    setTimeout(function () {
      try {
        var pop = document.getElementById("hlPop");
        if (!pop) return;
        var note = document.getElementById("hlNote");
        var sws = pop.querySelectorAll(".hl-sw");
        for (var i = 0; i < sws.length; i++) {
          (function (b) {
            b.addEventListener("mousedown", function (e) { e.preventDefault(); });
            b.addEventListener("click", function (e) {
              e.preventDefault();
              hlSetColor(b.getAttribute("data-c"));
            });
          })(sws[i]);
        }
        if (note) {
          note.addEventListener("input", function () {
            if (hlMode === "new" && hlPending) {
              if (!hlCreateFromPending(hlColor)) return;
            }
            if (hlMode !== "edit" || !hlEditTab) return;
            var h = hlFindItem(hlEditTab, hlEditId);
            if (!h) return;
            h.note = note.value;
            hlMarkTitle(hlDocOf(hlEditTab), h);
            hlSaveSoon();
            if (sbMode === "hl") renderHlList();
          });
        }
        var del = document.getElementById("hlDel");
        if (del) del.addEventListener("click", function () {
          if (hlMode === "edit" && hlEditTab && hlEditId) hlRemove(hlEditTab, hlEditId);
        });
        var done = document.getElementById("hlDone");
        if (done) done.addEventListener("click", function () {
          if (hlMode === "new" && hlPending && note && note.value.trim()) hlCreateFromPending(hlColor);
          closeHlPop();
        });
        document.addEventListener("pointerdown", function (e) {
          if (!hlMode) return;
          if (pop.contains(e.target)) return;
          var tg = e.target;
          if (tg && tg.closest && tg.closest("#views")) return;  // iframe 内部另有处理
          if (hlMode === "new" && hlPending && note && note.value.trim()) hlCreateFromPending(hlColor);
          closeHlPop();
        }, true);
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") closeHlPop();
        });
        window.addEventListener("resize", function () { if (hlMode) closeHlPop(); });
      } catch (e) {}
    }, 0);

    // ================= 编辑模式（点「保存」才写回源文件） =================
    // 三条底线：
    //  1. 预览、高亮、切标签都不会碰源文件；只有「保存」(Ctrl+S) 才写盘；
    //  2. 保存时只重写被改过的块，没动过的块逐字节沿用原文（模板层的 data-l + 快照）；
    //  3. 写盘前 Python 侧自动备份 .bak，并按原编码 / 原换行风格写回。
    var EDITED = {};        // tid -> true：这个标签有未保存修改
    var cfmResolve = null;

    function pmOf(t) {
      try {
        return (t && t.iframe && t.iframe.contentWindow) ? (t.iframe.contentWindow.__pm || null) : null;
      } catch (e) { return null; }
    }
    function editDocOf(t) {
      try { return (t && t.iframe) ? t.iframe.contentDocument : null; } catch (e) { return null; }
    }
    function markDirty(t) {
      if (!t) return;
      EDITED[t.id] = true;
      updateEditUI();
    }

    // ---- 通用确认弹窗：buttons = [{label, value, primary}]，返回选中的 value ----
    function askConfirm(title, msg, buttons) {
      return new Promise(function (resolve) {
        var m = document.getElementById("cfmModal");
        if (!m) { resolve(buttons[buttons.length - 1].value); return; }
        document.getElementById("cfmTitle").textContent = title;
        document.getElementById("cfmMsg").textContent = msg;
        var box = document.getElementById("cfmBtns");
        box.innerHTML = "";
        cfmResolve = function (v) { m.style.display = "none"; cfmResolve = null; resolve(v); };
        buttons.forEach(function (b) {
          var el = document.createElement("button");
          el.type = "button";
          el.textContent = b.label;
          if (b.primary) el.className = "primary";
          el.addEventListener("click", function () { if (cfmResolve) cfmResolve(b.value); });
          box.appendChild(el);
        });
        m.style.display = "flex";
      });
    }

    function ensureEditStyle(doc) {
      if (!doc || doc.getElementById("pm-edit-style")) return;
      var st = doc.createElement("style");
      st.id = "pm-edit-style";
      st.textContent = [
        "#content[contenteditable]{outline:2px dashed rgba(9,105,218,.28);outline-offset:16px;" +
          "border-radius:2px;cursor:text;min-height:60vh}",
        "#content[contenteditable]:focus{outline-color:rgba(9,105,218,.45)}",
        "#content[contenteditable] mark.pm-hl{cursor:text}",
        "body.pm-editing{padding-bottom:45vh}"
      ].join("");
      (doc.head || doc.documentElement).appendChild(st);
    }

    function updateEditUI() {
      var t = activeTab();
      var btn = document.getElementById("editBtn");
      var sv = document.getElementById("saveBtn");
      var on = !!(t && t.editing);
      var dirty = !!(t && EDITED[t.id]);
      // 别的标签可能还有没保存的改动：保存键不能因为切走了就消失
      var anyDirty = false;
      for (var q = 0; q < tabs.length; q++) if (EDITED[tabs[q].id]) anyDirty = true;
      if (btn) {
        btn.textContent = on ? "✎ 编辑中" : "✎ 编辑";
        btn.classList.toggle("editing", on);
        btn.title = on ? "退出编辑模式（Esc，有改动会先问你）"
                       : "进入编辑模式：可直接改正文，改完点「保存」才写回源文件";
      }
      if (sv) {
        sv.style.display = (on || anyDirty) ? "" : "none";
        sv.disabled = !(dirty || anyDirty);
        sv.style.opacity = (dirty || anyDirty) ? "1" : ".5";
        sv.textContent = (dirty || anyDirty) ? "保存" : "已保存";
      }
      // 有未保存修改的标签挂个红点
      for (var i = 0; i < tabs.length; i++) {
        var el = tabs[i].el;
        if (!el) continue;
        var dot = el.querySelector(".dot");
        if (EDITED[tabs[i].id]) {
          if (!dot) {
            dot = document.createElement("span");
            dot.className = "dot";
            dot.title = "有未保存的修改";
            el.insertBefore(dot, el.querySelector(".x"));
          }
        } else if (dot && dot.parentNode) {
          dot.parentNode.removeChild(dot);
        }
      }
      if (dirty && document.getElementById("status")) {
        setStatus("有未保存修改（Ctrl+S 保存）");
      }
    }

    function wireEditEvents(t) {
      var doc = editDocOf(t);
      if (!doc || doc.__pmEditWired) return;
      doc.__pmEditWired = true;
      doc.addEventListener("input", function () {
        if (!t.editing) return;
        markDirty(t);
      }, true);
      // 粘贴统一转成纯文本，避免把外部网页的样式一股脑带进文档
      doc.addEventListener("paste", function (ev) {
        if (!t.editing) return;
        try {
          var txt = (ev.clipboardData || window.clipboardData).getData("text/plain");
          if (txt == null) return;
          ev.preventDefault();
          doc.execCommand("insertText", false, txt);
        } catch (e) {}
      }, true);
    }

    function enterEdit(t) {
      t = t || activeTab();
      if (!t) { setStatus("先打开一个 .md 再编辑"); return; }
      var pm = pmOf(t);
      if (!pm) { setStatus("页面还没加载完，稍等一下再试"); return; }
      var doc = editDocOf(t);
      ensureEditStyle(doc);
      try {
        pm.content.setAttribute("contenteditable", "true");
        pm.content.setAttribute("spellcheck", "false");
        if (doc && doc.body) doc.body.classList.add("pm-editing");
        wireEditEvents(t);
        pm.content.focus();
      } catch (e) { setStatus("进入编辑模式失败：" + e); return; }
      t.editing = true;
      closeHlPop();
      updateEditUI();
      setStatus("编辑中：直接改文字；改完点「保存」写回源文件（Ctrl+S）");
    }

    // 放弃改动：把正文按"上次保存/渲染的文本"重新画一遍
    function revertTab(t) {
      var pm = pmOf(t);
      if (!pm) return;
      try {
        pm.render(pm.baseText());
        applyTheme(t.iframe);
        hlAttachTo(t);
        applyHighlightsFor(t);
      } catch (e) {}
      delete EDITED[t.id];
      updateEditUI();
    }

    function reallyLeave(t) {
      var pm = pmOf(t), doc = editDocOf(t);
      try {
        if (pm) pm.content.removeAttribute("contenteditable");
        if (doc && doc.body) doc.body.classList.remove("pm-editing");
      } catch (e) {}
      t.editing = false;
      closeHlPop();
      updateEditUI();
      setStatus("已退出编辑（" + (t.name || "") + "）");
    }

    function leaveEdit(t) {
      if (!EDITED[t.id]) { reallyLeave(t); return; }
      askConfirm("还有未保存的修改", "「" + (t.name || "") + "」里有改动还没写回文件。要先保存吗？", [
        { label: "取消", value: "cancel" },
        { label: "放弃修改", value: "discard" },
        { label: "保存并退出", value: "save", primary: true }
      ]).then(function (v) {
        if (v === "save") saveTab(t, { leave: true });
        else if (v === "discard") { revertTab(t); reallyLeave(t); }
      });
    }

    function toggleEdit() {
      var t = activeTab();
      if (!t) { setStatus("先打开一个 .md 再编辑"); return; }
      if (t.editing) leaveEdit(t); else enterEdit(t);
    }

    function saveTab(t, opts) {
      opts = opts || {};
      if (opts && opts.leave) t = t || activeTab();
      t = t || activeTab();
      if (!t) return;
      // 当前标签没改动、但别的标签有 → 保存那个（免得改动被"切走"后找不到）
      if (!EDITED[t.id]) {
        var other = null;
        for (var oi = 0; oi < tabs.length; oi++) if (EDITED[tabs[oi].id]) { other = tabs[oi]; break; }
        if (!other) { setStatus("没有需要保存的修改"); return; }
        t = other;
        setStatus("正在保存「" + (t.name || "") + "」…");
      }
      var pm = pmOf(t);
      if (!pm) { setStatus("页面还没准备好"); return; }
      if (!hasApi() || !window.pywebview.api.save_md) { setStatus("这个版本不支持保存，请更新到新版"); return; }
      var text;
      try { text = pm.buildText(); } catch (e) { setStatus("整理内容失败：" + e); return; }
      if (text === pm.baseText()) {
        delete EDITED[t.id];
        updateEditUI();
        setStatus("没有改动，无需保存");
        if (opts.leave) reallyLeave(t);
        return;
      }
      // 编辑模式里加的高亮（data-c）会写进文件；只读标注（data-hid）留在本机配置
      var willWrite = 0;
      try {
        var _doc = editDocOf(t);
        willWrite = _doc ? _doc.querySelectorAll("mark.pm-hl[data-c]").length : 0;
      } catch (e0) {}

      function doSave() {
        setStatus("正在保存…");
        window.pywebview.api.save_md(t.path, text).then(function (r) {
          if (!r || r.error) { setStatus("保存失败：" + ((r && r.error) || "未知错误")); return; }
          delete EDITED[t.id];
          try {
            pm.render(text);                 // 用刚写进文件的内容重画，快照基线随之更新
            applyTheme(t.iframe);
            hlAttachTo(t);
            applyHighlightsFor(t);           // 本机只读标注重新贴回（它们没写进文件）
            if (sbMode === "toc" && t.id === activeId) buildOutline(0);
            if (sbMode === "hl" && t.id === activeId) renderHlList();
          } catch (e) {}
          updateEditUI();
          if (t.editing) { try { pm.content.focus(); } catch (e) {} }   // 保存后接着写，不用再点一下
          var nm = r.backup ? r.backup.split(/[\\\/]/).pop() : "";
          setStatus(r.unchanged ? "内容没有变化" : ("已保存" + (nm ? "，原文件已备份为 " + nm : "")));
          if (opts.leave) reallyLeave(t);
        }).catch(function (e) {
          setStatus("保存失败：" + (e && e.message ? e.message : e));
        });
      }

      if (willWrite) {
        askConfirm("保存到源文件",
          "编辑模式里加的 " + willWrite + " 处高亮会一起写进文件（黄色写成 ==文字==，其它颜色写成 <mark>）。" +
          "只读状态下做的标注和备注仍只存在本机，不会改动文件。要继续吗？",
          [{ label: "取消", value: "no" }, { label: "继续保存", value: "yes", primary: true }]
        ).then(function (v) { if (v === "yes") doSave(); });
        return;
      }
      doSave();
    }

    // 编辑模式下直接给选区加/去高亮（高亮是文档的一部分，保存时写成 ==文字==）
    function editToggleMark(t, range) {
      var doc = editDocOf(t);
      if (!doc) return;
      var sc = range.startContainer;
      var el = sc.nodeType === 1 ? sc : sc.parentNode;
      var mk = (el && el.closest) ? el.closest("mark.pm-hl") : null;
      if (mk && mk.contains(range.endContainer)) {
        hlUnwrap(mk);
        markDirty(t);
        setStatus("已取消这处高亮（保存后生效）");
        return;
      }
      if (!range.toString().replace(/\s/g, "")) { setStatus("先选中要高亮的文字"); return; }
      hlWrapRange(doc, range, "", hlColor);
      var made = doc.querySelector('mark.pm-hl[data-c]');
      if (!made) { setStatus("这段选不中正文文字，换个位置再试"); return; }
      markDirty(t);
      setStatus("已高亮（保存后写进文件：==这段文字==）");
    }

    // 工具栏 / 快捷键
    (function wireEditUI() {
      try {
        var eb = document.getElementById("editBtn");
        if (eb) eb.addEventListener("click", function (e) { e.stopPropagation(); toggleEdit(); });
        var sb = document.getElementById("saveBtn");
        if (sb) sb.addEventListener("click", function (e) { e.stopPropagation(); saveTab(); });
        document.addEventListener("keydown", function (e) {
          var t = activeTab();
          if (!t) return;
          if ((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === "s" || e.key === "S")) {
            e.preventDefault();
            if (EDITED[t.id] || t.editing) saveTab(t);
            return;
          }
          if (e.key === "Escape" && t.editing && !cfmResolve) {
            e.preventDefault();
            leaveEdit(t);
          }
        });
      } catch (e) {}
    })();

    // 关窗口前：有未保存的修改就先问。返回 true 表示"已拦下，别关"。
    window.__pmMaybeClose = function () {
      var dirty = [];
      for (var i = 0; i < tabs.length; i++) if (EDITED[tabs[i].id]) dirty.push(tabs[i]);
      if (!dirty.length) return false;
      askConfirm("还有未保存的修改",
        dirty.map(function (x) { return x.name; }).join("、") + " 有改动还没写回文件。关闭前要保存吗？",
        [{ label: "取消", value: "cancel" },
         { label: "不保存，直接关闭", value: "close" },
         { label: "全部保存并关闭", value: "save", primary: true }]
      ).then(function (v) {
        if (v === "close") {
          for (var id in EDITED) delete EDITED[id];
          try { window.pywebview.api.window_close(); } catch (e) {}
        } else if (v === "save") {
          var list = dirty.slice(), i = 0;
          (function step() {
            if (i >= list.length) {
              try { window.pywebview.api.window_close(); } catch (e) {}
              return;
            }
            var tab = list[i++];
            var pm = pmOf(tab);
            var text = pm ? pm.buildText() : "";
            window.pywebview.api.save_md(tab.path, text)
              .then(function () { step(); }).catch(function () { step(); });
          })();
        }
      });
      return true;
    };

    // ---- 标签栏下方的动作条：最左侧栏开关，中间「编辑 / 高亮」----
    function updateHlChip() {
      var chip = document.getElementById("hlChip");
      if (chip) chip.style.background = HL_HEX[hlColor] || HL_HEX.y;
      var b = document.getElementById("hlChipBtn");
      if (b) b.title = "当前高亮颜色：" + (HL_NAMES[hlColor] || "黄") + "（点这里换色）";
    }
    function updateHlToolUI() {
      var b = document.getElementById("hlBtn");
      if (b) {
        b.classList.toggle("on", hlToolOn);
        b.title = hlToolOn
          ? "高亮工具已开启：选中文字立刻标注；再点一次关闭"
          : "高亮工具：开启后选中文字立刻用当前颜色标注";
      }
      updateHlChip();
    }
    function toggleHlTool(on) {
      hlToolOn = (typeof on === "boolean") ? on : !hlToolOn;
      updateHlToolUI();
      closeHlPop();
      if (!hlToolOn) { setStatus("已退出高亮模式"); return; }
      var t = activeTab();
      setStatus((t && t.editing)
        ? "高亮模式：选中即高亮，保存后写进文件"
        : "高亮模式：选中即标注（" + (HL_NAMES[hlColor] || "黄") + "）");
    }
    function closeHlPick() {
      var p = document.getElementById("hlPick");
      if (p) p.style.display = "none";
    }
    function openHlPick(anchor) {
      var p = document.getElementById("hlPick");
      if (!p || !anchor) return;
      p.style.display = "block";
      var r = anchor.getBoundingClientRect();
      var w = p.offsetWidth, h = p.offsetHeight;
      var left = Math.round(r.left + r.width / 2 - w / 2);
      if (left < 6) left = 6;
      if (left + w > window.innerWidth - 6) left = window.innerWidth - w - 6;
      var top = Math.round(r.bottom + 6);
      if (top + h > window.innerHeight - 6) top = Math.round(r.top - h - 6);
      if (top < 6) top = 6;
      p.style.left = left + "px";
      p.style.top = top + "px";
      var sw = p.querySelectorAll(".hl-sw");
      for (var i = 0; i < sw.length; i++) {
        sw[i].classList.toggle("active", sw[i].getAttribute("data-c") === hlColor);
      }
    }
    (function wireActbar() {
      try {
        var st = document.getElementById("sbToggleBtn");
        if (st) st.addEventListener("click", function (e) { e.stopPropagation(); toggleSbPanel(); });
        var hb = document.getElementById("hlBtn");
        if (hb) hb.addEventListener("click", function (e) { e.stopPropagation(); toggleHlTool(); });
        var cb = document.getElementById("hlChipBtn");
        var pk = document.getElementById("hlPick");
        if (cb) cb.addEventListener("click", function (e) {
          e.stopPropagation();
          if (pk && pk.style.display === "block") { closeHlPick(); return; }
          openHlPick(cb);
        });
        if (pk) pk.addEventListener("click", function (e) {
          e.stopPropagation();
          var b = (e.target && e.target.closest) ? e.target.closest(".hl-sw") : null;
          if (!b) return;
          var c = b.getAttribute("data-c");
          if (!HL_COLORS[c]) return;
          hlColor = c;
          saveCfg({ hl_color: c });
          updateHlChip();
          closeHlPick();
          if (!hlToolOn) toggleHlTool(true);
          else setStatus("高亮颜色：" + (HL_NAMES[c] || "") + " — 选中文字即可标注");
        });
        document.addEventListener("click", function (e) {
          if (!pk || pk.style.display !== "block") return;
          if (cb && cb.contains(e.target)) return;
          closeHlPick();
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") closeHlPick();
          if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey &&
              (e.key === "b" || e.key === "B")) {
            e.preventDefault();
            toggleSbPanel();
          }
          // 字号快捷键：Ctrl+= / Ctrl+- / Ctrl+0（和 Ctrl+滚轮 同一套缩放）
          if ((e.ctrlKey || e.metaKey) && !e.altKey) {
            if (e.key === "=" || e.key === "+") { e.preventDefault(); stepScale(1); }
            else if (e.key === "-" || e.key === "_") { e.preventDefault(); stepScale(-1); }
            else if (e.key === "0") { e.preventDefault(); setScale(1); }
          }
        });
        // Ctrl+滚轮：自己接管，只缩放正文；界面之所以不跟着变大，是因为 zoom 只加在
        // 每个标签页 iframe 的 <html> 上（父页面一个像素都不缩放）。preventDefault
        // 同时也挡住 WebView2 自带的整页缩放，避免两套缩放叠加。
        document.addEventListener("wheel", function (e) {
          if (!(e.ctrlKey || e.metaKey)) return;
          e.preventDefault();
          if (e.stopPropagation) e.stopPropagation();
          stepScale(e.deltaY < 0 ? 1 : -1);
        }, { passive: false });
        var zo = document.getElementById("zoomOutBtn");
        if (zo) zo.addEventListener("click", function (e) { e.stopPropagation(); stepScale(-1); });
        var zi = document.getElementById("zoomInBtn");
        if (zi) zi.addEventListener("click", function (e) { e.stopPropagation(); stepScale(1); });
        var zp = document.getElementById("zoomPct");
        if (zp) zp.addEventListener("click", function (e) { e.stopPropagation(); setScale(1); });
        var fb = document.getElementById("fitBtn");
        if (fb) fb.addEventListener("click", function (e) { e.stopPropagation(); toggleFit(); });
        // 窗口 / 侧栏宽度变化时，「适应窗口」跟着重算
        var vbox = document.getElementById("views");
        window.addEventListener("resize", function () { if (fitWindow) scheduleFit(); });
        if (vbox && window.ResizeObserver) {
          try { new ResizeObserver(function () { if (fitWindow) scheduleFit(); }).observe(vbox); } catch (e2) {}
        }
        updateZoomUI();
        // 侧栏开合可能来自任何入口（图标 / 页签 / × / 选文件夹），用 observer 统一同步按钮状态
        var sb = document.getElementById("sidebar");
        if (sb && window.MutationObserver) {
          new MutationObserver(updateSbToggle).observe(sb, { attributes: true, attributeFilter: ["class"] });
        }
        updateSbToggle();
        updateHlToolUI();
      } catch (e) {}
    })();

    window.__addTab = function (p) { addTab(p); };
    // 调试/自检用：外部可以直接读写正文字号（不参与正常交互）
    window.__pmZoom = {
      set: function (v) { setScale(v); },
      step: function (d) { stepScale(d); },
      fit: function () { toggleFit(); },
      value: function () { return fontScale; },
      fitting: function () { return fitWindow; }
    };
    // 消费在 DOM/脚本就绪前到达的待处理项
    window.__pending.forEach(function (p) { addTab(p); });
    window.__pending.length = 0;
  </script>
  <div id="hlPop">
    <div class="hl-row1">
      <span class="hl-label" id="hlPopLabel">高亮</span>
      <span class="hl-swatches">
        <button type="button" class="hl-sw y" data-c="y" title="黄色"></button>
        <button type="button" class="hl-sw r" data-c="r" title="红色"></button>
        <button type="button" class="hl-sw g" data-c="g" title="绿色"></button>
        <button type="button" class="hl-sw b" data-c="b" title="蓝色"></button>
        <button type="button" class="hl-sw v" data-c="v" title="紫色"></button>
        <button type="button" class="hl-sw p" data-c="p" title="品红"></button>
        <button type="button" class="hl-sw o" data-c="o" title="橙色"></button>
        <button type="button" class="hl-sw n" data-c="n" title="灰色"></button>
      </span>
    </div>
    <textarea class="hl-note" id="hlNote" placeholder="备注（可留空，不会改动 .md）" spellcheck="false"></textarea>
    <div class="hl-acts">
      <button type="button" class="hl-del" id="hlDel">删除</button>
      <button type="button" id="hlDone">完成</button>
      <span class="hl-hint" id="hlHint">Ctrl+Shift+H</span>
    </div>
  </div>
  <div id="cfmModal">
    <div class="box">
      <h3 id="cfmTitle">提示</h3>
      <p id="cfmMsg"></p>
      <div id="cfmBtns"></div>
    </div>
  </div>
  <div id="fbModal">
    <div class="box">
      <h3>反馈问题</h3>
      <p>有问题或建议？请复制下面的邮箱发邮件给我：</p>
      <span class="email" id="fbEmail">xkwwang@126.com</span>
      <button type="button" onclick="copyFeedbackEmail()">复制邮箱</button>
      <button type="button" onclick="closeFeedbackModal()" style="margin-left:8px">关闭</button>
    </div>
  </div>
  <div id="aboutModal">
    <div class="box">
      <h3>关于 PureMD</h3>
      <p>Markdown 纯预览工具：双击即看，只读打开，绝不改写源文件。</p>
      <p>选中文字即可高亮并写备注，标注只保存在本地配置，源 .md 不会改动。</p>
      <span class="ver" id="aboutVer">PureMD v1.0</span>
      <p>作者邮箱：xkwwang@126.com</p>
      <button type="button" onclick="copyAboutEmail()">复制邮箱</button>
      <button type="button" onclick="closeAboutModal()" style="margin-left:8px">关闭</button>
    </div>
  </div>
  <div id="updateModal">
    <div class="box">
      <h3>发现新版本</h3>
      <p id="updVer">PureMD v1.1.0</p>
      <div class="notes" id="updNotes"></div>
      <button type="button" onclick="openReleasePage()">打开发布页</button>
      <button type="button" onclick="skipThisVersion()" style="margin-left:8px">跳过此版本</button>
      <button type="button" onclick="closeUpdateModal()" style="margin-left:8px">关闭</button>
    </div>
  </div>
