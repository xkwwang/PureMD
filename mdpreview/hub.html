<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PureMD</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", Helvetica, Arial, sans-serif;
    background: #fff; color: #24292f;
    display: flex; flex-direction: column; overflow: hidden;
  }
  body.dark { background: #0d1117; color: #c9d1d9; }
  /* 外层固定条：左右滚动按钮 + 主题按钮固定，不随标签一起滚动 */
  #tabsbar {
    display: flex; align-items: center; gap: 4px;
    padding: 3px 6px; background: transparent;
    border-bottom: 0; flex: 0 0 auto;
    min-width: 0;
  }
  /* 内层标签区：可横向滚动 */
  #tabs {
    display: flex; align-items: stretch; gap: 2px;
    flex: 1 1 auto; min-width: 0;
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  #tabs::-webkit-scrollbar { height: 0; }
  .tab {
    display: inline-flex; align-items: center; gap: 2px;
    padding: 6px 8px; border: 1px solid transparent; border-bottom: 2px solid transparent;
    border-radius: 6px; cursor: pointer; font-size: 13px;
    white-space: nowrap; user-select: none; position: relative;
    /* 一行正好容纳 6 个标签：收缩下限 = 可视宽度/6（减掉间隙），第 7 个起才出现箭头 */
    flex: 0 1 auto; max-width: 200px; min-width: calc(100% / 6 - 3px);
    transition: box-shadow .12s ease;
  }
  .tab:hover {
    background: #eaeef2;
    border-color: #c8d0d8;
    box-shadow: 0 2px 6px rgba(31, 35, 40, 0.14), inset 0 0 0 1px rgba(255,255,255,0.6);
    z-index: 1;
  }
  body.dark .tab:hover {
    background: #30363d;
    border-color: #3b424b;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255,255,255,0.04);
    z-index: 1;
  }
  .tab.active {
    background: #fff;
    border-color: #d0d7de;
    border-bottom-color: #b6c0c9;
    box-shadow: 0 -3px 8px rgba(31, 35, 40, 0.10), 0 5px 14px rgba(31, 35, 40, 0.22), 0 2px 5px rgba(31, 35, 40, 0.16);
    z-index: 2;
  }
  body.dark .tab.active {
    background: #0d1117;
    border-color: #30363d;
    border-bottom-color: #c9d1d9;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.16), 0 4px 12px rgba(0,0,0,0.55), 0 1px 3px rgba(0,0,0,0.5);
    z-index: 2;
  }
  .tab .nm {
    flex: 1 1 auto; min-width: 0; overflow: hidden;
    -webkit-mask-image: linear-gradient(to left, transparent 0%, black 18px);
    mask-image: linear-gradient(to left, transparent 0%, black 18px);
  }
  .tab .x { opacity: .45; font-weight: 700; padding: 0 4px; flex: 0 0 auto; font-size: 17px; line-height: 1; }
  .tab .x:hover { opacity: 1; color: #cf222e; }
  /* 拖拽调整标签顺序 */
  .tab.dragging { opacity: .45; }
  .tab:active { cursor: grabbing; }
  /* 标签栏按钮：箭头/列表图标用 flex 双向居中 */
  .nav {
    display: inline-flex; align-items: center; justify-content: center;
    flex: 0 0 auto; min-width: 26px; align-self: stretch;
    border: 1px solid #d0d7de; border-bottom: 2px solid #d0d7de; background: #fff; color: #24292f;
    border-radius: 6px; cursor: pointer; font-size: 15px; line-height: 1; padding: 0 6px;
    position: relative;
    transition: box-shadow .12s ease;
  }
  /* 导航按钮（☰ / ‹ / ›）：hover 圆润阴影方框；选中（下拉展开或按下）时彩色下边框 + 三层下部重阴影，立体凸起，与标签风格一致 */
  .nav:hover {
    box-shadow: 0 2px 6px rgba(31,35,40,0.14), inset 0 0 0 1px rgba(255,255,255,0.5);
    z-index: 1;
  }
  .nav:active, .nav.on {
    border-bottom-color: #6e7781;
    box-shadow: 0 -3px 8px rgba(31,35,40,0.12), 0 6px 16px rgba(31,35,40,0.28), 0 2px 6px rgba(31,35,40,0.20);
    z-index: 2;
  }
  body.dark .nav { background: #21262d; color: #c9d1d9; border-color: #30363d; }
  body.dark .nav:hover {
    box-shadow: 0 2px 6px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.04);
  }
  body.dark .nav:active, body.dark .nav.on {
    border-bottom-color: #c9d1d9;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.16), 0 4px 12px rgba(0,0,0,0.55), 0 1px 3px rgba(0,0,0,0.5);
  }
  /* 垂直列显示：点“☰”弹出的标签名列表 */
  #tablist {
    position: fixed; z-index: 50; display: none;
    min-width: 200px; max-width: 340px; max-height: 60vh; overflow-y: auto;
    background: #fff; border: 1px solid #d0d7de; border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .18); padding: 4px;
  }
  #tablist .li {
    display: block; padding: 6px 10px; border-radius: 4px; cursor: pointer;
    font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #tablist .li:hover { background: #eaeef2; }
  #tablist .li.active { background: #eaeef2; font-weight: 600; }
  body.dark #tablist { background: #161b22; border-color: #30363d; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
  body.dark #tablist .li:hover, body.dark #tablist .li.active { background: #30363d; }
  body.beige #tablist { background: #f4ecd8; border-color: #d8cba8; }
  body.beige #tablist .li:hover, body.beige #tablist .li.active { background: #e0d5b8; }
  /* ☰ 菜单打开时盖住文档区的透明掩体：点它 = 点"面板外部"，用于关闭菜单。
     iframe 内部的点击不会冒泡到父文档（这是 WebView2/Chromium 的确定行为），
     只有盖一层掩体才能可靠捕获"点文档区即关菜单"。顶栏/标签栏不被掩体覆盖，
     点它们关闭菜单走 document 上的监听。 */
  #tabmask { position: absolute; inset: 0; z-index: 40; display: none; }
  button.theme {
    flex: 0 0 auto;
    border: 1px solid transparent; border-bottom: 2px solid transparent;
    background: #f6f8fa; color: #24292f;
    border-radius: 6px; padding: 6px 10px 2px; cursor: pointer; font-size: 12px;
    position: relative;
    transition: box-shadow .12s ease;
  }
  button.theme:hover {
    background: #fff;
    border-color: #d0d7de; border-bottom-color: #d0d7de;
    box-shadow: 0 2px 6px rgba(31,35,40,0.14), inset 0 0 0 1px rgba(255,255,255,0.5);
    z-index: 1;
  }
  button.theme:active, button.theme.on {
    background: #fff;
    border-bottom-color: #6e7781;
    box-shadow: 0 -3px 8px rgba(31,35,40,0.12), 0 6px 16px rgba(31,35,40,0.28), 0 2px 6px rgba(31,35,40,0.20);
    z-index: 2;
  }
  body.dark button.theme { background: #161b22; color: #c9d1d9; border-color: transparent; }
  body.dark button.theme:hover {
    background: #21262d;
    border-color: #30363d; border-bottom-color: #30363d;
    box-shadow: 0 2px 6px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.04);
  }
  body.dark button.theme:active, body.dark button.theme.on {
    background: #21262d;
    border-bottom-color: #c9d1d9;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.16), 0 4px 12px rgba(0,0,0,0.55), 0 1px 3px rgba(0,0,0,0.5);
  }
  #views { flex: 1 1 auto; position: relative; overflow: hidden; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  body.dark iframe { background: #0d1117; }
  .empty {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: #6e7781; font-size: 14px;
  }
  body.dark .empty { color: #8b949e; }
  /* 顶部 chrome：第一行 = 自绘标题栏（PureMD 文字 + 工具栏 + 窗口控制），第二行 = 标签栏 */
  #chrome {
    display: flex; flex-direction: column;
    background: #f6f8fa;
    border-bottom: 1px solid #d0d7de; flex: 0 0 auto;
  }
  body.dark #chrome { background: #161b22; border-bottom-color: #30363d; }
  body.beige #chrome { background: #ede3cc; border-bottom-color: #d8cba8; }
  /* 第一行：标题栏（可拖动区 + 工具按钮 + 窗口最小化/最大化/关闭） */
  #titlebar {
    display: flex; align-items: center; gap: 4px;
    padding: 4px 6px; flex: 0 0 auto;
    -webkit-user-select: none; user-select: none;
  }
  .drag-area {
    flex: 0 0 auto; min-width: 0; height: 26px;
    display: flex; align-items: center; padding: 0 2px;
    cursor: default;
  }
  .app-icon {
    flex: 0 0 auto; display: block; margin-right: 6px;
    border-radius: 4px;
  }
  .app-title {
    font-size: 13px; font-weight: 600; letter-spacing: .3px;
    color: #57606a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  body.dark .app-title { color: #8b949e; }
  body.beige .app-title { color: #6b5c46; }
  /* 窗口控制按钮（最小化 / 最大化 / 关闭） */
  .winctrls { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; margin-left: 4px; }
  .winbtn {
    width: 30px; height: 26px; border: 1px solid transparent; background: transparent;
    color: #57606a; border-radius: 6px; cursor: pointer; font-size: 13px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    transition: box-shadow .12s ease, background .12s ease;
  }
  .winbtn:hover { background: #fff; border-color: #d0d7de; box-shadow: 0 2px 6px rgba(31,35,40,0.14); }
  .winbtn:active { box-shadow: inset 0 0 0 1px rgba(31,35,40,0.14); }
  .winbtn.close:hover { background: #e5534b; color: #fff; border-color: #e5534b; box-shadow: 0 2px 8px rgba(229,83,75,0.4); }
  .winbtn:disabled { opacity: .4; cursor: default; }
  body.dark .winbtn { color: #8b949e; }
  body.dark .winbtn:hover { background: #21262d; border-color: #30363d; box-shadow: 0 2px 6px rgba(0,0,0,0.35); }
  body.dark .winbtn:active { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14); }
  body.dark .winbtn.close:hover { background: #f85149; border-color: #f85149; }
  body.beige .winbtn { color: #6b5c46; }
  body.beige .winbtn:hover { background: #e6dcc3; border-color: #d8cba8; box-shadow: 0 2px 6px rgba(74,59,40,0.14); }
  /* 系统深色模式：标题栏元素也跟随变暗 */
  @media (prefers-color-scheme: dark) {
    body:not(.light):not(.beige) .app-title { color: #8b949e; }
    body:not(.light):not(.beige) .winbtn { color: #8b949e; }
    body:not(.light):not(.beige) .winbtn:hover { background: #21262d; border-color: #30363d; box-shadow: 0 2px 6px rgba(0,0,0,0.35); }
    body:not(.light):not(.beige) .winbtn.close:hover { background: #f85149; border-color: #f85149; }
  }
  /* 顶部工具栏：打开 / 导出 / 主题 / 重新加载 / 帮助 / 自动刷新 */
  #topbar {
    display: flex; align-items: center; gap: 4px;
    padding: 0; background: transparent;
    border-bottom: 0; flex: 0 0 auto;
    margin-left: 4px;
  }
  /* 工具栏字体：微软雅黑（Windows 系统自带、完全离线） */
  #topbar, #topbar button, #topbar label {
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  #topbar button.toolbtn {
    border: 1px solid transparent; border-bottom: 2px solid transparent;
    background: #f6f8fa; color: #24292f;
    border-radius: 6px; padding: 6px 10px 2px; cursor: pointer; font-size: 12px;
    position: relative;
    transition: box-shadow .12s ease;
  }
  #topbar button.toolbtn:hover {
    background: #fff;
    border-color: #d0d7de; border-bottom-color: #d0d7de;
    box-shadow: 0 2px 6px rgba(31,35,40,0.14), inset 0 0 0 1px rgba(255,255,255,0.5);
    z-index: 1;
  }
  #topbar button.toolbtn:active, #topbar button.toolbtn.on {
    background: #fff;
    border-bottom-color: #6e7781;
    box-shadow: 0 -3px 8px rgba(31,35,40,0.12), 0 6px 16px rgba(31,35,40,0.28), 0 2px 6px rgba(31,35,40,0.20);
    z-index: 2;
  }
  body.dark #topbar button.toolbtn { background: #161b22; color: #c9d1d9; border-color: transparent; }
  body.dark #topbar button.toolbtn:hover {
    background: #21262d;
    border-color: #30363d; border-bottom-color: #30363d;
    box-shadow: 0 2px 6px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.04);
  }
  body.dark #topbar button.toolbtn:active, body.dark #topbar button.toolbtn.on {
    background: #21262d;
    border-bottom-color: #c9d1d9;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.16), 0 4px 12px rgba(0,0,0,0.55), 0 1px 3px rgba(0,0,0,0.5);
  }
  body.beige #topbar button.toolbtn { background: #ede3cc; color: #4a3b28; border-color: transparent; }
  body.beige #topbar button.toolbtn:hover {
    background: #e6dcc3;
    border-color: #d8cba8; border-bottom-color: #d8cba8;
    box-shadow: 0 2px 6px rgba(74,59,40,0.14), inset 0 0 0 1px rgba(255,255,255,0.4);
  }
  body.beige #topbar button.toolbtn:active, body.beige #topbar button.toolbtn.on {
    background: #e6dcc3;
    border-bottom-color: #8c7b52;
    box-shadow: 0 -3px 8px rgba(74,59,40,0.12), 0 6px 16px rgba(74,59,40,0.28), 0 2px 6px rgba(74,59,40,0.20);
  }
  #topbar label { font-size: 12px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; position: relative; top: 1.5px; }
  #status { flex: 0 0 auto; margin-left: auto; color: #6e7781; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
  body.dark #status { color: #8b949e; }
  body.beige #status { color: #6b5c46; }
  /* 米色（经典纸感 Sepia）：底 #f4ecd8 + 暖棕字 #4a3b28，对比度 9.16:1，落在 7–12:1 阅读舒适区 */
  body.beige { background: #f4ecd8; color: #4a3b28; }
  /* tabsbar background now comes from #chrome */
  body.beige .tab:hover {
    background: #e0d5b8;
    border-color: #cbbfa0;
    box-shadow: 0 2px 6px rgba(74, 59, 40, 0.14), inset 0 0 0 1px rgba(255,255,255,0.4);
    z-index: 1;
  }
  body.beige .tab.active {
    background: #f4ecd8;
    border-color: #d8cba8;
    border-bottom-color: #c2b490;
    box-shadow: 0 -3px 8px rgba(74, 59, 40, 0.10), 0 5px 14px rgba(74, 59, 40, 0.22), 0 2px 5px rgba(74, 59, 40, 0.16);
    z-index: 2;
  }
  body.beige .nav { background: #e6dcc3; color: #4a3b28; border-color: #d8cba8; }
  body.beige .nav:hover {
    box-shadow: 0 2px 6px rgba(74,59,40,0.14), inset 0 0 0 1px rgba(255,255,255,0.4);
  }
  body.beige .nav:active, body.beige .nav.on {
    border-bottom-color: #c2b490;
    box-shadow: 0 -3px 8px rgba(74,59,40,0.10), 0 5px 14px rgba(74,59,40,0.22), 0 2px 5px rgba(74,59,40,0.16);
  }
  body.beige button.theme { background: #ede3cc; color: #4a3b28; border-color: transparent; }
  body.beige button.theme:hover {
    background: #e6dcc3;
    border-color: #d8cba8; border-bottom-color: #d8cba8;
    box-shadow: 0 2px 6px rgba(74,59,40,0.14), inset 0 0 0 1px rgba(255,255,255,0.4);
  }
  body.beige button.theme:active, body.beige button.theme.on {
    background: #e6dcc3;
    border-bottom-color: #8c7b52;
    box-shadow: 0 -3px 8px rgba(74,59,40,0.12), 0 6px 16px rgba(74,59,40,0.28), 0 2px 6px rgba(74,59,40,0.20);
  }
  body.beige iframe { background: #f4ecd8; }
  body.beige .empty { color: #6b5c46; }
  /* 系统深色模式：让顶层标签栏/按钮也跟随系统一起变暗（之前只有正文跟系统走） */
  @media (prefers-color-scheme: dark) {
    body:not(.light):not(.beige) { background: #0d1117; color: #c9d1d9; }
    body:not(.light):not(.beige) #chrome { background: #161b22; border-bottom-color: #30363d; }
    body:not(.light):not(.beige) .tab:hover {
      background: #30363d;
      border-color: #3b424b;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255,255,255,0.04);
      z-index: 1;
    }
    body:not(.light):not(.beige) .tab.active {
      background: #0d1117;
      border-color: #30363d;
      border-bottom-color: #c9d1d9;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.16), 0 4px 12px rgba(0,0,0,0.55), 0 1px 3px rgba(0,0,0,0.5);
      z-index: 2;
    }
    body:not(.light):not(.beige) .nav { background: #21262d; color: #c9d1d9; border-color: #30363d; }
    body:not(.light):not(.beige) .nav:hover {
      box-shadow: 0 2px 6px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.04);
    }
    body:not(.light):not(.beige) .nav:active, body:not(.light):not(.beige) .nav.on {
      border-bottom-color: #c9d1d9;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.16), 0 4px 12px rgba(0,0,0,0.55), 0 1px 3px rgba(0,0,0,0.5);
    }
    body:not(.light):not(.beige) button.theme { background: #161b22; color: #c9d1d9; border-color: transparent; }
    body:not(.light):not(.beige) button.theme:hover { background: #21262d; border-color: #30363d; border-bottom-color: #30363d; box-shadow: 0 2px 6px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.04); }
    body:not(.light):not(.beige) button.theme:active, body:not(.light):not(.beige) button.theme.on { background: #21262d; border-bottom-color: #c9d1d9; box-shadow: 0 0 0 1px rgba(255,255,255,0.16), 0 4px 12px rgba(0,0,0,0.55), 0 1px 3px rgba(0,0,0,0.5); }
    body:not(.light):not(.beige) #topbar button.toolbtn { background: #161b22; color: #c9d1d9; border-color: transparent; }
    body:not(.light):not(.beige) #topbar button.toolbtn:hover { background: #21262d; border-color: #30363d; border-bottom-color: #30363d; box-shadow: 0 2px 6px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.04); }
    body:not(.light):not(.beige) #topbar button.toolbtn:active, body:not(.light):not(.beige) #topbar button.toolbtn.on { background: #21262d; border-bottom-color: #c9d1d9; box-shadow: 0 0 0 1px rgba(255,255,255,0.16), 0 4px 12px rgba(0,0,0,0.55), 0 1px 3px rgba(0,0,0,0.5); }
    body:not(.light):not(.beige) #tablist { background: #161b22; border-color: #30363d; }
    body:not(.light):not(.beige) #tablist .li:hover,
    body:not(.light):not(.beige) #tablist .li.active { background: #30363d; }
    body:not(.light):not(.beige) .popmenu { background: #161b22; border-color: #30363d; }
    body:not(.light):not(.beige) .popmenu .hli:hover { background: #30363d; }
    body:not(.light):not(.beige) iframe { background: #0d1117; }
    body:not(.light):not(.beige) .empty { color: #8b949e; }
  }
  /* 顶栏下拉菜单（「导出」「帮助」共用同一套 UI：出现在按钮正下方，点外部自动关闭） */
  .popmenu {
    position: fixed; z-index: 60; display: none;
    min-width: 120px; background: #fff; border: 1px solid #d0d7de; border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .18); padding: 4px;
  }
  .popmenu .hli {
    display: block; padding: 6px 14px; border-radius: 4px; cursor: pointer;
    font-size: 13px; white-space: nowrap;
  }
  .popmenu .hli:hover { background: #eaeef2; }
  body.dark .popmenu { background: #161b22; border-color: #30363d; box-shadow: 0 4px 16px rgba(0, 0, 0, .5); }
  body.dark .popmenu .hli:hover { background: #30363d; }
  body.beige .popmenu { background: #f4ecd8; border-color: #d8cba8; }
  body.beige .popmenu .hli:hover { background: #e0d5b8; }
  /* 反馈 / 关于 / 检查更新 弹窗 */
  #fbModal, #aboutModal, #updateModal {

  <script>
  /* 独立自包含脚本：放在 chrome 绘制之后、主脚本之前，不依赖后面任何代码。
     作用是把「窗口控制」和「标题栏拖动」做成最底层能力——即使后续脚本出错，
     最小 / 最大化 / 关闭 / 拖动依然可用（否则会出现关不掉窗口的死局）。 */
  (function () {
    function note(m) { try { var s = document.getElementById("status"); if (s) s.textContent = m; } catch (e) {} }
    function ready() { return !!(window.pywebview && window.pywebview.api); }
    function callApi(name) {
      if (!ready()) { note("窗口控制需要更新后的 exe"); return null; }
      try { return window.pywebview.api[name](); } catch (e) { note("窗口控制调用失败"); return null; }
    }

    /* ---- 窗口控制 ---- */
    var minB = document.getElementById("minBtn");
    var maxB = document.getElementById("maxBtn");
    var closeB = document.getElementById("closeBtn");
    if (minB) {
      minB.dataset.wired = "1";
      minB.addEventListener("click", function () { callApi("window_minimize"); });
    }
    if (closeB) {
      closeB.dataset.wired = "1";
      closeB.addEventListener("click", function () {
        // 关闭前尽力再落盘一次阅读位置（真正的位置保存在滚动停止时已写入，
        // 这里只是双保险，失败也不影响退出）
        try { if (window.saveSession) window.saveSession(); } catch (e) {}
        callApi("window_close");
      });
    }
    if (maxB) {
      maxB.dataset.wired = "1";
      maxB.addEventListener("click", function () {
        var maxed = maxB.getAttribute("data-max") === "1";
        var p = callApi(maxed ? "window_restore" : "window_maximize");
        var done = function () {
          maxB.setAttribute("data-max", maxed ? "0" : "1");
          maxB.innerHTML = maxed ? "&#9633;" : "&#9634;";
          maxB.title = maxed ? "最大化" : "还原";
        };
        if (p && p.then) { p.then(done); } else { done(); }
      });
    }

    /* ---- 标题栏拖动（自建实现，不依赖 pywebview 内置 easy_drag） ---- */
    var dragging = false, sx = 0, sy = 0;
    function inDragRegion(el) {
      try { return !!(el && el.closest && el.closest(".pywebview-drag-region")); } catch (e) { return false; }
    }
    document.addEventListener("mousedown", function (ev) {
      if (ev.button !== 0) return;
      var t = ev.target;
      if (!inDragRegion(t)) return;
      // 不要吃掉按钮 / 复选框 / 链接等可交互元素的点击
      if (t.closest && t.closest("button, input, select, textarea, a, label")) return;
      if (!ready()) return;
      dragging = true;
      sx = ev.screenX; sy = ev.screenY;
      try { window.pywebview.api.window_drag_start(); } catch (e) {}
      ev.preventDefault();
    });
    window.addEventListener("mousemove", function (ev) {
      if (!dragging || !ready()) return;
      try { window.pywebview.api.window_move(ev.screenX - sx, ev.screenY - sy); } catch (e) {}
    });
    window.addEventListener("mouseup", function () { dragging = false; });
    window.addEventListener("blur", function () { dragging = false; });
  })();
  </script>

  <script>
    window.__pending = window.__pending || [];
    var tabs = [];      // {id, name, el, iframe}
    var activeId = null;
    var counter = 0;

      "--color-prettylights-syntax-string-regexp:#7ee787",

      "--color-prettylights-syntax-variable:#ffa657",

      "--fgColor-danger:#f85149",

    ];
    var DARK_VARS_CSS = ".markdown-body.dark{color-scheme:dark;" + DARK_VARS.join(";") + ";}html.dark{color-scheme:dark;}";

    // 锁定字号，让三种主题完全一致。
    // 背景：模板里暗色用的是 .markdown-body.dark h1{font-size:2em}，特异度(0,2,1)高于
    // 排版覆盖层的 .markdown-body h1{font-size:20px}(0,1,1)，于是暗色标题会退回 2em
    // → 14px×2 = 28px，比亮色/米色的 20px 明显偏大。这里用 !important 一并锁死。
    // 数值取自 wb_overrides.css（WorkBuddy 同款排版）：正文14 / H1 20 / H2 18 / H3 16 / H4-H6 14
    var FONT_PIN_CSS = [
      ".markdown-body{font-size:14px !important;}",
      ".markdown-body h1{font-size:20px !important;}",
      ".markdown-body h2{font-size:18px !important;}",
      ".markdown-body h3{font-size:16px !important;}",
      ".markdown-body h4,.markdown-body h5,.markdown-body h6{font-size:14px !important;}"
    ].join("");
    function ensureFontPin(iframe) {
      try {
        var d = iframe.contentDocument;
        if (!d || !d.head) return;
        // 已存在则就地更新内容，保证改样式后旧标签也能立刻跟上
        var s = d.getElementById("md-font-pin");
        if (!s) {
          s = d.createElement("style");
          s.id = "md-font-pin";
          d.head.appendChild(s);
        }
        s.textContent = FONT_PIN_CSS;
      } catch (e) {}
    }

    function ensureDarkVars(iframe) {
      try {
        var d = iframe.contentDocument;
        if (!d || !d.head) return;
        if (d.getElementById("md-dark-vars")) return;
        var s = d.createElement("style");
        s.id = "md-dark-vars";
        s.textContent = DARK_VARS_CSS;
        d.head.appendChild(s);
      } catch (e) {}
    }

    // 米色主题：柔和米色底 + 暖深灰字，长时间阅读比纯白更柔和（替代原护眼绿）
    var BEIGE_VARS = [
      "--bgColor-default:#f4ecd8",
      "--fgColor-default:#4a3b28",
      "--fgColor-muted:#6b5c46",
      "--borderColor-default:#d8cba8",
      "--bgColor-muted:#efe7d2",
      "--borderColor-muted:#d8cba8b3",
      "--fgColor-accent:#8a5a2b",
      "--fgColor-success:#4a7a2c",
      "--fgColor-danger:#a63d2f",
      "--fgColor-attention:#8a6d00",
      "--fgColor-done:#6b4fa0",
      "--borderColor-accent-emphasis:#8a5a2b",
      "--borderColor-danger-emphasis:#a63d2f",
      "--borderColor-success-emphasis:#4a7a2c",
      "--borderColor-attention-emphasis:#8a6d00",
      "--borderColor-done-emphasis:#6b4fa0"
    ];
    var BEIGE_VARS_CSS =
      "html.beige,body.beige{background-color:#f4ecd8;color:#4a3b28;}" +
      ".markdown-body.beige{color-scheme:light;" + BEIGE_VARS.join(";") + ";}" +
      ".markdown-body.beige{background-color:#f4ecd8;color:#4a3b28;}" +
      ".markdown-body.beige h1,.markdown-body.beige h2,.markdown-body.beige h3,.markdown-body.beige h4,.markdown-body.beige h5,.markdown-body.beige h6{color:#3d3020;border-bottom-color:#d8cba8;}" +
      ".markdown-body.beige a{color:#8a5a2b;}" +
      ".markdown-body.beige blockquote{border-left-color:#d8cba8;color:#6b5c46;}" +
      ".markdown-body.beige hr{border-top-color:#d8cba8;}" +
      ".markdown-body.beige table th,.markdown-body.beige table td{border-color:#d8cba8;}" +
      ".markdown-body.beige pre{background:#efe7d2 !important;border-color:#d8cba8 !important;}" +
      ".markdown-body.beige code,.markdown-body.beige tt{background:#e6dcc3 !important;color:#3d3020;}" +
      // 内容页残留的模板元素（隐藏前的工具栏/提示区）一并染米色
      "body.beige #toolbar{background:#efe7d2;border-bottom-color:#d8cba8;}" +
      "body.beige #toolbar button{background:#e6dcc3;color:#4a3b28;border-color:#d8cba8;}" +
      "body.beige #status{color:#6b5c46;}" +
      "body.beige #hint{color:#6b5c46;}" +
      "body.beige #hint code{background:#e6dcc3;}";

    function ensureBeigeVars(iframe) {
      try {
        var d = iframe.contentDocument;
        if (!d || !d.head) return;
        if (d.getElementById("md-beige-vars")) return;
        var s = d.createElement("style");
        s.id = "md-beige-vars";
        s.textContent = BEIGE_VARS_CSS;
        d.head.appendChild(s);
      } catch (e) {}
    }

    function addTab(p) {
      p = (typeof p === "string") ? JSON.parse(p) : p;
      // 同名文档：直接激活已有标签，避免重复
      var hit = null;
      for (var i = 0; i < tabs.length; i++) { if (tabs[i].name === p.name) { hit = tabs[i]; break; } }
      if (hit) { activate(hit.id); return; }

      var empty = document.querySelector("#views .empty");
      if (empty) empty.remove();

      var id = "t" + (counter++);
      var el = document.createElement("div");
      el.className = "tab";
      el.draggable = true;      // 允许拖拽调整顺序
      el.dataset.tid = id;      // 供拖放后同步 tabs 数组顺序
      el.title = "点击切换，拖拽可调整顺序";
      var nm = document.createElement("span");
      nm.className = "nm"; nm.textContent = p.name; nm.title = p.name;
      var x = document.createElement("span");
      x.className = "x"; x.textContent = "×";
      el.appendChild(nm); el.appendChild(x);

      el.addEventListener("click", function (e) {
        if (e.target === x) return;
        activate(id);
      });
      // 拖拽排序：只移动标签条上的小标签，绝不搬动 iframe（搬 iframe 会触发重载、丢失滚动位置）
      el.addEventListener("dragstart", function (e) {
        tabDragId = id;
        el.classList.add("dragging");
        try {
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", id);
        } catch (err) {}
      });
      el.addEventListener("dragend", function () {
        tabDragId = null;
        el.classList.remove("dragging");
        syncTabOrderFromDom();
        updateNav();
      });
      x.addEventListener("click", function (e) {
        e.stopPropagation(); closeTab(id);
      });

      // 标签直接追加进可滚动区（不再依赖已移除的 .spacer 占位）
      document.getElementById("tabs").appendChild(el);

      var iframe = document.createElement("iframe");
      // scrollY：恢复上次关闭本软件时的阅读位置（由 Python 侧从会话配置带入）
      var t = { id: id, name: p.name, path: p.path || "", el: el, iframe: iframe,
                scrollY: p.scrollY || 0 };
      try {
        iframe.addEventListener("load", function () {
          applyTheme(iframe);
          watchScroll(t);                       // 监听滚动，实时记下阅读位置
          if (t.scrollY) restoreScroll(iframe, t.scrollY);
        });
      } catch (e) {}
      iframe.srcdoc = p.html;
      document.getElementById("views").appendChild(iframe);

      tabs.push(t);
      activate(id);
      updateNav();
      saveSession();
    }

    // ---- 阅读位置记忆：切换标签时记住滚动位置，切回时恢复 ----
    // iframe 一旦 display:none 就脱离布局，再次显示会重新布局并把滚动位置清零，
    // 所以必须在切走前主动读取、切回后主动写回。
    function ifScrollY(fr) {
      try {
        var w = fr.contentWindow, d = fr.contentDocument;
        if (!w || !d) return 0;
        if (typeof w.pageYOffset === "number") return w.pageYOffset;
        return (d.documentElement && d.documentElement.scrollTop) || (d.body && d.body.scrollTop) || 0;
      } catch (e) { return 0; }
    }
    function ifScrollTo(fr, y) {
      try {
        var w = fr.contentWindow, d = fr.contentDocument;
        if (!w || !d || !y) return;
        if (w.scrollTo) w.scrollTo(0, y);
        else {
          if (d.documentElement) d.documentElement.scrollTop = y;
          if (d.body) d.body.scrollTop = y;
        }
      } catch (e) {}
    }
    // 恢复显示后布局要 1~2 帧才稳定，重试几次确保真的落位。
    // __restoreTo 有三重作用：① 记录恢复目标；② 期间 saveSession 不得用实时读数
    // 覆盖已记位置；③ 恢复自身引起的 scroll 事件可被识别并忽略。
    function restoreScroll(fr, y) {
      if (!fr || !y) return;
      var tries = 0;
      fr.__restoreTo = y;
      function step() {
        if (!fr.parentNode || fr.__restoreTo !== y) return;  // 标签已关 / 用户已接管
        if (fr.style.display === "none") { fr.__restoreTo = 0; return; }
        ifScrollTo(fr, y);
        if (Math.abs(ifScrollY(fr) - y) <= 2 || ++tries >= 6) { fr.__restoreTo = 0; return; }
        setTimeout(step, 80);
      }
      step();
    }

    // ---- 阅读位置持续持久化 ----
    // 只在滚动停止后写一次配置（尾部防抖），避免每帧都写盘；这样即使直接关窗口
    // 或被强杀，上次读到的位置也已经落盘，下次冷启动能接着读。
    var scrollSaveTimer = null;
    function scheduleSave() {
      try {
        if (scrollSaveTimer) clearTimeout(scrollSaveTimer);
        scrollSaveTimer = setTimeout(function () { scrollSaveTimer = null; saveSession(); }, 800);
      } catch (e) {}
    }
    // iframe 内容尚未就绪时 ifScrollY 会返回 0，不能拿它覆盖已记住的位置
    function ifScrollReady(fr) {
      try {
        return !!(fr && fr.contentWindow && fr.contentDocument && fr.contentDocument.body);
      } catch (e) { return false; }
    }
    // 给已加载的标签装上滚动监听
    function watchScroll(t) {
      try {
        var w = t.iframe.contentWindow;
        if (!w || t.__scrollWatched) return;
        t.__scrollWatched = true;
        w.addEventListener("scroll", function () {
          // 关键：iframe 被 display:none 隐藏时，Chromium 会把它的滚动归零并
          // 派发一次 scroll 事件。绝不能拿这个 0 覆盖已记住的位置——否则每次
          // 切走标签，位置就被清零了。
          if (t.iframe.style.display === "none") return;
          var cur = ifScrollY(t.iframe);
          // 恢复滚动动作自身引起的滚动（位置≈目标值）不是用户滚动，忽略
          if (t.iframe.__restoreTo && Math.abs(cur - t.iframe.__restoreTo) <= 2) return;
          t.iframe.__restoreTo = 0;      // 用户真的自己滚了 → 立即取消恢复
          t.scrollY = cur;
          scheduleSave();
        }, { passive: true });
      } catch (e) {}
    }

    function activate(id) {
      // 切走前：先记下当前活动标签的阅读位置
      // （恢复还在进行中的标签不动它——此刻实时读数可能还是 0）
      for (var k = 0; k < tabs.length; k++) {
        if (tabs[k].id === activeId && tabs[k].iframe && !tabs[k].iframe.__restoreTo) {
          tabs[k].scrollY = ifScrollY(tabs[k].iframe);
        }
      }
      activeId = id;
      for (var i = 0; i < tabs.length; i++) {
        var on = tabs[i].id === id;
        tabs[i].el.classList.toggle("active", on);
        tabs[i].iframe.style.display = on ? "block" : "none";
        if (on) restoreScroll(tabs[i].iframe, tabs[i].scrollY || 0);
        // 切换时把当前标签滚进可视范围
        if (on && tabs[i].el && tabs[i].el.scrollIntoView) {
          try { tabs[i].el.scrollIntoView({ block: "nearest", inline: "nearest" }); } catch (e) {}
        }
      }
      refreshTabListIfOpen();
      saveSession();
    }

    // 标签栏左右滚动
    function scrollTabs(dir) {
      try {
        var t = document.getElementById("tabs");
        if (!t) return;
        var step = Math.max(120, Math.round(t.clientWidth * 0.6));
        if (t.scrollBy) t.scrollBy({ left: dir * step, behavior: "smooth" });
        else t.scrollLeft += dir * step;
      } catch (e) {}
    }

    // ---- 拖拽调整标签顺序 ----
    // 根据指针 x 坐标判断应插入到哪个标签之前
    function dragAfterElement(container, x) {
      var els = container.querySelectorAll(".tab:not(.dragging)");
      for (var i = 0; i < els.length; i++) {
        var b = els[i].getBoundingClientRect();
        if (x < b.left + b.width / 2) return els[i];
      }
      return null;
    }
    // 拖放后，让 tabs 数组顺序与标签条上的 DOM 顺序一致
    function syncTabOrderFromDom() {
      try {
        var els = document.getElementById("tabs").querySelectorAll(".tab");
        var order = [];
        for (var i = 0; i < els.length; i++) order.push(els[i].dataset.tid);
        tabs.sort(function (a, b) { return order.indexOf(a.id) - order.indexOf(b.id); });
        refreshTabListIfOpen();
        saveSession();
      } catch (e) {}
    }

    // 标签没溢出时隐藏左右滚动按钮，溢出时才显示
    function updateNav() {
      try {
        var t = document.getElementById("tabs");
        var pv = document.getElementById("navPrev");
        var nx = document.getElementById("navNext");
        if (!t || !pv || !nx) return;
        var over = t.scrollWidth > t.clientWidth + 2;
        pv.style.display = over ? "inline-flex" : "none";
        nx.style.display = over ? "inline-flex" : "none";
      } catch (e) {}
      refreshTabListIfOpen();
    }

    // ---- 垂直列显示：把所有标签名竖排列出，点一条即切换 ----
    function renderTabList() {
      try {
        var box = document.getElementById("tablist");
        if (!box) return;
        box.innerHTML = "";
        if (tabs.length === 0) {
          var e = document.createElement("div");
          e.className = "li"; e.style.cursor = "default";
          e.textContent = "(没有打开的文档)";
          box.appendChild(e);
          return;
        }
        for (var i = 0; i < tabs.length; i++) {
          (function (t) {
            var d = document.createElement("div");
            d.className = "li" + (t.id === activeId ? " active" : "");
            d.textContent = t.name;
            d.title = t.name;
            d.addEventListener("click", function () { activate(t.id); toggleTabList(false); });
            box.appendChild(d);
          })(tabs[i]);
        }
      } catch (err) {}
    }

    function refreshTabListIfOpen() {
      try {
        var box = document.getElementById("tablist");
        if (box && box.style.display === "block") renderTabList();
      } catch (err) {}
    }

    // ---- 菜单系统：☰面板 / 「导出」/ 「帮助」共用一套开合与掩体逻辑 ----
    function _closePopMenus(exceptId) {
      // 同一时刻只开一个顶栏下拉：开一个先收其它
      var ids = ["exportMenu", "helpMenu"];
      for (var i = 0; i < ids.length; i++) {
        if (ids[i] === exceptId) continue;
        var m = document.getElementById(ids[i]);
        if (m) m.style.display = "none";
        var b = document.getElementById(ids[i].replace(/Menu$/, "Btn"));
        if (b) b.classList.remove("on");           // 同步清掉按钮选中态
      }
    }
    function _anyMenuOpen() {
      var tl = document.getElementById("tablist");
      var hm = document.getElementById("helpMenu");
      var em = document.getElementById("exportMenu");
      return (tl && tl.style.display === "block")
          || (hm && hm.style.display === "block")
          || (em && em.style.display === "block");
    }
    function _syncMask() {
      // 有任一面板/菜单开着就保留掩体（iframe 内点击不冒泡，靠它兜底），全关即撤
      var mask = document.getElementById("tabmask");
      if (mask) mask.style.display = _anyMenuOpen() ? "block" : "none";
    }
    function toggleTabList(force) {
      try {
        var box = document.getElementById("tablist");
        var btn = document.getElementById("navList");
        if (!box || !btn) return;
        var show = (typeof force === "boolean") ? force : (box.style.display !== "block");
        if (show) {
          renderTabList();
          _closePopMenus(null);                 // 顶栏下拉让位
          var r = btn.getBoundingClientRect();   // 让面板出现在按钮正下方
          box.style.left = Math.max(4, r.left) + "px";
          box.style.top = (r.bottom + 4) + "px";
          box.style.display = "block";
          btn.classList.add("on");               // ☰ 选中态：立体凸起 + 阴影
          var mask = document.getElementById("tabmask");
          if (mask) mask.style.display = "block";
        } else {
          box.style.display = "none";
          btn.classList.remove("on");
          _syncMask();
        }
      } catch (err) {}
    }

    // ---- 顶栏下拉菜单（「导出」「帮助」共用；按钮 id = 菜单 id 去掉 Menu 后缀）----
    function toggleMenu(menuId, force) {
      try {
        var menu = document.getElementById(menuId);
        var btn = document.getElementById(menuId.replace(/Menu$/, "Btn"));
        if (!menu || !btn) return;
        var show = (typeof force === "boolean") ? force : (menu.style.display !== "block");
        if (show) {
          _closePopMenus(menuId);                // 收起另一个下拉
          var tl = document.getElementById("tablist");
          if (tl) tl.style.display = "none";     // ☰ 面板也让位
          var r = btn.getBoundingClientRect();   // 菜单出现在按钮正下方
          menu.style.left = Math.max(4, r.left) + "px";
          menu.style.top = (r.bottom + 4) + "px";
          menu.style.display = "block";
          if (btn) btn.classList.add("on");      // 下拉展开 = 按钮选中态：立体凸起 + 阴影
          var mask = document.getElementById("tabmask");
          if (mask) mask.style.display = "block";
        } else {
          menu.style.display = "none";
          if (btn) btn.classList.remove("on");
          _syncMask();
        }
      } catch (err) {}
    }
    function toggleExportMenu(force) { toggleMenu("exportMenu", force); }
    function toggleHelpMenu(force) { toggleMenu("helpMenu", force); }
    function showAboutModal() {
      try {
        var v = document.getElementById("aboutVer");
        if (v) v.textContent = "PureMD v" + APP_VERSION;
        var m = document.getElementById("aboutModal");
        if (m) m.style.display = "flex";
      } catch (err) {}
    }

      try { var m = document.getElementById("aboutModal"); if (m) m.style.display = "none"; } catch (err) {}

    // ---- 会话保存：把当前打开的标签（文件路径）与激活项写入本地配置 ----
    // 下次启动（双击 .md）时由 Python 侧读取并自动恢复这些标签
    function saveSession() {
      try {
        if (!hasApi() || !window.pywebview.api.set_config) return;
        var files = [], scroll = {};
        for (var i = 0; i < tabs.length; i++) {
          if (!tabs[i].path) continue;
          files.push(tabs[i].path);
          // 当前可见标签以实时滚动位置为准；其余用切走时记下的值。
          // 内容还没加载好时不能拿 0 覆盖掉已记住的位置，否则冷启动恢复会失效。
          var y = tabs[i].scrollY || 0;
          if (tabs[i].id === activeId && ifScrollReady(tabs[i].iframe) &&
              !tabs[i].iframe.__restoreTo) {
            y = ifScrollY(tabs[i].iframe);
            tabs[i].scrollY = y;
          }
          scroll[tabs[i].path] = Math.round(y) || 0;
        }
        var active = activeTab();
        saveCfg({ session: { files: files, active: (active && active.path) ? active.path : "",
                             scroll: scroll } });
      } catch (e) {}
    }
    // 窗口被关闭/进程退出前的最后一道保险：尽力再写一次会话
    window.addEventListener("beforeunload", function () { try { saveSession(); } catch (e) {} });
    window.addEventListener("pagehide", function () { try { saveSession(); } catch (e) {} });

    function closeTab(id) {
      var idx = -1;
      for (var i = 0; i < tabs.length; i++) { if (tabs[i].id === id) { idx = i; break; } }
      if (idx < 0) return;
      tabs[idx].el.remove();
      tabs[idx].iframe.remove();
      tabs.splice(idx, 1);
      if (tabs.length === 0) {
        activeId = null;
        document.getElementById("views").innerHTML =
          '<div class="empty">没有打开的文档 &mdash; 双击任意 .md 即可在此打开</div>';
        updateNav();
        saveSession();
        return;
      }
      activate(tabs[Math.max(0, idx - 1)].id);
      updateNav();
      saveSession();
    }

    function applyTheme(iframe) {
      try {
        var d = iframe.contentDocument;
        if (!d) return;
        var on = (theme !== "light");
        [d.body, d.documentElement].forEach(function (el) {
          if (!el) return;
          el.classList.remove("dark", "beige");
          if (on) el.classList.add(theme);
        });
        var nodes = d.querySelectorAll(".markdown-body");
        for (var i = 0; i < nodes.length; i++) {
          nodes[i].classList.remove("dark", "beige");
          if (on) nodes[i].classList.add(theme);
        }
        var c = d.getElementById("content");
        if (c) { c.classList.remove("dark", "beige"); if (on) c.classList.add(theme); }
        ensureFontPin(iframe);
        if (theme === "dark") ensureDarkVars(iframe);
        else if (theme === "beige") ensureBeigeVars(iframe);
      } catch (e) {}
    }

    function updateThemeBtn() {
      try {
        var b = document.getElementById("themeBtn");
        if (!b) return;
        var label = (theme === "dark") ? "主题：暗色" : (theme === "beige") ? "主题：米色" : "主题：亮色";
        b.textContent = label;
      } catch (e) {}
    }

    // 统一套用当前主题：顶层界面（标签栏/按钮/窗口底） + 每个内容标签页
    function applyAll() {
      document.body.classList.remove("dark", "beige", "light");
      if (theme !== "light") document.body.classList.add(theme);
      else document.body.classList.add("light");
      for (var i = 0; i < tabs.length; i++) applyTheme(tabs[i].iframe);
      updateThemeBtn();
    }

    // 点击循环：亮色 → 暗色 → 米色 → 亮色
    function toggleTheme() {
      userToggled = true;            // 用户手动操作后不再被系统主题覆盖
      theme = (theme === "light") ? "dark" : (theme === "dark") ? "beige" : "light";
      applyAll();
      saveCfg({ theme: theme });     // 记住用户选择，下次打开仍是这个主题
    }

    // 初始：跟随系统深色偏好；之后系统切换时若用户没手动改过，自动跟随
    (function initTheme() {
      try {
        if (window.matchMedia) {
          var mq = window.matchMedia("(prefers-color-scheme: dark)");
          if (mq.matches) theme = "dark";
          var onSys = function (e) { if (!userToggled) { theme = e.matches ? "dark" : "light"; applyAll(); } };
          if (mq.addEventListener) mq.addEventListener("change", onSys);
          else if (mq.addListener) mq.addListener(onSys);
        }
      } catch (e) {}
      applyAll();
      // 尝试从本地配置恢复用户上次的主题 / 自动刷新偏好
      try {
        if (hasApi() && window.pywebview.api.get_config) {
          window.pywebview.api.get_config().then(function (cfg) {
            if (cfg && cfg.theme && (cfg.theme === "dark" || cfg.theme === "beige" || cfg.theme === "light")) {
              theme = cfg.theme; userToggled = true; applyAll();
            }
            if (cfg && typeof cfg.autoWatch === "boolean") {
              var wc = document.getElementById("watchChk");
              if (wc) wc.checked = cfg.autoWatch;
            }
          }).catch(function () {});
          // 启动 2.5s 后自动检查新版本（异步不阻塞首屏；失败静默；可在帮助菜单关掉）
          if (cfg && typeof cfg.auto_update_check === "boolean") cfgAutoChk = cfg.auto_update_check;
          setAutoChkLabel();
          setTimeout(function () { checkUpdateFlow(false); }, 2500);
        }
      } catch (e) {}
    })();

    // ---- 顶部工具栏：打开文件 / 重新加载 / 自动刷新（功能需要 Python 侧 js_api 支持）----
    function setStatus(msg) {
      try { var s = document.getElementById("status"); if (s) s.textContent = msg || ""; } catch (e) {}
    }

    // ---- 检查更新 ----
    var pendingUpdate = null;   // 当前弹窗里的更新信息
    var cfgAutoChk = true;      // 自动检查开关（启动时从本地配置恢复）
    function showUpdateModal(up) {
      try {
        pendingUpdate = up || null;
        var v = document.getElementById("updVer");
        if (v) v.textContent = "PureMD v" + APP_VERSION + "  →  v" + (up && up.latest ? up.latest : "?");
        var n = document.getElementById("updNotes");

    function openReleasePage() {

        if (!url) { setStatus("该版本没有提供下载地址"); return; }
        if (hasApi() && window.pywebview.api.open_url) {
          window.pywebview.api.open_url(url).then(function (ok) {
            setStatus(ok ? "已请求浏览器打开发布页" : "打开浏览器失败，请手动访问：" + url);
          }).catch(function () { setStatus("打开浏览器失败，请手动访问：" + url); });
        } else {

        }
        closeUpdateModal();

    }
    function skipThisVersion() {
      try {
        if (pendingUpdate && pendingUpdate.latest) {
          saveCfg({ skipped_version: pendingUpdate.latest });
          setStatus("已跳过 v" + pendingUpdate.latest + "，下次发布新版本时再提醒");

    function setAutoChkLabel() {
      try {
        var it = document.getElementById("helpAutoChk");
        if (it) it.textContent = "自动检查更新：" + (cfgAutoChk ? "开" : "关");
      } catch (e) {}
    }
    // manual=true：用户主动检查（总是联网、总报告结果）；false：启动自动检查（静默）
    function checkUpdateFlow(manual) {
      try {
        if (!hasApi() || !window.pywebview.api.check_update) {
          if (manual) setStatus("此功能需要更新后的 exe");
          return;
        }
        if (manual) setStatus("正在检查更新…");
        window.pywebview.api.check_update(manual).then(function (up) {
          if (!up) { if (manual) setStatus("检查更新失败：接口无响应"); return; }
          if (up.ok && up.has_update) {
            if (manual) setStatus("发现新版本 v" + up.latest);
            showUpdateModal(up);
          } else if (up.ok) {
            if (manual) setStatus("已是最新版本（v" + up.current + "）");
          } else if (manual) {
            setStatus("检查更新失败：" + (up.error || "未知错误"));
          }
        }).catch(function (e) {
          if (manual) setStatus("检查更新失败：" + (e && e.message ? e.message : e));
        });
      } catch (e) {}
    }
    // 点击弹窗外区域关闭（反馈 / 关于 / 检查更新）

    // 本地配置（主题 / 自动刷新等）持久化：读 / 写都走 Python 侧，失败时静默
    function saveCfg(obj) {
      try {
        if (hasApi() && window.pywebview.api.set_config) {
          window.pywebview.api.set_config(obj).catch(function () {});
        }
      } catch (e) {}
    }
    function hasApi() { return !!(window.pywebview && window.pywebview.api); }
    function activeTab() {
      for (var i = 0; i < tabs.length; i++) { if (tabs[i].id === activeId) return tabs[i]; }
      return null;
    }
    // Python 侧（自动刷新/重新加载）推送新内容时调用：按文件名找到标签并换掉内容
    window.__updateTab = function (p) {
      try {
        p = (typeof p === "string") ? JSON.parse(p) : p;
        if (!p || !p.name) return;
        var hit = null;
        for (var i = 0; i < tabs.length; i++) { if (tabs[i].name === p.name) { hit = tabs[i]; break; } }
        if (!hit) return;
        var fr = hit.iframe;
        // 自动刷新 / 重新加载前先记下当前阅读位置，重载后写回，避免跳回开头
        var keep = ifScrollY(fr);
        hit.scrollY = keep;
        fr.onload = function () {
          applyTheme(fr);
          restoreScroll(fr, keep);
        };
        fr.srcdoc = p.html;
      } catch (e) {}
    };
    function wireToolbar() {
      try {
        var ob = document.getElementById("openBtn");
        var rb = document.getElementById("reloadBtn");
        var wc = document.getElementById("watchChk");
        if (ob) ob.addEventListener("click", function () {
          if (!hasApi()) { setStatus("此功能需要更新后的 exe"); return; }
          window.pywebview.api.open_files().then(function (items) {
            if (items && items.length) {
              items.forEach(function (p) { if (p && p.name) addTab(p); });
              setStatus("已打开 " + items.length + " 个文件");
            } else if (items === null) {
              setStatus("已取消");
            } else {
              setStatus("打开文件失败：未返回任何文件");
            }
          }).catch(function (e) {
            setStatus("打开文件失败：" + (e && e.message ? e.message : e));
          });
        });
        if (rb) rb.addEventListener("click", function () {
          var t = activeTab();
          if (!hasApi()) { setStatus("此功能需要更新后的 exe"); return; }
          if (!t || !t.path) { setStatus("当前标签没有源文件路径"); return; }
          window.pywebview.api.reload(t.path).then(function (p) {
            if (p && p.name) { window.__updateTab(p); setStatus("已重新加载"); }
            else if (p && p.error) setStatus(p.error);
          }).catch(function (e) {
            setStatus("重新加载失败：" + (e && e.message ? e.message : e));
          });
        });
        if (wc) wc.addEventListener("change", function () {
          var t = activeTab();
          if (!hasApi()) { wc.checked = false; setStatus("此功能需要更新后的 exe"); return; }
          if (!t || !t.path) { wc.checked = false; setStatus("当前标签没有源文件路径"); return; }
          window.pywebview.api.set_watch(t.path, wc.checked).then(function (ok) {
            if (ok === false) { wc.checked = false; setStatus("自动刷新设置失败"); }
            else { setStatus(wc.checked ? "自动刷新：开" : "自动刷新：关"); saveCfg({ autoWatch: wc.checked }); }
          }).catch(function (e) {
            wc.checked = false;
            setStatus("自动刷新失败：" + (e && e.message ? e.message : e));
          });
        });
        var hb = document.getElementById("helpBtn");
        if (hb) hb.addEventListener("click", function (e) { e.stopPropagation(); toggleHelpMenu(); });
        var hf = document.getElementById("helpFeedback");
        if (hf) hf.addEventListener("click", function () {
          toggleHelpMenu(false);
          // 只弹出邮箱信息，不自动拉起邮件客户端
          showFeedbackModal(FEEDBACK_EMAIL);
        });
        var ha = document.getElementById("helpAbout");
        if (ha) ha.addEventListener("click", function () { toggleHelpMenu(false); showAboutModal(); });
        var hu = document.getElementById("helpUpdate");
        if (hu) hu.addEventListener("click", function () { toggleHelpMenu(false); checkUpdateFlow(true); });
        var hc = document.getElementById("helpAutoChk");
        if (hc) hc.addEventListener("click", function () {
          // 不收起菜单，便于直接看到标签文案变化
          cfgAutoChk = !cfgAutoChk;
          setAutoChkLabel();
          saveCfg({ auto_update_check: cfgAutoChk });
          setStatus(cfgAutoChk ? "自动检查更新：开（每次启动时检查）" : "自动检查更新：关（仍可在帮助菜单手动检查）");
        });
        var exb = document.getElementById("exportBtn");
        if (exb) exb.addEventListener("click", function (e) { e.stopPropagation(); toggleExportMenu(); });
        var ep = document.getElementById("expPdf");
        if (ep) ep.addEventListener("click", function () { toggleExportMenu(false); exportPdf(); });
        var ew = document.getElementById("expWord");
        if (ew) ew.addEventListener("click", function () { toggleExportMenu(false); exportDocx(); });
      } catch (e) {}
    }
    wireToolbar();


    // 绑定左右滚动按钮；鼠标滚轮上下滚也转成标签区横向滚动
    try {
      var _p = document.getElementById("navPrev");
      var _n = document.getElementById("navNext");
      var _l = document.getElementById("navList");
      if (_p) _p.addEventListener("click", function () { scrollTabs(-1); });
      if (_n) _n.addEventListener("click", function () { scrollTabs(1); });
      if (_l) _l.addEventListener("click", function (e) { e.stopPropagation(); toggleTabList(); });
      // 透明掩体：菜单打开时盖住文档区，点它即关闭（iframe 内点击不冒泡的可靠解法）
      var _m = document.getElementById("tabmask");
      if (_m) {
        _m.addEventListener("mousedown", function () { toggleTabList(false); toggleExportMenu(false); toggleHelpMenu(false); });
        _m.addEventListener("click", function () { toggleTabList(false); toggleExportMenu(false); toggleHelpMenu(false); });
      }
      // 标签条接收拖放：实时把被拖的标签插入到指针所在位置
      var _tc = document.getElementById("tabs");
      if (_tc) {
        _tc.addEventListener("dragover", function (e) {
          if (!tabDragId) return;
          e.preventDefault();
          try { e.dataTransfer.dropEffect = "move"; } catch (err) {}
          var dragged = _tc.querySelector(".tab.dragging");
          if (!dragged) return;
          var after = dragAfterElement(_tc, e.clientX);
          if (after) {
            if (dragged.nextSibling !== after) _tc.insertBefore(dragged, after);
          } else if (_tc.lastChild !== dragged) {
            _tc.appendChild(dragged);
          }
        });
        _tc.addEventListener("drop", function (e) {
          if (!tabDragId) return;
          e.preventDefault();
          syncTabOrderFromDom();
          updateNav();
        });
      }
      // 点击空白处关闭列表面板 / 导出菜单 / 帮助菜单（点面板与对应按钮除外）
      function __menusOutsideClose(e) {
        try {
          var box = document.getElementById("tablist");
          var btn = document.getElementById("navList");
          if (box && box.style.display === "block") {
            if (!(btn && btn.contains(e.target)) && !box.contains(e.target)) toggleTabList(false);
          }
          var menu = document.getElementById("helpMenu");
          var hb = document.getElementById("helpBtn");
          if (menu && menu.style.display === "block") {
            if (!(hb && hb.contains(e.target)) && !menu.contains(e.target)) toggleHelpMenu(false);
          }
          var emenu = document.getElementById("exportMenu");
          var eb = document.getElementById("exportBtn");
          if (emenu && emenu.style.display === "block") {
            if (!(eb && eb.contains(e.target)) && !emenu.contains(e.target)) toggleExportMenu(false);
          }
        } catch (err) {}
      }
      document.addEventListener("pointerdown", __menusOutsideClose, true);
      document.addEventListener("click", __menusOutsideClose);
      var _t = document.getElementById("tabs");
      if (_t && _t.addEventListener) {
        _t.addEventListener("wheel", function (e) {
          if (e.deltaY) { _t.scrollLeft += e.deltaY; e.preventDefault(); }
        }, { passive: false });
      }
      window.addEventListener("resize", updateNav);
    } catch (e) {}

    window.__addTab = function (p) { addTab(p); };
    // 消费在 DOM/脚本就绪前到达的待处理项
    window.__pending.forEach(function (p) { addTab(p); });
    window.__pending.length = 0;
  </script>
  <div id="fbModal">

      <p>有问题或建议？请复制下面的邮箱发邮件给我：</p>
      <span class="email" id="fbEmail">xkwwang@126.com</span>
      <button type="button" onclick="copyFeedbackEmail()">复制邮箱</button>
      <button type="button" onclick="closeFeedbackModal()" style="margin-left:8px">关闭</button>

      <span class="ver" id="aboutVer">PureMD v1.0</span>
