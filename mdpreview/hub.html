      theme = (theme === "light") ? "dark" : (theme === "dark") ? "beige" : "light";
      applyAll();
      saveCfg({ theme: theme });     // 记住用户选择，下次打开仍是这个主题
    }

    // ---- 正文字号缩放 ----
    // 只作用于正文（每条标签页 iframe 里的文档），界面本身（标签栏/工具条/侧栏）字号不动。
    // 用的是 html 元素上的 CSS zoom：和浏览器整页缩放同一套视觉效果（字、行距、代码块一起变），
    // 但因为只加在 iframe 内部，所以正文之外再也不受影响。
    var ZOOM_MIN = 0.6, ZOOM_MAX = 3.0, ZOOM_STEP = 0.1;
    var FIT_BASE = 980;          // 模板里 #wrap 的最大正文栏宽（CSS px）
    var fontScale = 1;           // 1 = 100%
    var fitWindow = false;       // 「适应窗口」是否开启
    var fitTimer = null;

    function zoomPctText() { return Math.round(fontScale * 100) + "%"; }

    function applyZoomTo(fr) {
      try {
        var d = fr && fr.contentDocument;
        if (!d || !d.documentElement) return;
        var v = (Math.abs(fontScale - 1) < 0.005) ? "" : String(fontScale);
        if (d.documentElement.style.zoom !== v) d.documentElement.style.zoom = v;
      } catch (e) {}
    }
    // iframe 里的滚轮/快捷键要单独绑：事件不会冒泡到父文档
    function ensureZoomWired(fr) {
      try {
        var d = fr && fr.contentDocument;
        if (!d || d.__pmZoomWired) return;
        d.__pmZoomWired = true;
        d.addEventListener("wheel", function (ev) {
          if (!(ev.ctrlKey || ev.metaKey)) return;
          ev.preventDefault();
          stepScale(ev.deltaY < 0 ? 1 : -1);
        }, { passive: false });
        d.addEventListener("keydown", function (ev) {
          if (!(ev.ctrlKey || ev.metaKey) || ev.altKey) return;
          var k = ev.key;
          if (k === "=" || k === "+") { ev.preventDefault(); stepScale(1); }
          else if (k === "-" || k === "_") { ev.preventDefault(); stepScale(-1); }
          else if (k === "0") { ev.preventDefault(); setScale(1); }
        }, true);
      } catch (e) {}
    }
    function applyZoomAll() {
      for (var i = 0; i < tabs.length; i++) {
        applyZoomTo(tabs[i].iframe);
        ensureZoomWired(tabs[i].iframe);
      }
      updateZoomUI();
    }
    function updateZoomUI() {
      var p = document.getElementById("zoomPct");
      if (p) p.textContent = zoomPctText();
      var fb = document.getElementById("fitBtn");
      if (fb) fb.classList.toggle("on", !!fitWindow);
    }
    // 「适应窗口」的目标字号：让正文栏（980 CSS px）正好铺满可见宽度
    function fitScale() {
      var v = document.getElementById("views");
      var w = (v && v.clientWidth) ? v.clientWidth : window.innerWidth;
      var s = w / FIT_BASE;
      s = Math.min(2.4, Math.max(0.8, Math.round(s * 100) / 100));
      return s;
    }
    // keepFit=true：由「适应窗口」内部调用，不要关掉适配模式
    function setScale(v, keepFit) {
      v = Math.round(v * 100) / 100;
      v = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, v));
      if (!keepFit && fitWindow) { fitWindow = false; saveCfg({ fit_window: false }); }
      var changed = (v !== fontScale);
      fontScale = v;
      applyZoomAll();
      // 适应窗口模式下字号是算出来的，不必每次窗口拖动都写盘
      if (!keepFit) saveCfg({ font_scale: v });
      if (changed) setStatus("正文字号 " + zoomPctText() + (fitWindow ? "（适应窗口）" : ""));
    }
    function stepScale(dir) {
      var pct = Math.round(fontScale * 100) + dir * Math.round(ZOOM_STEP * 100);
      if (pct > ZOOM_MAX * 100) pct = ZOOM_MAX * 100;
      if (pct < ZOOM_MIN * 100) pct = ZOOM_MIN * 100;
      setScale(pct / 100);
    }
    function scheduleFit() {
      if (fitTimer) clearTimeout(fitTimer);
      fitTimer = setTimeout(function () {
        fitTimer = null;
        if (fitWindow) setScale(fitScale(), true);
      }, 140);
    }
    function toggleFit() {
      if (fitWindow) {
        fitWindow = false;
        saveCfg({ fit_window: false });
        updateZoomUI();
        setStatus("适应窗口：关（保持当前 " + zoomPctText() + "）");
        return;
      }
      fitWindow = true;
      saveCfg({ fit_window: true });
      setScale(fitScale(), true);
      setStatus("适应窗口：开 — 字号随窗口自动调整（当前 " + zoomPctText() + "）");
    }

    // 初始：跟随系统深色偏好；之后系统切换时若用户没手动改过，自动跟随
    // pywebview 的 JS API 是页面加载完成后才注入的。初始化瞬间可能还没有，
    // 若此时直接判断会把整段「恢复配置」跳过（主题/文件夹/侧栏宽度全部失效）。
    function whenApiReady(cb) {
      var fired = false;
      function run() { if (fired) return; fired = true; try { cb(); } catch (e) {} }
      if (hasApi() && window.pywebview.api && window.pywebview.api.get_config) { run(); return; }
      window.addEventListener("pywebviewready", run);
      var n = 0;
      var t = setInterval(function () {
        if (hasApi() && window.pywebview.api && window.pywebview.api.get_config) { clearInterval(t); run(); }
        else if (++n > 200) { clearInterval(t); }
      }, 100);
    }

    (function initTheme() {
      try {
        if (window.matchMedia) {
          var mq = window.matchMedia("(prefers-color-scheme: dark)");
          if (mq.matches) theme = "dark";
          var onSys = function (e) { if (!userToggled) { theme = e.matches ? "dark" : "light"; applyAll(); } };
          if (mq.addEventListener) mq.addEventListener("change", onSys);
          else if (mq.addListener) mq.addListener(onSys);
        }
      } catch (e) {}
      applyAll();
      // 尝试从本地配置恢复用户上次的主题 / 自动刷新偏好
      whenApiReady(function () {
        if (!hasApi() || !window.pywebview.api.get_config) return;
        cfgPending = true;
        window.pywebview.api.get_config().then(function (cfg) {
          cfgPending = false;
          if (cfg && cfg.theme && (cfg.theme === "dark" || cfg.theme === "beige" || cfg.theme === "light")) {
            theme = cfg.theme; userToggled = true; applyAll();
          }
          if (cfg && typeof cfg.autoWatch === "boolean") {
            var wc = document.getElementById("watchChk");
            if (wc) wc.checked = cfg.autoWatch;
          }
          // 恢复上次选择的文件夹：侧栏自动展开，方便随时点开里面的 .md
          if (cfg && cfg.folder && typeof cfg.folder === "string") {
            try {
              curFolder = cfg.folder; setSbPath();
              var sb = document.getElementById("sidebar");
              sb.classList.add("show"); sidebarOpen = true;
              treeRoot = null;
              ensureTree();      // 按当前打开的文件对齐根目录并定位它
            } catch (e2) {}
          }
          // 恢复上次侧栏看的是「文件」「大纲」还是「高亮」
          if (cfg && cfg.sb_mode === "toc") setSbMode("toc");
          else if (cfg && cfg.sb_mode === "hl") setSbMode("hl");
          // 恢复高亮标注（存在 config.json 里，源 .md 一个字节都不会改）
          if (cfg && cfg.highlights && typeof cfg.highlights === "object") {
            HL = cfg.highlights;
            for (var hi = 0; hi < tabs.length; hi++) applyHighlightsFor(tabs[hi]);
            if (sbMode === "hl") renderHlList();
          }
          if (cfg && cfg.hl_color && HL_COLORS[cfg.hl_color]) hlColor = cfg.hl_color;
          updateHlChip();
          // 恢复上次拖出来的侧栏宽度
          if (cfg && typeof cfg.sidebarWidth === "number") applySidebarWidth(cfg.sidebarWidth);
          // 恢复上次的正文字号 / 是否「适应窗口」（字号只影响正文，不影响界面）
          if (cfg && typeof cfg.font_scale === "number" && isFinite(cfg.font_scale)) {
            fontScale = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, cfg.font_scale));
          }
          if (cfg && cfg.fit_window === true) {
            fitWindow = true;
            setScale(fitScale(), true);
          } else {
            fitWindow = false;
            applyZoomAll();
          }
          if (typeof cfg.auto_update_check === "boolean") cfgAutoChk = cfg.auto_update_check;
          setAutoChkLabel();
          // 配置落地后按当前标签重新对齐一次文件树：无论标签是抢在配置前到达
          // （启动竞态）还是正常到达，都保证"自动定位"最终生效
          var at0 = activeTab();
          if (at0 && at0.path) scheduleTreeSync(at0);
        }).catch(function () { cfgPending = false; });
        // 启动 2.5s 后自动检查新版本（异步不阻塞首屏；失败静默；可在帮助菜单关掉）
        setTimeout(function () { checkUpdateFlow(false); }, 2500);
      });
    })();

    // ---- 顶部工具栏：打开文件 / 重新加载 / 自动刷新（功能需要 Python 侧 js_api 支持）----
    function setStatus(msg) {
      try { var s = document.getElementById("status"); if (s) s.textContent = msg || ""; } catch (e) {}

    // ---- 检查更新 ----
    var pendingUpdate = null;   // 当前弹窗里的更新信息
    var cfgAutoChk = true;      // 自动检查开关（启动时从本地配置恢复）
    function showUpdateModal(up) {
      try {
        pendingUpdate = up || null;
        var v = document.getElementById("updVer");
        if (v) v.textContent = "PureMD v" + APP_VERSION + "  →  v" + (up && up.latest ? up.latest : "?");
        var n = document.getElementById("updNotes");
        if (n) n.textContent = (up && up.notes) ? up.notes : "（该版本没有提供说明）";
        var m = document.getElementById("updateModal");
        if (m) m.style.display = "flex";
      } catch (err) {}
    }
    function closeUpdateModal() {
      try { var m = document.getElementById("updateModal"); if (m) m.style.display = "none"; } catch (err) {}
    }
    function openReleasePage() {
      try {
        var url = (pendingUpdate && pendingUpdate.url) ? pendingUpdate.url : "";
        if (!url) { setStatus("该版本没有提供下载地址"); return; }
        if (hasApi() && window.pywebview.api.open_url) {
          window.pywebview.api.open_url(url).then(function (ok) {
            setStatus(ok ? "已请求浏览器打开发布页" : "打开浏览器失败，请手动访问：" + url);
          }).catch(function () { setStatus("打开浏览器失败，请手动访问：" + url); });
        } else {
          setStatus("请手动访问：" + url);
        }
        closeUpdateModal();
      } catch (e) {}
    }
    function skipThisVersion() {
      try {
        if (pendingUpdate && pendingUpdate.latest) {
          saveCfg({ skipped_version: pendingUpdate.latest });
          setStatus("已跳过 v" + pendingUpdate.latest + "，下次发布新版本时再提醒");
        }
        closeUpdateModal();
      } catch (e) {}
    }
    function setAutoChkLabel() {
      try {
        var it = document.getElementById("helpAutoChk");
        if (it) it.textContent = "自动检查更新：" + (cfgAutoChk ? "开" : "关");
      } catch (e) {}
    }
    // manual=true：用户主动检查（总是联网、总报告结果）；false：启动自动检查（静默）
    function checkUpdateFlow(manual) {
      try {
        if (!hasApi() || !window.pywebview.api.check_update) {
          if (manual) setStatus("此功能需要更新后的 exe");
          return;
        }
        if (manual) setStatus("正在检查更新…");
        window.pywebview.api.check_update(manual).then(function (up) {
          if (!up) { if (manual) setStatus("检查更新失败：接口无响应"); return; }
          if (up.ok && up.has_update) {
            if (manual) setStatus("发现新版本 v" + up.latest);
            showUpdateModal(up);
          } else if (up.ok) {
            if (manual) setStatus("已是最新版本（v" + up.current + "）");
          } else if (manual) {
            setStatus("检查更新失败：" + (up.error || "未知错误"));
          }
        }).catch(function (e) {
          if (manual) setStatus("检查更新失败：" + (e && e.message ? e.message : e));
        });
      } catch (e) {}
    }
    // 点击弹窗外区域关闭（反馈 / 关于 / 检查更新）
    document.addEventListener("click", function (e) {
      try {
        var m = document.getElementById("fbModal");
        if (m && m.style.display === "flex" && e.target === m) m.style.display = "none";
        var a = document.getElementById("aboutModal");
        if (a && a.style.display === "flex" && e.target === a) a.style.display = "none";

    // 导出当前文档为 PDF：调用 iframe 的打印（在打印对话框里选“另存为 PDF”）
    function exportPdf() {
      var t = activeTab();
      if (!t || !t.iframe) { setStatus("当前没有可导出的文档"); return; }
      try {
        t.iframe.contentWindow.focus();
        t.iframe.contentWindow.print();
        setStatus("已打开打印对话框，选择“另存为 PDF”即可导出");

    // 导出当前文档为 .docx（Word）：Python 侧转换 + 原生保存对话框
    function exportDocx() {
      var t = activeTab();
      if (!t || !t.path) { setStatus("当前没有可导出的文档"); return; }
      if (!hasApi() || !window.pywebview.api.export_docx) {
        setStatus("导出 Word 失败：接口不可用"); return;

        }
      }).catch(function (e) {

    // 本地配置（主题 / 自动刷新等）持久化：读 / 写都走 Python 侧，失败时静默
    function saveCfg(obj) {
      try {
        if (hasApi() && window.pywebview.api.set_config) {
          window.pywebview.api.set_config(obj).catch(function () {});
        }
      } catch (e) {}
    }
    function hasApi() { return !!(window.pywebview && window.pywebview.api); }
    function activeTab() {
      for (var i = 0; i < tabs.length; i++) { if (tabs[i].id === activeId) return tabs[i]; }
      return null;
    }
    // Python 侧（自动刷新/重新加载）推送新内容时调用：按文件名找到标签并换掉内容
    window.__updateTab = function (p) {
      try {
        p = (typeof p === "string") ? JSON.parse(p) : p;
        if (!p || !p.name) return;
        var hit = null;
        for (var i = 0; i < tabs.length; i++) { if (tabs[i].name === p.name) { hit = tabs[i]; break; } }
        if (!hit) return;
        // 正在编辑的标签不能被外部刷新覆盖，否则改到一半的内容就没了
        if (hit.editing || EDITED[hit.id]) {
          setStatus("「" + hit.name + "」有未保存的修改，已跳过自动刷新（先保存或退出编辑）");
          return;
        }
        var fr = hit.iframe;
        // 自动刷新 / 重新加载前先记下当前阅读位置，重载后写回，避免跳回开头
        var keep = ifScrollY(fr);
        hit.scrollY = keep;
        fr.onload = function () {
          applyTheme(fr);
          restoreScroll(fr, keep);
          if (sbMode === "toc" && hit.id === activeId) buildOutline(0);
        };
        fr.srcdoc = p.html;
      } catch (e) {}
    };
    function wireToolbar() {

          setStatus(cfgAutoChk ? "自动检查更新：开（每次启动时检查）" : "自动检查更新：关（仍可在帮助菜单手动检查）");
        });

    wireToolbar();

    // ---- 左侧文件夹侧栏：随时点开文件夹里的 .md ----
    function setSbPath() {
      try {
        var el = document.getElementById("sbPath");
        if (el) { el.textContent = curFolder || ""; el.title = curFolder || ""; }
        var up = document.getElementById("sbUp");
        if (up) up.disabled = atRootFolder();
      } catch (e) {}
    }

    // ---- 路径工具（统一用反斜杠；Windows 路径大小写不敏感） ----
    function normPath(p) { return String(p == null ? "" : p).replace(/\//g, "\\"); }
    function expKey(p) { return normPath(p).replace(/\\+$/, "").toLowerCase(); }
    function joinPath(dir, name) {
      var d = normPath(dir);
      if (!d) return String(name);
      if (d.slice(-1) === "\\") return d + name;
      return d + "\\" + name;
    }
    // 取所在目录；"C:\a.md" -> "C:\"，"C:\x\a.md" -> "C:\x"
    function pathDir(p) {
      var s = normPath(p);
      var i = s.lastIndexOf("\\");
      if (i <= 0) return "";
      if (i === 2 && s.charAt(1) === ":") return s.slice(0, 3);
      return s.slice(0, i);
    }
    function isUnder(file, root) {
      var f = expKey(file), r = expKey(root);
      if (!f || !r) return false;
      return f === r || f.indexOf(r + "\\") === 0;
    }
    // 是否已经在磁盘顶层（"C:\" 之上没有目录了）
    function atRootFolder() {
      if (!curFolder) return true;
      var up = pathDir(curFolder);
      return !up || expKey(up) === expKey(curFolder);
    }
    // 把某文件到当前根之间的各级目录标记为展开；返回是否有新展开的目录
    function expandAncestorsOf(path) {
      var changed = false, cur = pathDir(path), guard = 0;
      while (cur && curFolder && guard++ < 40) {
        if (expKey(cur) === expKey(curFolder) || !isUnder(cur, curFolder)) break;
        if (!expanded[expKey(cur)]) { expanded[expKey(cur)] = true; changed = true; }
        var up = pathDir(cur);
        if (!up || up === cur) break;
        cur = up;
      }
      return changed;
    }
    // 返回上一级文件夹：根变成当前根的父目录。之后 ensureTree 会把当前文件的
    // 各级祖先重新展开并高亮，所以「往上翻看兄弟目录」与「自动定位」可以反复
    // 交替进行，不会一换根就找不到当前文件。
    function goUpFolder() {
      if (!curFolder) return;
      var up = pathDir(curFolder);
      if (!up || expKey(up) === expKey(curFolder)) { setStatus("已经在磁盘顶层了"); return; }
      curFolder = up;
      expanded = {};
      saveCfg({ folder: curFolder });   // 记住这次切换，下次启动直接还原
      var sb = document.getElementById("sidebar");
      if (sb) { sb.classList.add("show"); sidebarOpen = true; }
      setSbPath();
      treeRoot = null;
      ensureTree();
    }

    function listDir(path) {
      return new Promise(function (resolve) {
        if (!hasApi() || !window.pywebview.api.list_dir) { resolve({folders: [], files: []}); return; }
        window.pywebview.api.list_dir(path).then(resolve).catch(function () { resolve({folders: [], files: []}); });
      });
    }
    function makeRow(name, kind, depth) {
      var row = document.createElement("div");
      row.className = "sb-row " + kind;
      row.style.paddingLeft = (8 + depth * 14) + "px";
      row.innerHTML = '<span class="sb-caret' + (kind === "file" ? " sp" : "") + '"></span>' +
                      (kind === "folder"
                        ? '<span class="sb-ico">📁</span>'
                        : '<span class="sb-ico-file"></span>') +
                      '<span class="sb-name"></span>' +
                      (kind === "file" ? '<span class="sb-close" title="关闭这个文件">&times;</span>' : '');
      row.querySelector(".sb-name").textContent = name;
      return row;
    }
    function renderTree(folder, container, depth) {
      container.innerHTML = "";
      listDir(folder).then(function (d) {
        if (d && d.error) { container.innerHTML = '<div class="sb-err">' + d.error + '</div>'; return; }
        var folders = (d && d.folders) || [];
        var files = (d && d.files) || [];
        if (!folders.length && !files.length) {
          container.innerHTML = '<div class="sb-err" style="color:#6e7781">（没有 .md 文件）</div>';
          return;
        }
        var frag = document.createDocumentFragment();
        folders.forEach(function (name) {
          var full = joinPath(folder, name);
          var key = expKey(full);
          var row = makeRow(name, "folder", depth);
          row.dataset.path = full;
          var caret = row.querySelector(".sb-caret");
          var childBox = document.createElement("div");
          childBox.className = "sb-children";
          // 重建树时沿用已记录的展开状态（否则标记与显示不一致，要点两次才展开）
          if (expanded[key]) {
            caret.classList.add("open");
            childBox.style.display = "block";
            renderTree(full, childBox, depth + 1);
          } else {
            childBox.style.display = "none";
          }
          row.addEventListener("click", function (e) {
            e.stopPropagation();
            if (expanded[key]) {
              expanded[key] = false; childBox.style.display = "none"; caret.classList.remove("open");
            } else {
              expanded[key] = true; caret.classList.add("open");
              childBox.style.display = "block"; renderTree(full, childBox, depth + 1);
            }
          });
          frag.appendChild(row); frag.appendChild(childBox);
        });
        files.forEach(function (name) {
          var full = joinPath(folder, name);
          var row = makeRow(name, "file", depth);
          row.dataset.path = full;
          row.addEventListener("click", function (e) { e.stopPropagation(); openSidebarFile(full); });
          // 行尾 × ：关掉这个文件对应的标签（只有该文件已打开时才可见）
          var xb = row.querySelector(".sb-close");
          if (xb) xb.addEventListener("click", function (e) {
            e.stopPropagation();
            var t = null;
            for (var i = 0; i < tabs.length; i++) {
              if (tabs[i].path && expKey(tabs[i].path) === expKey(full)) { t = tabs[i]; break; }
            }
            if (t) closeTab(t.id);
          });
          frag.appendChild(row);
        });
        container.appendChild(frag);
        // 子目录是异步渲染的，渲染完再尝试高亮当前文件
        if (locatePath) markTreeFile(locatePath, container);
        syncTreeCloseBtns(container);
      });
    }
    // ---- 打开文件时自动定位到它所在的文件夹 ----
    // 规则：文件在当前根目录之下 → 保持根目录，逐级展开并高亮该文件；
    //       文件不在当前根目录下 → 把根切到它所在的文件夹（即"所属文件夹"）。
    function markTreeFile(path, scope) {
      try {
        // 陈旧定位请求（已被更新的目标取代）一律忽略，避免高亮被旧文件抢走
        if (path && typeof locatePath !== "undefined" && locatePath && path !== locatePath) return;
        var box = scope || document.getElementById("tree");
        if (!box) return;
        var want = expKey(path);
        var rows = box.querySelectorAll(".sb-row.file");
        for (var i = 0; i < rows.length; i++) {
          var hit = rows[i].dataset.path && expKey(rows[i].dataset.path) === want;
          rows[i].classList.toggle("active", !!hit);
          if (hit && !scope) {
            var tb = box.getBoundingClientRect();
            var rr = rows[i].getBoundingClientRect();
            if (rr.top < tb.top || rr.bottom > tb.bottom) {
              try { rows[i].scrollIntoView({ block: "center" }); } catch (e) {}
            }
          }
        }
      } catch (e) {}
    }
    // ---- 文件行行尾的关闭按钮：只在该文件已打开（有对应标签）时才显示 ----
    function syncTreeCloseBtns(scope) {
      try {
        var box = scope || document.getElementById("tree");
        if (!box) return;
        var open = {};
        for (var i = 0; i < tabs.length; i++) {
          if (tabs[i].path) open[expKey(tabs[i].path)] = true;
        }
        var rows = box.querySelectorAll(".sb-row.file");
        for (var j = 0; j < rows.length; j++) {
          var p = rows[j].dataset.path;
          rows[j].classList.toggle("opened", !!(p && open[expKey(p)]));
        }
      } catch (e) {}
    }
    // 树是逐层异步渲染的，目标行可能稍后才出现，所以重试几次。
    // 关键：新的定位请求必须作废旧请求的重试——否则"上一次"（如切换标签前的
    // 那个文件）的重试循环稍后才等到自己的行出现，会把高亮覆盖回旧文件，
    // 表现为"树展开了、但高亮停在别的文件上"（真机实测 v1.5.8）。
    var locateGen = 0;
    function locateInTree(path, tries, gen) {
      tries = tries || 0;
      if (gen === undefined) gen = ++locateGen;
      else if (gen !== locateGen) return;      // 已有更新的定位请求 → 放弃陈旧重试
      var tree = document.getElementById("tree");
      if (!tree || !path) return;
      var want = expKey(path);
      var rows = tree.querySelectorAll(".sb-row.file");
      for (var i = 0; i < rows.length; i++) {
        if (rows[i].dataset.path && expKey(rows[i].dataset.path) === want) {
          markTreeFile(path);
          return;
        }
      }
      if (tries < 30) setTimeout(function () { locateInTree(path, tries + 1, gen); }, 80);
    }
    function syncTreeToFile(t) {
      // 标签可能在防抖窗口内被关掉/切走，此时不该再去定位它
      if (!t || !t.path || !tabs.length || t !== activeTab()) {
        if (!tabs.length) { locatePath = null; markTreeFile(""); }
        return;
      }
      // 配置恢复未完成：curFolder 还是 null，此时抢跑会把根切到文件所在文件夹，
      // 等 get_config 落地后再把根设回保存值——expanded 被清空，文件文件夹
      // 折叠、高亮丢失（观感就是"自动定位突然不灵了"）。交给配置恢复流程
      // 统一触发，这里只记下目标。
      if (cfgPending) { treeSyncTarget = t; return; }
      var dir = pathDir(t.path);
      if (!dir) return;
      locatePath = t.path;
      if (!curFolder || !isUnder(t.path, curFolder)) {
        // 文件不在当前根目录下 → 把根切到它所属的文件夹
        if (expKey(curFolder) !== expKey(dir)) {
          curFolder = dir;
          expanded = {};
          saveCfg({ folder: dir });   // 记住这次定位，下次启动直接还原
          setSbPath();
        }
      }
      // 从根到文件所在目录逐级展开。
      // 关键：必须传【文件路径】而不是目录！expandAncestorsOf 内部第一步就是
      // pathDir(path)，若这里传 dir（已取过一次 pathDir），等于少展开一级——
      // 文件所在的那一层文件夹不会被标记展开，.md 行渲染不出来、也无从高亮。
      // 症状正是"启动后文件树全折叠、当前文档不高亮"（真机实测 v1.5.8）。
      expandAncestorsOf(t.path);
      var sb = document.getElementById("sidebar");
      var showing = !!(sb && sb.classList.contains("show"));
      if (showing && sbMode === "files") {
        renderTree(curFolder, document.getElementById("tree"), 0);
        treeRoot = curFolder;
        locateInTree(locatePath);
      } else {
        // 根目录或展开状态可能变了，下次展开侧栏时按需重绘（避免在不可见时白渲染）
        treeRoot = null;
      }
    }
    // 打开/切换标签时调用（80ms 合并连续打开，避免启动恢复时反复重绘）
    var treeSyncTimer = null, treeSyncTarget = null;
    function scheduleTreeSync(t) {
      if (!t || !t.path) return;
      // 配置恢复中：先 stash，等 get_config 落地后由它接着触发（见 syncTreeToFile 注释）
      if (cfgPending) {
        treeSyncTarget = t;
        if (!treeSyncTimer) {
          treeSyncTimer = setTimeout(function () {
            treeSyncTimer = null;
            var x = treeSyncTarget; treeSyncTarget = null;
            if (x) syncTreeToFile(x);
          }, 2000);   // 兜底：配置接口异常也不至于永远不定位
        }
        return;
      }
      treeSyncTarget = t;
      if (treeSyncTimer) clearTimeout(treeSyncTimer);
      treeSyncTimer = setTimeout(function () {
        treeSyncTimer = null;
        var x = treeSyncTarget; treeSyncTarget = null;
        syncTreeToFile(x);
      }, 80);
    }
    // 侧栏显示「文件」时确保树与当前根一致，并定位当前文件
    function ensureTree() {
      var tree = document.getElementById("tree");
      if (!tree || !curFolder) return;
      // 自愈：根目录可能是配置恢复 / 手动选文件夹 / 返回上一级后来才设定的，
      // 此时 expanded 是空的——把当前文件的各级祖先补上。否则文件文件夹折叠、
      // 高亮丢失（手动选完文件夹后"自动定位失效"就是这个原因）。
      var grew = locatePath ? expandAncestorsOf(locatePath) : false;
      if (treeRoot !== curFolder || grew) {
        renderTree(curFolder, tree, 0);
        treeRoot = curFolder;
      }
      if (locatePath) locateInTree(locatePath);
    }

    function openSidebarFile(full) {
      if (!hasApi()) { setStatus("此功能需要更新后的 exe"); return; }
      setStatus("正在打开：" + full);
      window.pywebview.api.open_md_path(full).then(function (p) {
        if (p && p.name) { window.__addTab(p); setStatus("已打开 " + p.name); }
        else if (p && p.error) setStatus(p.error);
        else setStatus("打开失败");
      }).catch(function (e) { setStatus("打开失败：" + (e && e.message ? e.message : e)); });
    }
    function pickFolder() {
      if (!hasApi()) { setStatus("此功能需要更新后的 exe"); return; }
      window.pywebview.api.pick_folder().then(function (p) {
        if (p && typeof p === "string") {
          curFolder = p; expanded = {}; saveCfg({ folder: curFolder });
          var sb = document.getElementById("sidebar");
          sb.classList.add("show"); sidebarOpen = true;
          setSbPath();
          treeRoot = null;
          ensureTree();
        } else if (p && p.error) {
          setStatus(p.error);
        }
      }).catch(function (e) { setStatus("打开文件夹失败：" + (e && e.message ? e.message : e)); });
    }
    function showSidebar() {
      var sb = document.getElementById("sidebar");
      if (!sb) return;
      sb.classList.add("show"); sidebarOpen = true;
      if (sbMode === "files") ensureTree();       // 展开时把树对齐到当前文件
      else if (sbMode === "toc") buildOutline(0); // 展开时重扫一遍标题，避免沿用启动早期的旧列表
    }
    // want：点工具栏哪个按钮进来（"files" / "toc"）。侧栏已开在另一模式时只切模式，不收起。
    function toggleSidebar(want) {
      var sb = document.getElementById("sidebar");
      if (!sb) return;
      var openNow = sb.classList.contains("show");
      if (want && sbMode !== want) {
        setSbMode(want);
        if (!openNow) showSidebar();
        return;
      }
      if (!openNow) {
        if (sbMode === "files" && !curFolder) { pickFolder(); return; }
        showSidebar();
      } else {
        sb.classList.remove("show"); sidebarOpen = false;
      }
    }
    function wireSidebar() {
      try {
        var su = document.getElementById("sbUp");
        if (su) su.addEventListener("click", function (e) { e.stopPropagation(); goUpFolder(); });
        var so = document.getElementById("sbOpen");
        if (so) so.addEventListener("click", function (e) { e.stopPropagation(); pickFolder(); });
      } catch (e) {}
    }
    // 动作条最左边那个图标：只负责「开 / 关」侧栏，不主动弹选文件夹对话框
    function toggleSbPanel() {
      var sb = document.getElementById("sidebar");
      if (!sb) return;
      if (sb.classList.contains("show")) { sb.classList.remove("show"); sidebarOpen = false; }
      else {
        // 还没选过文件夹时，直接用「大纲」页打开，免得看到一个空文件树
        if (sbMode === "files" && !curFolder) setSbMode("toc");
        showSidebar();
      }
      updateSbToggle();
    }
    function updateSbToggle() {
      var sb = document.getElementById("sidebar");
      var b = document.getElementById("sbToggleBtn");
      if (!sb || !b) return;
      var on = sb.classList.contains("show");
      sidebarOpen = on;
      if (b.classList.contains("on") !== on) b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
      // 「文件 / 大纲 / 高亮」三个页签跟着侧栏开合显示 / 隐藏
      if (document.body.classList.contains("sb-open") !== on) {
        document.body.classList.toggle("sb-open", on);
      }
    }
    wireSidebar();

    // ---- 侧栏宽度：拖右边框调整，双击复位 240px；宽度存配置，下次打开沿用 ----
    var sbWidth = 240;
    var SB_MIN_W = 140;
    function applySidebarWidth(w) {
      var sb = document.getElementById("sidebar");
      if (!sb) return;
      w = Math.round(Number(w) || 240);
      var maxW = Math.max(220, Math.min(760, Math.round(window.innerWidth * 0.62)));
      if (w < SB_MIN_W) w = SB_MIN_W;
      if (w > maxW) w = maxW;
      sbWidth = w;
      sb.style.width = w + "px";
    }
    function wireResizer() {
      var sb = document.getElementById("sidebar");
      var rz = document.getElementById("sbResizer");
      if (!sb || !rz) return;
      var startX = 0, startW = 0, dragging = false, watchdog = null;
      function onMove(ev) {
        if (!dragging) return;

      function onUp() {
        if (window.__pmShield) window.__pmShield(false);
        if (!dragging) return;
        dragging = false;
        document.body.classList.remove("sb-resizing");
        window.__pmGestureBusy = false;
        window.removeEventListener("mousemove", onMove);
        window.removeEventListener("mouseup", onUp);
        window.removeEventListener("blur", onUp);
        window.removeEventListener("pointercancel", onUp);
        if (watchdog) { clearTimeout(watchdog); watchdog = null; }
        saveCfg({ sidebarWidth: sbWidth });
      }
      rz.addEventListener("mousedown", function (ev) {
        ev.preventDefault();
        ev.stopPropagation();
        dragging = true;
        startX = ev.clientX;
        startW = sb.getBoundingClientRect().width;
        window.__pmGestureBusy = true;
        document.body.classList.add("sb-resizing");
        if (window.__pmShield) window.__pmShield(true, "col-resize");
        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp);
        // 同上：mouseup 丢失会让 iframe 永久 pointer-events:none → 正文滚不动
        window.addEventListener("blur", onUp);
        window.addEventListener("pointercancel", onUp);
        if (watchdog) clearTimeout(watchdog);
        watchdog = setTimeout(onUp, 12000);
        window.__pmEndSbResize = onUp;   // 供全局自愈钩子调用
      });
      rz.addEventListener("dblclick", function (ev) {
        ev.stopPropagation();
        applySidebarWidth(240);
        saveCfg({ sidebarWidth: 240 });
      });
      // 拖完宽度鼠标常常就停在分隔条上，这一条只有 8px 宽、盖在正文左侧，
      // 滚轮落上去不会滚正文 → 用户会以为「又滚不动了」。这里把滚轮转给正文。
      rz.addEventListener("wheel", function (ev) {
        try {
          var fr = null, frs = document.querySelectorAll("#views > iframe");
          for (var i = 0; i < frs.length; i++) {
            if (frs[i].style.display !== "none") { fr = frs[i]; break; }
          }
          if (!fr || !fr.contentWindow) return;
          var line = (ev.deltaMode === 1) ? 18
                   : (ev.deltaMode === 2 ? window.innerHeight * 0.9 : 1);
          fr.contentWindow.scrollBy(0, ev.deltaY * line);

        } catch (e) {}
      }, { passive: false });
      // 窗口被缩窄时收回过宽的侧栏，避免正文被挤没
      window.addEventListener("resize", function () {

    // ---- 左侧大纲：把当前文档的标题列出来，点一下直达正文对应位置 ----
    var sbMode = "files";       // "files" | "toc"
    var tocItems = [];          // [{el, level, text}]，与 #toc 子节点一一对应
    var tocTabId = null;        // tocItems 对应的标签 id

    function setSbMode(m) {
      sbMode = (m === "toc") ? "toc" : (m === "hl") ? "hl" : "files";
      var files = (sbMode === "files");
      var tocOn = (sbMode === "toc");
      var hlOn = (sbMode === "hl");
      var tree = document.getElementById("tree");
      var pth = document.getElementById("sbPath");
      var toc = document.getElementById("toc");
      var hll = document.getElementById("hlList");
      var tf = document.getElementById("sbTabFiles");
      var tt = document.getElementById("sbTabToc");
      var th = document.getElementById("sbTabHl");
      var so = document.getElementById("sbOpen");
      var hd = document.getElementById("sbHead");
      if (tree) tree.style.display = files ? "" : "none";
      if (pth) pth.style.display = files ? "" : "none";
      if (toc) toc.style.display = tocOn ? "" : "none";
      if (hll) hll.style.display = hlOn ? "" : "none";
      if (so) so.style.display = files ? "" : "none";
      if (hd) hd.style.display = files ? "" : "none";   // 大纲 / 高亮页不需要头部行
      if (tf) tf.classList.toggle("active", files);
      if (tt) tt.classList.toggle("active", tocOn);
      if (th) th.classList.toggle("active", hlOn);
      saveCfg({ sb_mode: sbMode });
      if (tocOn) buildOutline(0);
      else if (hlOn) renderHlList();
      else if (files) ensureTree();      // 切回「文件」时按当前文件重绘/定位
    }

    // 读取 iframe 里的标题（srcdoc 与父页同源，可直接访问 contentDocument）
    function collectHeadings(t) {
      var out = [];
      if (!t || !t.iframe) return out;
      var doc = null;
      try { doc = t.iframe.contentDocument; } catch (e) { return out; }
      if (!doc || !doc.body) return out;
      var hs = doc.querySelectorAll("h1,h2,h3,h4,h5,h6");
      var base = ifScrollY(t.iframe);
      for (var i = 0; i < hs.length; i++) {
        var h = hs[i];
        var txt = (h.textContent || "").replace(/\s+/g, " ").trim();
        if (!txt) continue;
        var lv = parseInt(h.tagName.charAt(1), 10) || 1;
        out.push({ el: h, level: lv, text: txt,
                   top: h.getBoundingClientRect().top + base });   // 文档内绝对偏移
      }
      return out;
    }

    // retry：iframe 刚换内容时可能还没渲染完，重试几次（最多 ~1.2s）
    function buildOutline(retry) {
      var box = document.getElementById("toc");
      if (!box) return;
      var t = activeTab();
      if (!t) {
        tocItems = []; tocTabId = null;
        box.innerHTML = '<div class="sb-err" style="color:#6e7781">（没有打开的文档）</div>';
        return;
      }
      var list = collectHeadings(t);
      if (!list.length) {
        var n = retry || 0;
        if (n < 8) { setTimeout(function () { buildOutline(n + 1); }, 150); return; }
        tocItems = []; tocTabId = t.id;
        box.innerHTML = '<div class="sb-err" style="color:#6e7781">（这篇文档没有标题）</div>';
        return;
      }
      tocItems = list; tocTabId = t.id;
      box.innerHTML = "";
      var frag = document.createDocumentFragment();
      list.forEach(function (it, idx) {
        var row = document.createElement("div");
        var lv = Math.max(1, Math.min(it.level, 6));
        row.className = "toc-item toc-lv" + lv;
        row.style.paddingLeft = (10 + (lv - 1) * 13) + "px";
        row.textContent = it.text;
        row.title = it.text;
        row.dataset.idx = idx;
        frag.appendChild(row);
      });
      box.appendChild(frag);
      box.scrollTop = 0;
      markTocActive(t);
    }

    // 点大纲跳转。这里有一条踩过的坑：大纲列表可能属于"另一个标签的文档"
    // （切换标签 / 文档被重渲染时列表没跟上）。此时旧标题节点在它自己的文档里
    // 仍然 isConnected，但 getBoundingClientRect() 因为不可见全是 0 —— 算出来
    // 的 y≈0，状态栏照样显示"已定位到"，正文却一动不动。
    // 所以：① 只认当前活动文档里的标题（比对 ownerDocument）；② 列表过期就先重建。
    function jumpToHeading(it, idx) {
      var t = activeTab();
      if (!t || !t.iframe) return;
      var doc = null;
      try { doc = t.iframe.contentDocument; } catch (e) { return; }
      if (!doc || !doc.body) return;
      var stale = tocTabId !== t.id || !tocItems.length || !tocItems[0].el ||
                  tocItems[0].el.ownerDocument !== doc;
      if (stale) buildOutline(0);               // 按当前文档重建，下面的序号才对得上
      var list = collectHeadings(t);
      if (!list.length) {
        buildOutline(0);
        setStatus("正文还没加载完，请稍后再点一次");
        return;
      }
      var target = null;
      if (idx != null && list[idx]) {
        if (!it || !it.text || list[idx].text === it.text) target = list[idx];
        else if (stale) target = list[idx];     // 重建过：序号就是用户点的这一行
      }
      if (!target && it && it.text) {
        for (var i = 0; i < list.length; i++) {
          if (list[i].text === it.text) { target = list[i]; break; }
        }
      }
      if (!target && idx != null && list[idx]) target = list[idx];
      if (!target) target = list[0];
      try {
        var fr = t.iframe, w = fr.contentWindow;
        var base = ifScrollY(fr);
        var y = target.el.getBoundingClientRect().top + base - 8;
        if (y < 0) y = 0;
        fr.__restoreTo = 0;                      // 取消可能进行中的位置恢复
        if (w && w.scrollTo) w.scrollTo(0, y);
        // 兜底：文档的滚动容器不是 window 时 scrollTo 无效，改用 scrollIntoView
        if (Math.abs(ifScrollY(fr) - y) > 4) {
          try { target.el.scrollIntoView({ block: "start" }); }
          catch (e2) { try { target.el.scrollIntoView(true); } catch (e3) {} }
          if (Math.abs(ifScrollY(fr) - y) > 8 && w && w.scrollTo) w.scrollTo(0, y);
        }
        t.scrollY = ifScrollY(fr);
        markTocActive(t);
        scheduleSave();
        setStatus("已定位到：" + (target.text || ""));
      } catch (e) {}
    }

    // 滚动时高亮当前所在的小节（标题在文档中是顺序排列的，rect.top 单调递增）
    function markTocActive(t) {
      if (sbMode !== "toc" || !t || tocTabId !== t.id || !tocItems.length) return;
      var box = document.getElementById("toc");
      if (!box) return;
      // 列表若还停在别的文档上，位置全是 0，会把高亮错标到最后一节，直接跳过
      try {
        if (!tocItems[0].el || tocItems[0].el.ownerDocument !== t.iframe.contentDocument) return;
      } catch (e) { return; }
      var idx = 0;
      try {
        for (var i = 0; i < tocItems.length; i++) {
          if (tocItems[i].el.getBoundingClientRect().top <= 88) idx = i; else break;
        }
      } catch (e) { return; }
      var rows = box.children;
      for (var j = 0; j < rows.length; j++) rows[j].classList.toggle("active", j === idx);
      // 高亮项超出侧栏可视范围时轻轻带进来（不抢用户滚动）
      try {
        var cur = rows[idx];
        if (cur) {
          var top = cur.offsetTop, bot = top + cur.offsetHeight;
          if (top < box.scrollTop) box.scrollTop = top - 8;
          else if (bot > box.scrollTop + box.clientHeight) box.scrollTop = bot - box.clientHeight + 8;
        }
      } catch (e2) {}
    }

    function wireToc() {
      try {
        var tf = document.getElementById("sbTabFiles");
        var tt = document.getElementById("sbTabToc");
        var th = document.getElementById("sbTabHl");
        if (tf) tf.addEventListener("click", function (e) { e.stopPropagation(); setSbMode("files"); });
        if (tt) tt.addEventListener("click", function (e) { e.stopPropagation(); setSbMode("toc"); });
        if (th) th.addEventListener("click", function (e) { e.stopPropagation(); setSbMode("hl"); });
        // 点条目走容器委托：列表每次重建都会换新行，绑在容器上不会漏绑
        var tb = document.getElementById("toc");
        if (tb && !tb.dataset.wired) {
          tb.dataset.wired = "1";
          tb.addEventListener("click", function (ev) {
            var row = (ev.target && ev.target.closest) ? ev.target.closest(".toc-item") : null;
            if (!row || !tb.contains(row)) return;
            ev.preventDefault();
            ev.stopPropagation();
            var i = parseInt(row.dataset.idx, 10);
            if (isNaN(i)) return;
            jumpToHeading(tocItems[i], i);
          });
        }
      } catch (e) {}
    }
    wireToc();


    // 绑定左右滚动按钮；鼠标滚轮上下滚也转成标签区横向滚动
    try {
      var _p = document.getElementById("navPrev");
      var _n = document.getElementById("navNext");

        _m.addEventListener("click", function () { toggleTabList(false); toggleExportMenu(false); toggleHelpMenu(false); });

      // 标签条接收拖放：实时把被拖的标签插入到指针所在位置
      var _tc = document.getElementById("tabs");
      if (_tc) {
        _tc.addEventListener("dragover", function (e) {

          e.preventDefault();
          try { e.dataTransfer.dropEffect = "move"; } catch (err) {}
          var dragged = _tc.querySelector(".tab.dragging");
          if (!dragged) return;
          var after = dragAfterElement(_tc, e.clientX);
          if (after) {
            if (dragged.nextSibling !== after) _tc.insertBefore(dragged, after);
          } else if (_tc.lastChild !== dragged) {
            _tc.appendChild(dragged);
          }
        });

      // ☰ 列表同样支持拖动排序：实时把被拖的项插到指针处，落定后
      // syncTabOrderFromList 会把列表顺序写回 tabs 数组并同步顶部标签条
      var _tl = document.getElementById("tablist");
      if (_tl) {
        _tl.addEventListener("dragover", function (e) {
          if (!tabDragId) return;
          e.preventDefault();
          try { e.dataTransfer.dropEffect = "move"; } catch (err) {}
          var dragged = _tl.querySelector(".li.dragging");
          if (!dragged) return;
          var after = dragAfterElementY(_tl, e.clientY);
          if (after) {
            if (dragged.nextSibling !== after) _tl.insertBefore(dragged, after);
          } else if (_tl.lastChild !== dragged) {
            _tl.appendChild(dragged);
          }
        });
        _tl.addEventListener("drop", function (e) {
          if (!tabDragId) return;
          e.preventDefault();
          syncTabOrderFromList();

      // 点击空白处关闭列表面板 / 导出菜单 / 帮助菜单（点面板与对应按钮除外）
      function __menusOutsideClose(e) {
        try {
          var box = document.getElementById("tablist");
          var btn = document.getElementById("navList");
          if (box && box.style.display === "block") {
            if (!(btn && btn.contains(e.target)) && !box.contains(e.target)) toggleTabList(false);
          }
          var menu = document.getElementById("helpMenu");
          var hb = document.getElementById("helpBtn");
          if (menu && menu.style.display === "block") {
            if (!(hb && hb.contains(e.target)) && !menu.contains(e.target)) toggleHelpMenu(false);
          }
          var emenu = document.getElementById("exportMenu");
          var eb = document.getElementById("exportBtn");
          if (emenu && emenu.style.display === "block") {

          }

      document.addEventListener("click", __menusOutsideClose);

      if (_t && _t.addEventListener) {

    /* ================================================================
       高亮标注（可编辑）
       ----------------------------------------------------------------
       原则：源 .md 只读，一个字节都不改。高亮 / 备注全部存在
       %APPDATA%\PureMD\config.json 的 highlights 字段里，按文件路径分桶。
       定位方式借鉴 W3C 文本锚点：选中文字 + 前后各 48 字上下文 + 出现序号，
       所以源文件小幅改动后仍能贴回原处。
       ================================================================ */
    var HL = {};                 // { "f:d:\...\a.md": [ {id,color,note,text,prefix,suffix,occ,ts} ] }
    var HL_COLORS = { y: 1, r: 1, g: 1, b: 1, v: 1, p: 1, o: 1, n: 1 };
    var HL_HEX = { y: "#ffd400", r: "#ff6666", g: "#5fb236", b: "#2ea8e5",
                   v: "#a28ae5", p: "#e56eee", o: "#f19837", n: "#aaaaaa" };
    var HL_NAMES = { y: "黄", r: "红", g: "绿", b: "蓝", v: "紫", p: "品红", o: "橙", n: "灰" };
    var hlColor = "y";           // 上次用过的颜色
    var hlToolOn = false;        // 动作条上的「高亮」工具是否开启（选中即标注）
    var hlMode = null;           // null | "new" | "edit"
    var hlPending = null;        // { t, range }
    var hlEditTab = null;
    var hlEditId = null;
    var hlActiveId = null;
    var hlSaveTimer = null;

    function hlKey(t) {
      if (!t) return "";
      if (t.path) return "f:" + String(t.path).toLowerCase();
      return "n:" + (t.name || "");
    }
    function hlDocOf(t) {
      try { return (t && t.iframe) ? t.iframe.contentDocument : null; } catch (e) { return null; }
    }
    function hlItems(t) {
      var k = hlKey(t);
      return (HL && HL[k]) ? HL[k] : [];
    }
    function hlFindItem(t, id) {
      var a = hlItems(t);
      for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i];
      return null;
    }
    function hlWrite() {
      var out = {};
      for (var k in HL) {
        if (!Object.prototype.hasOwnProperty.call(HL, k)) continue;
        if (HL[k] && HL[k].length) out[k] = HL[k];
      }
      saveCfg({ highlights: out });
    }
    function hlSaveSoon() {
      if (hlSaveTimer) clearTimeout(hlSaveTimer);
      hlSaveTimer = setTimeout(function () {
        hlSaveTimer = null;
        hlWrite();
      }, 450);
    }

    // ---- 注入到 iframe 里的高亮样式（随主题变色） ----
    function hlEnsureStyle(doc) {
      try {
        if (!doc || doc.getElementById("pm-hl-style")) return;
        var st = doc.createElement("style");
        st.id = "pm-hl-style";
        st.textContent =
          "mark.pm-hl{background-color:rgba(255,212,0,.50)!important;color:inherit!important;" +
            "padding:0 1px;border-radius:2px;cursor:pointer;" +
            "-webkit-box-decoration-break:clone;box-decoration-break:clone;" +
            "transition:background-color .12s ease;}" +
          "mark.pm-hl-r{background-color:rgba(255,102,102,.34)!important;}" +
          "mark.pm-hl-g{background-color:rgba(95,178,54,.38)!important;}" +
          "mark.pm-hl-b{background-color:rgba(46,168,229,.30)!important;}" +
          "mark.pm-hl-v{background-color:rgba(162,138,229,.38)!important;}" +
          "mark.pm-hl-p{background-color:rgba(229,110,238,.32)!important;}" +
          "mark.pm-hl-o{background-color:rgba(241,152,55,.34)!important;}" +
          "mark.pm-hl-n{background-color:rgba(170,170,170,.38)!important;}" +
          "body.dark mark.pm-hl,.markdown-body.dark mark.pm-hl{background-color:rgba(255,212,0,.30)!important;}" +
          "body.dark mark.pm-hl-r,.markdown-body.dark mark.pm-hl-r{background-color:rgba(255,102,102,.32)!important;}" +
          "body.dark mark.pm-hl-g,.markdown-body.dark mark.pm-hl-g{background-color:rgba(95,178,54,.32)!important;}" +
          "body.dark mark.pm-hl-b,.markdown-body.dark mark.pm-hl-b{background-color:rgba(46,168,229,.36)!important;}" +
          "body.dark mark.pm-hl-v,.markdown-body.dark mark.pm-hl-v{background-color:rgba(162,138,229,.38)!important;}" +
          "body.dark mark.pm-hl-p,.markdown-body.dark mark.pm-hl-p{background-color:rgba(229,110,238,.34)!important;}" +
          "body.dark mark.pm-hl-o,.markdown-body.dark mark.pm-hl-o{background-color:rgba(241,152,55,.34)!important;}" +
          "body.dark mark.pm-hl-n,.markdown-body.dark mark.pm-hl-n{background-color:rgba(170,170,170,.46)!important;}" +
          "mark.pm-hl:hover{filter:brightness(.96);}" +
          "mark.pm-hl.hl-flash{outline:2px solid #0a84ff;outline-offset:1px;}";
