<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PureMD</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", Helvetica, Arial, sans-serif;
    background: #fff; color: #24292f;
    display: flex; flex-direction: column; overflow: hidden;
  }
  body.dark { background: #0d1117; color: #c9d1d9; }
  /* 外层固定条：左右滚动按钮 + 主题按钮固定，不随标签一起滚动 */
  #tabsbar {
    display: flex; align-items: center; gap: 4px;
    padding: 3px 6px; background: transparent;
    border-bottom: 0; flex: 0 0 auto;
    min-width: 0;
  }
  /* 内层标签区：可横向滚动 */
  #tabs {
    display: flex; align-items: stretch; gap: 2px;
    flex: 1 1 auto; min-width: 0;
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  #tabs::-webkit-scrollbar { height: 0; }
  .tab {
    display: inline-flex; align-items: center; gap: 2px;
    padding: 6px 8px; border: 1px solid transparent; border-bottom: 2px solid transparent;
    border-radius: 6px; cursor: pointer; font-size: 13px;
    white-space: nowrap; user-select: none; position: relative;
    /* 一行正好容纳 6 个标签：收缩下限 = 可视宽度/6（减掉间隙），第 7 个起才出现箭头 */
    flex: 0 1 auto; max-width: 200px; min-width: calc(100% / 6 - 3px);
    transition: box-shadow .12s ease;
  }
  .tab:hover {
    background: #eaeef2;
    border-color: #c8d0d8;
    box-shadow: 0 2px 6px rgba(31, 35, 40, 0.14), inset 0 0 0 1px rgba(255,255,255,0.6);
    z-index: 1;
  }
  body.dark .tab:hover {
    background: #30363d;
    border-color: #3b424b;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255,255,255,0.04);
    z-index: 1;
  }
  .tab.active {
    background: #fff;
    border-color: #d0d7de;
    border-bottom-color: #b6c0c9;
    box-shadow: 0 -3px 8px rgba(31, 35, 40, 0.10), 0 5px 14px rgba(31, 35, 40, 0.22), 0 2px 5px rgba(31, 35, 40, 0.16);
    z-index: 2;
  }
  body.dark .tab.active {
    background: #0d1117;
    border-color: #30363d;
    border-bottom-color: #c9d1d9;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.16), 0 4px 12px rgba(0,0,0,0.55), 0 1px 3px rgba(0,0,0,0.5);
    z-index: 2;
  }
  .tab .nm {
    flex: 1 1 auto; min-width: 0; overflow: hidden;
    -webkit-mask-image: linear-gradient(to left, transparent 0%, black 10px);
    mask-image: linear-gradient(to left, transparent 0%, black 10px);
  }
  .tab .x { opacity: .45; font-weight: 700; padding: 0 4px; flex: 0 0 auto; font-size: 17px; line-height: 1; }
  .tab .x:hover { opacity: 1; color: #cf222e; }
  /* 拖拽调整标签顺序 */
  .tab.dragging { opacity: .45; }
  .tab:active { cursor: grabbing; }
  /* 标签栏按钮：箭头/列表图标用 flex 双向居中 */
  .nav {
    display: inline-flex; align-items: center; justify-content: center;
    flex: 0 0 auto; min-width: 26px; align-self: stretch;
    border: 1px solid #d0d7de; border-bottom: 2px solid #d0d7de; background: #fff; color: #24292f;
    border-radius: 6px; cursor: pointer; font-size: 15px; line-height: 1; padding: 0 6px;
    position: relative;
    transition: box-shadow .12s ease;
  }
  /* 导航按钮（☰ / ‹ / ›）：hover 圆润阴影方框；选中（下拉展开或按下）时彩色下边框 + 三层下部重阴影，立体凸起，与标签风格一致 */
  .nav:hover {
    box-shadow: 0 2px 6px rgba(31,35,40,0.14), inset 0 0 0 1px rgba(255,255,255,0.5);
    z-index: 1;
  }
  .nav:active, .nav.on {
    border-bottom-color: #6e7781;
    box-shadow: 0 -3px 8px rgba(31,35,40,0.12), 0 6px 16px rgba(31,35,40,0.28), 0 2px 6px rgba(31,35,40,0.20);
    z-index: 2;
  }
  body.dark .nav { background: #21262d; color: #c9d1d9; border-color: #30363d; }
  body.dark .nav:hover {
    box-shadow: 0 2px 6px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.04);
  }
  body.dark .nav:active, body.dark .nav.on {
    border-bottom-color: #c9d1d9;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.16), 0 4px 12px rgba(0,0,0,0.55), 0 1px 3px rgba(0,0,0,0.5);
  }
  /* 垂直列显示：点“☰”弹出的标签名列表 */
  #tablist {
    position: fixed; z-index: 50; display: none;
    min-width: 200px; max-width: 340px; max-height: 60vh; overflow-y: auto;
    background: #fff; border: 1px solid #d0d7de; border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .18); padding: 4px;
  }
  #tablist .li {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 4px; cursor: pointer;
    font-size: 13px; white-space: nowrap; overflow: hidden;
  }
  #tablist .li .tl-nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #tablist .li .tl-x {
    flex: 0 0 auto; width: 20px; height: 20px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; line-height: 1; color: #8b949e; cursor: pointer;
    -webkit-user-select: none; user-select: none;
  }
  #tablist .li .tl-x:hover { background: #ffebe9; color: #cf222e; }
  body.dark #tablist .li .tl-x { color: #8b949e; }
  body.dark #tablist .li .tl-x:hover { background: #5a2a2a; color: #ff7b72; }
  body.beige #tablist .li .tl-x { color: #8a7a5e; }
  body.beige #tablist .li .tl-x:hover { background: #ecd9b0; color: #a04030; }
  #tablist .li:hover { background: #eaeef2; }
  #tablist .li.active { background: #eaeef2; font-weight: 600; }
  #tablist .li.dragging { opacity: .45; }
  body.dark #tablist { background: #161b22; border-color: #30363d; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
  body.dark #tablist .li:hover, body.dark #tablist .li.active { background: #30363d; }
  body.beige #tablist { background: #f4ecd8; border-color: #d8cba8; }
  body.beige #tablist .li:hover, body.beige #tablist .li.active { background: #e0d5b8; }
  /* ☰ 菜单打开时盖住文档区的透明掩体：点它 = 点"面板外部"，用于关闭菜单。
     iframe 内部的点击不会冒泡到父文档（这是 WebView2/Chromium 的确定行为），
     只有盖一层掩体才能可靠捕获"点文档区即关菜单"。顶栏/标签栏不被掩体覆盖，
     点它们关闭菜单走 document 上的监听。 */
  #tabmask { position: absolute; inset: 0; z-index: 40; display: none; }
  button.theme {
    flex: 0 0 auto;
    border: 1px solid transparent; border-bottom: 2px solid transparent;
    background: #f6f8fa; color: #24292f;
    border-radius: 6px; padding: 6px 10px 2px; cursor: pointer; font-size: 12px;
    position: relative;
    transition: box-shadow .12s ease;
  }
  button.theme:hover {
    background: #fff;
    border-color: #d0d7de; border-bottom-color: #d0d7de;
    box-shadow: 0 2px 6px rgba(31,35,40,0.14), inset 0 0 0 1px rgba(255,255,255,0.5);
    z-index: 1;
  }
  button.theme:active, button.theme.on {
    background: #fff;
    border-bottom-color: #6e7781;
    box-shadow: 0 -3px 8px rgba(31,35,40,0.12), 0 6px 16px rgba(31,35,40,0.28), 0 2px 6px rgba(31,35,40,0.20);
    z-index: 2;
  }
  body.dark button.theme { background: #161b22; color: #c9d1d9; border-color: transparent; }
  body.dark button.theme:hover {
    background: #21262d;
    border-color: #30363d; border-bottom-color: #30363d;
    box-shadow: 0 2px 6px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.04);
  }
  body.dark button.theme:active, body.dark button.theme.on {
    background: #21262d;
    border-bottom-color: #c9d1d9;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.16), 0 4px 12px rgba(0,0,0,0.55), 0 1px 3px rgba(0,0,0,0.5);
  }
  #views { flex: 1 1 auto; position: relative; overflow: hidden; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  body.dark iframe { background: #0d1117; }
  .empty {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: #6e7781; font-size: 14px;
  }
  body.dark .empty { color: #8b949e; }
  /* ===== 标签栏下面一行：动作条 =====
     左：侧栏开关 + 文件/大纲/高亮（侧栏打开时才出现）；中：编辑 / 高亮；右：主题 + 字号 */
  #actbar {
    position: relative;
    display: flex; align-items: center;
    gap: 6px; padding: 4px 8px 5px;
    border-top: 1px solid #e6eaef;
    flex: 0 0 auto;
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none;
    -webkit-user-select: none; user-select: none;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  #actbar::-webkit-scrollbar { height: 0; }
  body.dark #actbar { border-top-color: #21262d; }
  body.beige #actbar { border-top-color: #ded1b2; }
  #actbar .ab-left { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  #actbar .ab-right { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; margin-left: auto; }
  /* 侧栏的三个页签：跟开关图标同一行，侧栏收起时整组隐藏 */
  #actbar .ab-tabs {
    display: none; align-items: center; gap: 2px;
    background: #eaeef2; border-radius: 6px; padding: 2px;
    flex: 0 0 auto;
  }
  body.sb-open #actbar .ab-tabs { display: flex; }
  #actbar .ab-tab {
    border: 0; background: transparent; color: #57606a;
    font-size: 12px; line-height: 1; padding: 4px 10px; border-radius: 4px;
    cursor: pointer; white-space: nowrap;
    font-family: inherit;
    transition: background .12s ease, color .12s ease;
  }
  #actbar .ab-tab:hover { color: #24292f; }
  #actbar .ab-tab.active { background: #fff; color: #24292f; font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .10); }
  body.dark #actbar .ab-tabs { background: #21262d; }
  body.dark #actbar .ab-tab { color: #8b949e; }
  body.dark #actbar .ab-tab:hover { color: #c9d1d9; }
  body.dark #actbar .ab-tab.active { background: #30363d; color: #c9d1d9; }
  body.beige #actbar .ab-tabs { background: #e6dcc3; }
  body.beige #actbar .ab-tab { color: #6b5c46; }
  body.beige #actbar .ab-tab:hover { color: #4a3b28; }
  body.beige #actbar .ab-tab.active { background: #f7f0dd; color: #4a3b28; }
  /* 字号百分比：点击回到 100% */
  #actbar .ab-zoom {
    font-size: 11px; line-height: 1; min-width: 36px; text-align: center;
    color: #57606a; font-variant-numeric: tabular-nums; cursor: pointer;
    padding: 6px 2px; border-radius: 5px;
  }
  #actbar .ab-zoom:hover { background: #eef1f4; color: #24292f; }
  body.dark #actbar .ab-zoom { color: #8b949e; }
  body.dark #actbar .ab-zoom:hover { background: #21262d; color: #c9d1d9; }
  body.beige #actbar .ab-zoom { color: #6b5c46; }
  body.beige #actbar .ab-zoom:hover { background: #e6dcc3; color: #4a3b28; }
  #actbar .ab-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    height: 25px; padding: 0 9px;
    border: 1px solid transparent; border-radius: 6px;
    background: transparent; color: #24292f;
    font-size: 12px; line-height: 1; white-space: nowrap; cursor: pointer;
    transition: background .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  #actbar .ab-btn:hover {
    background: #fff; border-color: #d0d7de;
    box-shadow: 0 1px 4px rgba(31, 35, 40, .12);
  }
  #actbar .ab-btn:active { box-shadow: inset 0 0 0 1px rgba(31, 35, 40, .10); }
  #actbar .ab-btn.on { background: #eaf3fd; border-color: #b6d7fb; color: #0969da; }
  #actbar .ab-btn.icon { width: 27px; padding: 0; color: #57606a; }
  #actbar .ab-btn.icon.on { background: #e7edf4; border-color: #cfd8e3; color: #0969da; }
  #actbar .ab-btn.editing {
    background: #0969da; border-color: #0969da; color: #fff;
    box-shadow: 0 1px 4px rgba(9, 105, 218, .35);
  }
  #actbar .ab-btn.editing:hover { background: #0860c4; border-color: #0860c4; }
  #actbar .ab-btn.primary {
    background: #1f883d; border-color: #1f883d; color: #fff; font-weight: 600;
  }
  #actbar .ab-btn.primary:hover { background: #1a7f37; border-color: #1a7f37; }
  #actbar .ab-btn:disabled { cursor: default; opacity: .5; box-shadow: none; }
  #actbar .ab-btn:disabled:hover { background: transparent; border-color: transparent; }
  /* 侧栏开关紧跟在最左边，和「文件/大纲/高亮」同一行 */
  #actbar #sbToggleBtn { flex: 0 0 auto; }
  #actbar .ab-sep { width: 1px; height: 15px; background: #d8dee4; margin: 0 2px; }
  body.dark #actbar .ab-sep { background: #30363d; }
  body.beige #actbar .ab-sep { background: #d8cba8; }
  /* 高亮当前颜色小方块 */
  #actbar .hl-chip {
    width: 11px; height: 11px; border-radius: 3px;
    box-shadow: 0 0 0 1px rgba(31, 35, 40, .22);
    display: inline-block; background: #ffd400;
  }
  #actbar .hl-caret { font-size: 8px; opacity: .55; margin-left: -2px; position: relative; top: 1px; }
  body.dark #actbar .ab-btn { color: #c9d1d9; }
  body.dark #actbar .ab-btn:hover { background: #21262d; border-color: #30363d; }
  body.dark #actbar .ab-btn.on { background: #12283f; border-color: #1f4b7a; color: #79c0ff; }
  body.dark #actbar .ab-btn.icon { color: #8b949e; }
  body.dark #actbar .ab-btn.icon.on { color: #58a6ff; }
  body.dark #actbar .ab-btn.editing { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  body.dark #actbar .ab-btn.primary { background: #238636; border-color: #238636; color: #fff; }
  body.beige #actbar .ab-btn { color: #4a3b28; }
  body.beige #actbar .ab-btn:hover { background: #e6dcc3; border-color: #d8cba8; }
  body.beige #actbar .ab-btn.on { background: #e2d3a8; border-color: #c9b583; color: #7a5a1e; }
  body.beige #actbar .ab-btn.icon { color: #6b5c46; }
  body.beige #actbar .ab-btn.icon.on { color: #8a6b1f; }
  body.beige #actbar .ab-btn.editing { background: #8c7b52; border-color: #8c7b52; color: #fff8e7; }
  body.beige #actbar .ab-btn.primary { background: #5f7a4a; border-color: #5f7a4a; color: #fff; }
  /* 高亮颜色选择浮层 */
  #hlPick {
    position: fixed; z-index: 950; display: none;
    background: #fff; border: 1px solid #d0d7de; border-radius: 8px;
    box-shadow: 0 6px 20px rgba(31, 35, 40, .18); padding: 8px 9px;
  }
  body.dark #hlPick { background: #161b22; border-color: #30363d; box-shadow: 0 6px 20px rgba(0, 0, 0, .6); }
  body.beige #hlPick { background: #f4ecd8; border-color: #d8cba8; }
  #hlPick .hl-row { display: flex; gap: 7px; }
  #hlPick .hl-sw { width: 18px; height: 18px; }
  /* 顶部 chrome：第一行 = 自绘标题栏（PureMD 文字 + 工具栏 + 窗口控制），第二行 = 标签栏 */
  #chrome {
    position: relative;
    display: flex; flex-direction: column;
    background: #f6f8fa;
    border-bottom: 1px solid #d0d7de; flex: 0 0 auto;
  }
  body.dark #chrome { background: #161b22; border-bottom-color: #30363d; }
  body.beige #chrome { background: #ede3cc; border-bottom-color: #d8cba8; }
  /* 第一行：标题栏（可拖动区 + 工具按钮 + 窗口最小化/最大化/关闭） */
  #titlebar {
    display: flex; align-items: center; gap: 4px;
    padding: 4px 6px; flex: 0 0 auto;
    -webkit-user-select: none; user-select: none;
  }
  .drag-area {
    flex: 0 0 auto; min-width: 0; height: 26px;
    display: flex; align-items: center; padding: 0 2px;
    cursor: default;
  }
  .app-icon {
    flex: 0 0 auto; display: block; margin-right: 6px;
    border-radius: 4px;
  }
  .app-title {
    font-size: 13px; font-weight: 600; letter-spacing: .3px;
    color: #57606a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  body.dark .app-title { color: #8b949e; }
  body.beige .app-title { color: #6b5c46; }
  /* 窗口控制按钮（最小化 / 最大化 / 关闭） */
  .winctrls { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; margin-left: 4px; }
  .winbtn {
    width: 30px; height: 26px; border: 1px solid transparent; background: transparent;
    color: #57606a; border-radius: 6px; cursor: pointer; font-size: 13px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    transition: box-shadow .12s ease, background .12s ease;
  }
  .winbtn:hover { background: #fff; border-color: #d0d7de; box-shadow: 0 2px 6px rgba(31,35,40,0.14); }
  .winbtn:active { box-shadow: inset 0 0 0 1px rgba(31,35,40,0.14); }
  .winbtn.close:hover { background: #e5534b; color: #fff; border-color: #e5534b; box-shadow: 0 2px 8px rgba(229,83,75,0.4); }
  .winbtn:disabled { opacity: .4; cursor: default; }
  .winbtn svg { display: block; pointer-events: none; }
  body.dark .winbtn { color: #8b949e; }
  body.dark .winbtn:hover { background: #21262d; border-color: #30363d; box-shadow: 0 2px 6px rgba(0,0,0,0.35); }
  body.dark .winbtn:active { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14); }
  body.dark .winbtn.close:hover { background: #f85149; border-color: #f85149; }
  body.beige .winbtn { color: #6b5c46; }
  body.beige .winbtn:hover { background: #e6dcc3; border-color: #d8cba8; box-shadow: 0 2px 6px rgba(74,59,40,0.14); }
  /* 系统深色模式：标题栏元素也跟随变暗 */
  @media (prefers-color-scheme: dark) {
    body:not(.light):not(.beige) .app-title { color: #8b949e; }
    body:not(.light):not(.beige) .winbtn { color: #8b949e; }
    body:not(.light):not(.beige) .winbtn:hover { background: #21262d; border-color: #30363d; box-shadow: 0 2px 6px rgba(0,0,0,0.35); }
    body:not(.light):not(.beige) .winbtn.close:hover { background: #f85149; border-color: #f85149; }
  }
  /* 顶部工具栏：打开 / 导出 / 主题 / 重新加载 / 帮助 / 自动刷新 */
  #topbar {
    display: flex; align-items: center; gap: 4px;
    padding: 0; background: transparent;
    border-bottom: 0; flex: 0 0 auto;
    margin-left: 4px;
  }
  /* 工具栏字体：微软雅黑（Windows 系统自带、完全离线） */
  #topbar, #topbar button, #topbar label {
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  #topbar button.toolbtn {
    border: 1px solid transparent; border-bottom: 2px solid transparent;
    background: #f6f8fa; color: #24292f;
    border-radius: 6px; padding: 6px 10px 2px; cursor: pointer; font-size: 12px;
    position: relative;
    transition: box-shadow .12s ease;
  }
  #topbar button.toolbtn:hover {
    background: #fff;
    border-color: #d0d7de; border-bottom-color: #d0d7de;
    box-shadow: 0 2px 6px rgba(31,35,40,0.14), inset 0 0 0 1px rgba(255,255,255,0.5);
    z-index: 1;
  }
  #topbar button.toolbtn:active, #topbar button.toolbtn.on {
    background: #fff;
    border-bottom-color: #6e7781;
    box-shadow: 0 -3px 8px rgba(31,35,40,0.12), 0 6px 16px rgba(31,35,40,0.28), 0 2px 6px rgba(31,35,40,0.20);
    z-index: 2;
  }
  body.dark #topbar button.toolbtn { background: #161b22; color: #c9d1d9; border-color: transparent; }
  body.dark #topbar button.toolbtn:hover {
    background: #21262d;
    border-color: #30363d; border-bottom-color: #30363d;

  /* 展开/折叠箭头：SVG chevron 经 mask 上色（可随主题变色），比 ▸/▾ 字符更大更锐利 */

  .sb-caret::before {
    content: ""; width: 13px; height: 13px; background-color: currentColor;
    -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M5.8 3.2 L10.8 8 L5.8 12.8' fill='none' stroke='%23000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    -webkit-mask-size: contain; -webkit-mask-position: center; -webkit-mask-repeat: no-repeat;
    mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M5.8 3.2 L10.8 8 L5.8 12.8' fill='none' stroke='%23000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    mask-size: contain; mask-position: center; mask-repeat: no-repeat;
    transition: transform .12s ease;
  }
  .sb-caret.open::before { transform: rotate(90deg); }

  .sb-ico { flex: 0 0 auto; font-size: 12px; }
  .sb-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .sb-err { color: #cf222e; font-size: 12px; padding: 6px 10px; }
  body.dark .sb-err { color: #f85149; }
  /* 文件行行尾的关闭按钮：只有该文件已在标签页里打开时才显示 */
  .sb-close {
    flex: 0 0 auto; display: none; align-items: center; justify-content: center;
    width: 18px; height: 18px; margin-right: -2px; border-radius: 4px;
    font-size: 13px; line-height: 1; color: #6e7781; cursor: pointer;
    -webkit-user-select: none; user-select: none;
  }
  .sb-row.file.opened .sb-close { display: inline-flex; }
  .sb-close:hover { background: #ffebe9; color: #cf222e; }
  body.dark .sb-close { color: #8b949e; }
  body.dark .sb-close:hover { background: #5a2a2a; color: #ff7b72; }
  body.beige .sb-close { color: #8a7a5e; }
  body.beige .sb-close:hover { background: #ecd9b0; color: #a04030; }

  /* ---- 侧栏宽度拖拽条：贴在侧栏右边缘外侧（净占宽 0，不挡树里的滚动条） ---- */
  #sbResizer {
    flex: 0 0 8px; width: 8px; margin-right: -8px; align-self: stretch;
    display: none; position: relative; z-index: 9999; cursor: col-resize;
  }
  #sidebar.show + #sbResizer { display: block; }
  #sbResizer::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 2px;
    background: transparent; transition: background .12s;
  }
  #sbResizer:hover::before, body.sb-resizing #sbResizer::before { background: #0969da; }
  body.dark #sbResizer:hover::before, body.dark.sb-resizing #sbResizer::before { background: #58a6ff; }
  body.beige #sbResizer:hover::before, body.beige.sb-resizing #sbResizer::before { background: #8a6b1f; }
  body.sb-resizing { cursor: col-resize; user-select: none; }
  /* 拖拽期间的鼠标事件由 #dragshield 接管（见下方说明），不再屏蔽 iframe */
  #views { position: relative; z-index: 0; }

  /* ---- 侧栏里的 .md 文件使用 PureMD 的 M 图标（48px PNG 内嵌，仅 848 字节） ---- */
  .sb-ico-file {
    flex: 0 0 auto; width: 14px; height: 14px;
    background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAADAElEQVR42u2ay2sTQRzHvzO7G2vSJI1Ri0q1ICZplYJIkr32D6gi+j94U1REfN18IF6kN8Gjt7YU9Q/wlBJbxReNJmlPosWi2MZgStJkPJQ8NrtmH5lNNtUfDIR9wPczv9fsTID/1l0jRh6Sb+dZtwQmb/YTywDxO7+YU2b65Q0vMQwQu+sc4c02f10JogKI3ssxp8f9wjVfTbfYfJMR1rtJfOL+es+of33VT1Qe6LXZV3jg+IOfPaf+zZUAqXmgYnD2314OcBfy+du65vWJJxXdd2k9fPSHHeIBYGjQr3ldT48SgLKW492lgK3hoAWhp6nJA6zl6IQ1Q3y4GJT1NFEz7uoGhJ4msZ0S+uJ9Eecmc4progC8mgzCvUNJnS8wRC/8QLkpLx+d92F8zKWCqCa2ni7uIbRZBubTJfViLF1SiTfiCRMhxC8HEik1wNzHkqWQ0tMkNsZaOyZQ1GY4kSoC8CgBUkXNZ/UB0JkQ8roJDu0VAABLX8tYXasrXF2rYHmlDAAYHhTgdRNuHqCNnbjVMGLxiKQZRnMNv+WGZ4yYniauZVRWABQb4r9oGcDWMqryQFhSzDpjACHKBI6bBmitiyvAHj/F4X0CllfK+J6rIPNlEwIltXw4sl9A0EttAqDgYnJEqiVsIlWCKDTcG3GZL6MUnW1kikReLCkTOCzZ2Qf4LNjiYQmEAIwBC9m6BygBYhYBOuqBQD9F6MDWvGwUGfKFrXcjQyL8HsLdA7asRrVKpdnyabSMcm1krUqlVQA9TaIdOxKxkARKgAqrr32iIcnyYo7LN7EZ87kJRg7Wd2yODYvw9BFbQqgtD4yPuZB5vFvz3uytgb/vbz4MOrMT22H/EgAcCgCjayGHeoBy6sTBqaXObtoSInPtxIwAu6aXOio+MJVNGi6jRrvtwEwW62dDst0Q/ulMsgJm7oDDN5PumS323JnwNjvgqFr/7CfHU+RPR7bpIV/V3E9TjqX4fWqUGD6p3/nMOSCFk6PE8n8l+p4vdg1kY+IowXa2P3zpfDtYRzRpAAAAAElFTkSuQmCC");
    background-repeat: no-repeat; background-position: center; background-size: contain;
  }

  /* 「文件 / 大纲 / 高亮」三个页签已挪到动作条（见 #actbar .ab-tabs） */

  /* 标题大纲 */
  #sidebar .sb-toc { flex: 1 1 auto; overflow: auto; padding: 6px 0 12px; scrollbar-width: thin; }
  .toc-item {
    padding: 3px 8px 3px 0; cursor: pointer; font-size: 12.5px; line-height: 1.5;
    color: #24292f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border-left: 2px solid transparent;
  }
  .toc-item:hover { background: #eaeef2; }
  .toc-item.active { color: #0969da; border-left-color: #0969da; background: #ddf4ff; }
  .toc-lv1 { font-weight: 600; font-size: 13px; }
  .toc-lv2 { font-weight: 500; }
  .toc-lv3, .toc-lv4, .toc-lv5, .toc-lv6 { color: #57606a; }
  body.dark .toc-item { color: #c9d1d9; }
  body.dark .toc-item:hover { background: #30363d; }
  body.dark .toc-item.active { color: #58a6ff; border-left-color: #58a6ff; background: #0d2d4b; }
  body.dark .toc-lv3, body.dark .toc-lv4, body.dark .toc-lv5, body.dark .toc-lv6 { color: #8b949e; }
  body.beige .toc-item { color: #4a3b28; }
  body.beige .toc-item:hover { background: #e0d5b8; }
  body.beige .toc-item.active { color: #8a6b1f; border-left-color: #8a6b1f; background: #f3e8c8; }
  body.beige .toc-lv3, body.beige .toc-lv4, body.beige .toc-lv5, body.beige .toc-lv6 { color: #6b5c46; }

  /* ---- 自由缩放手柄：8 个边缘/角，覆盖在窗口四周，拖拽即改窗口尺寸 ----
     必须用 fixed 直接贴视口四边；挂在 #chrome（仅标题栏高度）里用 absolute
     会让下/右/角手柄全部缩到标题栏范围内，窗口真四角点不到。 */
  .rg { position: fixed; z-index: 9999; background: transparent; }
  .rg-n  { top: 0;    left: 0; right: 0;  height: 6px;  cursor: ns-resize; }
  .rg-s  { bottom: 0; left: 0; right: 0;  height: 6px;  cursor: ns-resize; }
  .rg-w  { top: 0; bottom: 0; left: 0;   width: 6px;    cursor: ew-resize; }
  .rg-e  { top: 0; bottom: 0; right: 0;  width: 6px;    cursor: ew-resize; }
  .rg-ne { top: 0;    right: 0;   width: 14px; height: 14px; cursor: nesw-resize; z-index: 10000; }
  .rg-nw { top: 0;    left: 0;    width: 14px; height: 14px; cursor: nwse-resize; z-index: 10000; }
  .rg-se { bottom: 0; right: 0;   width: 14px; height: 14px; cursor: nwse-resize; z-index: 10000; }
  .rg-sw { bottom: 0; left: 0;    width: 14px; height: 14px; cursor: nesw-resize; z-index: 10000; }
  /* 缩放时整窗禁止选中文字，避免拖拽误选 */
  body.resizing, body.resizing * { user-select: none !important; }
  /* 拖拽期间接住鼠标事件的透明遮罩。
     以前用 `body.resizing #views iframe { pointer-events:none }` 让 mousemove 回到父页，
     但 Chromium 的合成器会把被屏蔽的 iframe 从滚轮命中树里摘掉，恢复 auto 后滚轮仍然
     失灵（只能靠布局变化重建命中树）——这是「拖过侧栏/窗口后正文滚不动」的真正原因。
     改成盖一层遮罩：iframe 的 pointer-events 全程保持 auto，命中树不受影响。 */
  #dragshield {
    position: fixed; inset: 0; z-index: 9998; display: none;
    background: transparent;
  }

  /* ---- 高亮标注：浮动工具条 / 编辑气泡 ---- */
  #hlPop {
    position: fixed; z-index: 900; display: none; width: 264px;
    background: #fff; color: #24292f; border: 1px solid #d0d7de; border-radius: 10px;
    box-shadow: 0 8px 28px rgba(31, 35, 40, .18); padding: 9px 10px 10px;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  body.dark #hlPop { background: #161b22; color: #c9d1d9; border-color: #30363d; box-shadow: 0 8px 28px rgba(0, 0, 0, .6); }
  body.beige #hlPop { background: #f4ecd8; color: #4a3b28; border-color: #d8cba8; box-shadow: 0 8px 28px rgba(74, 59, 40, .22); }
  #hlPop .hl-row1 { display: flex; align-items: center; gap: 8px; }
  #hlPop .hl-label { font-size: 11.5px; color: #6e7781; white-space: nowrap; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; }
  body.dark #hlPop .hl-label { color: #8b949e; }
  body.beige #hlPop .hl-label { color: #6b5c46; }
  #hlPop .hl-swatches { display: flex; gap: 6px; margin-left: auto; }
  .hl-sw {
    width: 16px; height: 16px; border-radius: 3px; border: 0;
    box-shadow: 0 0 0 1px rgba(31, 35, 40, .16); cursor: pointer; padding: 0;
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .hl-sw.y { background: #ffd400; }
  .hl-sw.r { background: #ff6666; }
  .hl-sw.g { background: #5fb236; }
  .hl-sw.b { background: #2ea8e5; }
  .hl-sw.v { background: #a28ae5; }
  .hl-sw.p { background: #e56eee; }
  .hl-sw.o { background: #f19837; }
  .hl-sw.n { background: #aaaaaa; }
  .hl-sw:hover { transform: scale(1.15); }
  .hl-sw.active { box-shadow: 0 0 0 2px #0969da, 0 0 0 3px #fff; transform: scale(1.12); }
  body.dark .hl-sw.active { box-shadow: 0 0 0 2px #58a6ff, 0 0 0 3px #161b22; }
  body.beige .hl-sw.active { box-shadow: 0 0 0 2px #8a6b1f, 0 0 0 3px #f4ecd8; }
  #hlPop .hl-note {
    width: 100%; box-sizing: border-box; margin-top: 9px; height: 54px; resize: vertical;
    font: 12px/1.55 "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    border: 1px solid #d0d7de; border-radius: 6px; padding: 5px 7px;
    background: #fff; color: #24292f; outline: none;
  }
  #hlPop .hl-note:focus { border-color: #0969da; box-shadow: 0 0 0 2px rgba(9, 105, 218, .14); }
  body.dark #hlPop .hl-note { background: #0d1117; color: #c9d1d9; border-color: #30363d; }
  body.beige #hlPop .hl-note { background: #fffaf0; color: #4a3b28; border-color: #d8cba8; }
  #hlPop .hl-acts { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  #hlPop .hl-acts button {
    border: 1px solid #d0d7de; background: #fff; color: #24292f; border-radius: 6px;
    font-size: 11.5px; padding: 4px 9px; cursor: pointer;
  }
  body.dark #hlPop .hl-acts button { background: #21262d; color: #c9d1d9; border-color: #30363d; }
  body.beige #hlPop .hl-acts button { background: #e6dcc3; color: #4a3b28; border-color: #d8cba8; }
  #hlPop .hl-acts .hl-del { color: #cf222e; border-color: #f0b6b6; }
  body.dark #hlPop .hl-acts .hl-del { color: #ff7b72; border-color: #5a2a2a; }
  #hlPop .hl-acts .hl-hint { margin-left: auto; font-size: 10.5px; color: #8c959f; }
  body.dark #hlPop .hl-acts .hl-hint { color: #6e7681; }
  body.beige #hlPop .hl-acts .hl-hint { color: #8a7a5e; }

  /* ---- 侧栏高亮列表 ---- */
  #sidebar .sb-hl { flex: 1 1 auto; overflow: auto; padding: 6px 0 12px; scrollbar-width: thin; }
  .hl-item { display: flex; gap: 7px; padding: 5px 8px; cursor: pointer; border-left: 2px solid transparent; }
  .hl-item:hover { background: #eaeef2; }
  body.dark .hl-item:hover { background: #30363d; }
  body.beige .hl-item:hover { background: #e0d5b8; }
  .hl-item.active { background: #ddf4ff; border-left-color: #0969da; }
  body.dark .hl-item.active { background: #0d2d4b; border-left-color: #58a6ff; }
  body.beige .hl-item.active { background: #f3e8c8; border-left-color: #8a6b1f; }
  .hl-dot { flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; }
  .hl-dot.y { background: #ffd400; }
  .hl-dot.r { background: #ff6666; }
  .hl-dot.g { background: #5fb236; }
  .hl-dot.b { background: #2ea8e5; }
  .hl-dot.v { background: #a28ae5; }
  .hl-dot.p { background: #e56eee; }
  .hl-dot.o { background: #f19837; }
  .hl-dot.n { background: #aaaaaa; }
  .hl-body { flex: 1 1 auto; min-width: 0; }
  .hl-txt {
    display: block; font-size: 12.5px; line-height: 1.45; color: #24292f;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  body.dark .hl-txt { color: #c9d1d9; }
  body.beige .hl-txt { color: #4a3b28; }
  .hl-nt {
    display: block; font-size: 11.5px; line-height: 1.4; color: #0969da;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  body.dark .hl-nt { color: #58a6ff; }
  body.beige .hl-nt { color: #8a6b1f; }
  /* 「文件中」小标：表示这条高亮已写进 .md（==文字==） */
  .hl-file-tag {
    display: inline-block; margin-left: 5px; padding: 0 5px; border-radius: 8px;
    font-size: 10px; line-height: 15px; vertical-align: 1px;
    background: #ddf4ff; color: #0969da; border: 1px solid #b6e3ff;
  }
  body.dark .hl-file-tag { background: #10304f; color: #79c0ff; border-color: #1f4b78; }
  body.beige .hl-file-tag { background: #e8dcb8; color: #7a5a1e; border-color: #d8cba8; }
  .hl-del2 {
    flex: 0 0 auto; align-self: center; width: 18px; height: 18px; line-height: 1;
    border: 0; background: transparent; color: #8c959f; cursor: pointer; border-radius: 4px;
    opacity: 0; font-size: 13px; padding: 0;
  }
  .hl-item:hover .hl-del2 { opacity: 1; }
  .hl-del2:hover { background: #ffebe9; color: #cf222e; }
  body.dark .hl-del2:hover { background: #5a2a2a; color: #ff7b72; }
</style>
</head>
<body>
  <div id="chrome">
    <div id="titlebar" class="pm-drag-region">
      <div class="drag-area pm-drag-region">
        <svg class="app-icon pm-drag-region" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <rect x="1.5" y="1.5" width="21" height="21" rx="5.5" fill="#0a84ff"/>
          <path d="M7 17 V8 L12 12.5 L17 8 V17" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="app-title pm-drag-region">PureMD</span>
      </div>
      <div id="topbar">
        <button class="toolbtn" id="openBtn">打开</button>
        <button class="toolbtn" id="exportBtn" title="导出：PDF / Word（.docx）">导出</button>
        <button class="toolbtn" id="reloadBtn">重新加载</button>
        <button class="toolbtn" id="helpBtn" title="帮助：反馈问题 / 关于本软件">帮助</button>
        <label><input type="checkbox" id="watchChk"> 自动刷新</label>
      </div>
      <span id="status"></span>
      <div class="winctrls">
        <button class="winbtn" id="minBtn" title="最小化">&#8211;</button>
        <button class="winbtn" id="maxBtn" title="最大化" aria-label="最大化"><svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="1.5" y="1.5" width="9" height="9"/></svg></button>
        <button class="winbtn close" id="closeBtn" title="关闭">&#10005;</button>
      </div>
    </div>
    <div id="tabsbar">
      <button class="nav" id="navList" title="垂直列出所有标签">&#9776;</button>
      <button class="nav" id="navPrev" title="标签向左滚动">&#8249;</button>
      <div id="tabs"></div>
      <button class="nav" id="navNext" title="标签向右滚动">&#8250;</button>
    </div>
    <div id="actbar">
      <div class="ab-left">
        <button class="ab-btn icon" id="sbToggleBtn" title="显示 / 隐藏左侧侧栏（文件·大纲·高亮）（Ctrl+B）">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
               stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4.2" width="18" height="15.6" rx="2.6"/>
            <line x1="9.4" y1="4.2" x2="9.4" y2="19.8"/>
            <line x1="5.5" y1="8.2" x2="7.3" y2="8.2"/>
            <line x1="5.5" y1="12" x2="7.3" y2="12"/>
            <line x1="5.5" y1="15.8" x2="7.3" y2="15.8"/>
          </svg>
        </button>
        <span class="ab-tabs" id="sbTabsInBar">
          <button class="ab-tab active" id="sbTabFiles" title="浏览文件夹里的 .md">文件</button>
          <button class="ab-tab" id="sbTabToc" title="按标题跳转到正文">大纲</button>
          <button class="ab-tab" id="sbTabHl" title="本文的高亮与备注，点一下跳过去">高亮</button>
        </span>
      </div>
      <div class="ab-right">
        <button class="ab-btn" id="editBtn" title="进入编辑模式：可以直接改正文，改完点「保存」才写回源文件">✎ 编辑</button>
        <button class="ab-btn primary" id="saveBtn" style="display:none" title="保存到源文件（Ctrl+S），保存前自动备份 .bak">保存</button>
        <span class="ab-sep"></span>
        <button class="ab-btn" id="hlBtn" title="高亮工具：开启后选中文字立刻标注（再点一次关闭）">高亮</button>
        <button class="ab-btn" id="hlChipBtn" title="选择高亮颜色">
          <span class="hl-chip" id="hlChip"></span><span class="hl-caret">▾</span>
        </button>
        <span class="ab-sep"></span>
        <button class="ab-btn" id="themeBtn" onclick="toggleTheme()" title="切换主题：亮色 → 暗色 → 米色">主题：亮色</button>
        <span class="ab-sep"></span>
        <button class="ab-btn icon" id="zoomOutBtn" title="缩小正文字号（Ctrl+滚轮 或 Ctrl+-）">A−</button>
        <span class="ab-zoom" id="zoomPct" title="正文字号，点一下恢复 100%（Ctrl+0）">100%</span>
        <button class="ab-btn icon" id="zoomInBtn" title="放大正文字号（Ctrl+滚轮 或 Ctrl+=）">A+</button>
        <button class="ab-btn" id="fitBtn" title="适应窗口：正文字号随窗口大小自动调整">适应窗口</button>
      </div>
    </div>
  </div>
  <div id="tablist"></div>
  <div id="exportMenu" class="popmenu">
    <div class="hli" id="expPdf" title="走系统打印对话框，选“另存为 PDF”">导出 PDF</div>
    <div class="hli" id="expWord" title="保存为可编辑的 .docx Word 文件">导出 Word</div>
  </div>
  <div id="hlPick">
    <div class="hl-row">
      <button type="button" class="hl-sw y" data-c="y" title="黄色"></button>
      <button type="button" class="hl-sw r" data-c="r" title="红色"></button>
      <button type="button" class="hl-sw g" data-c="g" title="绿色"></button>
      <button type="button" class="hl-sw b" data-c="b" title="蓝色"></button>
      <button type="button" class="hl-sw v" data-c="v" title="紫色"></button>
      <button type="button" class="hl-sw p" data-c="p" title="品红"></button>
      <button type="button" class="hl-sw o" data-c="o" title="橙色"></button>
      <button type="button" class="hl-sw n" data-c="n" title="灰色"></button>
    </div>
  </div>
  <div id="helpMenu" class="popmenu">
    <div class="hli" id="helpUpdate" title="查询 GitHub Releases 是否有新版本">检查更新</div>
    <div class="hli" id="helpAutoChk" title="启动时自动检查新版本（需能访问 api.github.com）">自动检查更新：开</div>
    <div class="hli" id="helpFeedback">反馈</div>
    <div class="hli" id="helpAbout">关于</div>
  </div>
  <div id="main">
    <div id="sidebar">
      <div class="sb-head" id="sbHead">
        <button class="sb-btn" id="sbUp" title="返回上一级文件夹">&#8593;</button>
        <button class="sb-btn" id="sbOpen">打开文件夹</button>
        <span class="sb-path" id="sbPath"></span>
      </div>
      <div class="sb-tree" id="tree"></div>
      <div class="sb-toc" id="toc" style="display:none"></div>
      <div class="sb-hl" id="hlList" style="display:none"></div>

    <div id="views"><div id="tabmask"></div><div class="empty">没有打开的文档 &mdash; 双击任意 .md 即可在此打开</div></div>

  <script>
  /* 独立自包含脚本：放在 chrome 绘制之后、主脚本之前，不依赖后面任何代码。
     作用是把「窗口控制」和「标题栏拖动」做成最底层能力——即使后续脚本出错，
     最小 / 最大化 / 关闭 / 拖动依然可用（否则会出现关不掉窗口的死局）。 */
  (function () {
    function note(m) { try { var s = document.getElementById("status"); if (s) s.textContent = m; } catch (e) {} }
    function ready() { return !!(window.pywebview && window.pywebview.api); }
    function callApi(name) {
      if (!ready()) { note("窗口控制需要更新后的 exe"); return null; }
      try { return window.pywebview.api[name](); } catch (e) { note("窗口控制调用失败"); return null; }
    }

    /* ---- 窗口控制 ---- */
    var minB = document.getElementById("minBtn");
    var maxB = document.getElementById("maxBtn");
    var closeB = document.getElementById("closeBtn");
    if (minB) {
      minB.dataset.wired = "1";
      minB.addEventListener("click", function () { callApi("window_minimize"); });
    }
    if (closeB) {
      closeB.dataset.wired = "1";
      closeB.addEventListener("click", function () {
        // 关闭前尽力再落盘一次阅读位置（真正的位置保存在滚动停止时已写入，
        // 这里只是双保险，失败也不影响退出）
        try { if (window.saveSession) window.saveSession(); } catch (e) {}
        // 有未保存的编辑时先问一句，别让改动随窗口一起消失
        try { if (typeof window.__pmMaybeClose === "function" && window.__pmMaybeClose()) return; } catch (e) {}
        callApi("window_close");
      });
    }
    if (maxB) {
      maxB.dataset.wired = "1";
      // 最大化 / 还原图标（模仿 Windows 习惯：单方框=放大，双方框=还原），
      // 细描边风格与标题栏其他按钮一致；stroke 用 currentColor 跟随主题。
      var ICO_MAX = '<svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="1.5" y="1.5" width="9" height="9"/></svg>';
      var ICO_RESTORE = '<svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M5.5 5.5 L5.5 1.5 L10.5 1.5 L10.5 6.5 L6.5 6.5"/><path d="M1.5 10.5 L1.5 5.5 L5.5 5.5 M6.5 6.5 L6.5 10.5 L1.5 10.5"/></svg>';
      function setMaxUI(maxed) {
        maxB.setAttribute("data-max", maxed ? "1" : "0");
        maxB.innerHTML = maxed ? ICO_RESTORE : ICO_MAX;
        maxB.title = maxed ? "还原" : "最大化";
        maxB.setAttribute("aria-label", maxed ? "还原" : "最大化");
      }
      // Python 侧推送：拖标题栏 / 拖边缘还原窗口时，图标要跟着翻回「最大化」，
      // 否则按钮停留在还原态，与窗口实际状态相反（再点一次行为也会不对）。
      window.__pmMaxState = function (maxed) { setMaxUI(!!maxed); };
      maxB.addEventListener("click", function () {
        var maxed = maxB.getAttribute("data-max") === "1";
        var p = callApi(maxed ? "window_restore" : "window_maximize");
        var done = function () { setMaxUI(!maxed); };
        if (p && p.then) { p.then(done); } else { done(); }
      });
    }

    /* ---- 标题栏拖动（自建实现，不依赖 pywebview 内置 easy_drag） ---- */
    /* 标记类名必须是 pm-drag-region，绝不能改回 pywebview-drag-region：
       后者是 pywebview 内置 easy_drag 的选择器，其 body mousedown 监听是无条件
       注册的（easy_drag=False 只关"整窗拖动"，关不掉这条区域拖动路径）。一旦复用
       该类名，每次拖标题栏都会触发 pywebview 的 pywebviewMoveWindow 桥调用 →
       window.move(x, y) → winforms 的 SetWindowPos：该链路本身就是坏的（move()
       收绝对坐标而 easy_drag 传的是位移量，且调用参数不匹配），会在后台持续抛错；
       而本项目的 window_drag_start / window_move 语义正确，两条路径绝不能共存。 */
    var dragging = false, sx = 0, sy = 0;
    function inDragRegion(el) {
      try { return !!(el && el.closest && el.closest(".pm-drag-region")); } catch (e) { return false; }
    }
    document.addEventListener("mousedown", function (ev) {
      if (ev.button !== 0) return;
      var t = ev.target;
      if (!inDragRegion(t)) return;
      // 不要吃掉按钮 / 复选框 / 链接等可交互元素的点击
      if (t.closest && t.closest("button, input, select, textarea, a, label")) return;
      if (!ready()) return;
      dragging = true;
      sx = ev.screenX; sy = ev.screenY;
      try { window.pywebview.api.window_drag_start(ev.screenX, ev.screenY); } catch (e) {}
      ev.preventDefault();
    });
    window.addEventListener("mousemove", function (ev) {
      if (!dragging || !ready()) return;
      try { window.pywebview.api.window_move(ev.screenX - sx, ev.screenY - sy); } catch (e) {}
    });
    window.addEventListener("mouseup", function () { dragging = false; });
    window.addEventListener("blur", function () { dragging = false; });
  })();

  /* 拖拽遮罩：拖窗口边缘 / 拖侧栏宽度时盖上，接住 mousemove（iframe 内的
     mousemove 不冒泡到父页，会断手势）。关键是 iframe 全程不被 pointer-events
     屏蔽，否则 Chromium 合成器会把它从滚轮命中树里摘掉，之后正文就滚不动了。 */
  (function () {
    var sh = null;
    window.__pmShield = function (on, cursor) {
      try {
        if (!sh) {
          sh = document.createElement("div");
          sh.id = "dragshield";
          (document.body || document.documentElement).appendChild(sh);
        }
        if (on) {
          sh.style.cursor = cursor || "default";
          sh.style.display = "block";
        } else {
          sh.style.display = "none";
        }
      } catch (e) {}
    };
  })();

  /* ----------------------------------------------------------------
     自由缩放手柄：8 个边缘/角 div，覆盖在窗口四周。
     拖拽时读取 window_get_rect，按方向叠加位移（已乘 DPI 比），调用 window_set_rect。
     放在最底层脚本里，即使后续脚本出错，缩放依然可用。
  ---------------------------------------------------------------- */
  (function () {
    function hasApi() { return !!(window.pywebview && window.pywebview.api); }
    var EDGES = ["n", "s", "e", "w", "ne", "nw", "se", "sw"];
    EDGES.forEach(function (edge) {
      var g = document.createElement("div");
      g.className = "rg rg-" + edge;
      g.dataset.edge = edge;
      g.addEventListener("mousedown", function (ev) { startResize(edge, ev); });
      document.body.appendChild(g);   // 贴视口四边（fixed），不能挂在标题栏里
    });
    var resizing = null;
    var resizeSeq = 0;
    var resizeWatchdog = null;
    function startResize(edge, ev) {
      ev.preventDefault();
      ev.stopPropagation();
      if (!hasApi() || !window.pywebview.api.window_resize_to) return;
      // 同步挂监听：pywebview 的 API 调用是异步的（几百毫秒），
      // 若先等它返回再挂，这段时间的 mousemove 会全部丢失（第一次拖拽没反应）。
      // 起点优先用 mousedown 坐标；但它可能是上一帧的过期值（输入被合并时常见），
      // 所以在第一次 mousemove 时校验：偏差离谱就改用首帧坐标当起点。
      resizing = { edge: edge, gid: ++resizeSeq,
                   mx: ev.screenX, my: ev.screenY, sx: null, sy: null };
      window.__pmGestureBusy = true;
      document.body.classList.add("resizing");
      var CUR = { n: "ns-resize", s: "ns-resize", e: "ew-resize", w: "ew-resize",
                  ne: "nesw-resize", sw: "nesw-resize", nw: "nwse-resize", se: "nwse-resize" };
      if (window.__pmShield) window.__pmShield(true, CUR[edge] || "default");
      window.addEventListener("mousemove", onMove);
      window.addEventListener("mouseup", onUp);
      // mouseup 可能丢失（鼠标在窗口外松开、拖拽中切走窗口、触摸板手势中断），
      // 一旦漏掉 resizing 类就永久残留，正文 iframe 被 pointer-events:none 封死 → 滚不动。
      window.addEventListener("blur", onUp);
      window.addEventListener("pointercancel", onUp);
      if (resizeWatchdog) clearTimeout(resizeWatchdog);
      resizeWatchdog = setTimeout(onUp, 12000);
      window.__pmEndResize = onUp;      // 供全局自愈钩子调用
    }
    // 鼠标移动远快于跨进程往返：单飞 + 取最新，只发「相对起点的累计位移」，
    // 即便有丢帧，最后落地的那次也对应正确几何。
    var sending = false, latest = null;
    function pushResize(m) {
      latest = m;
      if (!sending) flushResize();
    }
    function flushResize() {
      if (!latest) return;
      var m = latest; latest = null; sending = true;
      function done() { sending = false; flushResize(); }
      try {
        var p = window.pywebview.api.window_resize_to(
          m.gid, m.e, m.dx, m.dy, window.outerWidth, window.outerHeight, m.mx, m.my);
        if (p && p.then) p.then(done, done); else done();
      } catch (e) { done(); }
    }
    function onMove(ev) {
      if (!resizing) return;
      // 兜底：鼠标键已经松开却没收到 mouseup（窗口外释放 / 事件被吞）→ 立刻收尾，
      // 否则 body.resizing 会让正文 iframe 永久 pointer-events:none，表现为"无法滚动"。
      if (ev.buttons === 0) { onUp(); return; }
      if (resizing.sx === null) {
        var jx = ev.screenX - resizing.mx, jy = ev.screenY - resizing.my;
        if (Math.abs(jx) <= 40 && Math.abs(jy) <= 40) {
          resizing.sx = resizing.mx; resizing.sy = resizing.my;   // 正常小步移动
        } else {
          resizing.sx = ev.screenX; resizing.sy = ev.screenY;     // 起点坐标不可信
        }
      }
      pushResize({
        gid: resizing.gid, e: resizing.edge,
        dx: ev.screenX - resizing.sx, dy: ev.screenY - resizing.sy,
        mx: ev.screenX, my: ev.screenY
      });
    }
    function onUp() {
      if (window.__pmShield) window.__pmShield(false);
      if (!resizing) return;
      resizing = null;
      document.body.classList.remove("resizing");
      window.__pmGestureBusy = false;
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      window.removeEventListener("blur", onUp);
      window.removeEventListener("pointercancel", onUp);
      if (resizeWatchdog) { clearTimeout(resizeWatchdog); resizeWatchdog = null; }
    }
  })();

  /* 手势兜底自愈：任何原因导致 resizing / sb-resizing 类残留，或透明掩体
     (#tabmask) 挡在正文上，都会让正文滚不动。下面三个钩子保证下一次鼠标
     移动/滚轮/失焦时自动恢复，用户不必重启程序。 */
  (function () {
    function activeIframe() {
      var frs = document.querySelectorAll("#views > iframe");
      for (var i = 0; i < frs.length; i++) {
        if (frs[i].style.display !== "none") return frs[i];
      }
      return null;
    }
    function wheelScrollIframe(dy, dm) {
      try {
        var fr = activeIframe();
        if (!fr || !fr.contentWindow) return;
        var line = (dm === 1) ? 18 : (dm === 2 ? window.innerHeight * 0.9 : 1);
        fr.contentWindow.scrollBy(0, dy * line);
      } catch (e) {}
    }
    // force=true：由「按键已松开」的事件（mousemove/wheel 的 buttons===0、失焦、
    // 窗口隐藏）驱动，此时即便 __pmGestureBusy 卡在 true 也说明手势其实早结束了。
    // 拖拽进行中 mousemove 的 buttons 是 1，不会被误判。
    function heal(force) {
      try {
        var b = document.body;
        var stuck = b.classList.contains("resizing") || b.classList.contains("sb-resizing");
        if (force || stuck) {
          if (stuck) {
            // 先让手势自己收尾（摘监听、存侧栏宽度），再兜底清类
            try { if (window.__pmEndResize) window.__pmEndResize(); } catch (e2) {}
            try { if (window.__pmEndSbResize) window.__pmEndSbResize(); } catch (e3) {}
            b.classList.remove("resizing");
            b.classList.remove("sb-resizing");
            window.__pmGestureBusy = false;
          } else if (window.__pmGestureBusy) {
            // 类都没了却还 busy：收尾漏了，放开闸门，否则自愈永久失效
            window.__pmGestureBusy = false;
          }
        }
        var m = document.getElementById("tabmask");
        if (m && m.style.display === "block") {
          var tl = document.getElementById("tablist");
          var hm = document.getElementById("helpMenu");
          var em = document.getElementById("exportMenu");
          var any = (tl && tl.style.display === "block") ||
                    (hm && hm.style.display === "block") ||
                    (em && em.style.display === "block");
          if (!any) m.style.display = "none";   // 菜单已关、掩体没撤
        }
        // 拖拽遮罩残留会挡住整个窗口（比 pointer-events 更狠），一并兜底
        var sh = document.getElementById("dragshield");
        if (sh && sh.style.display === "block" && !window.__pmGestureBusy) {
          sh.style.display = "none";
        }
      } catch (e) {}
    }
    // 1) 鼠标移动时若没有按键按下，说明没有手势在进行
    var lastHeal = 0;
    document.addEventListener("mousemove", function (ev) {
      if (ev.buttons) return;
      var now = Date.now();
      if (now - lastHeal < 250) return;    // 节流：普通移动不必每帧都查
      lastHeal = now;
      heal(true);
    }, true);
    // 2) 滚轮：掩体若挡在正文上，先撤掉它，并把这次滚动补给正文（用户无感）
    document.addEventListener("wheel", function (ev) {
      var m = document.getElementById("tabmask");
      if (m && m.style.display === "block" && ev.target === m) {
        try { m.click(); } catch (e) {}     // 等价于点空白：收起菜单
        m.style.display = "none";
        wheelScrollIframe(ev.deltaY, ev.deltaMode);
      }
      heal(ev.buttons === 0);
    }, { capture: true, passive: true });
    // 3) 失焦 / 窗口隐藏 / 定时巡检
    window.addEventListener("blur", function () { heal(true); });
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) heal(true);
    });
    setInterval(function () { if (!window.__pmGestureBusy) heal(false); }, 5000);
  })();

  /* 补上任务栏最小化所需窗口样式（frameless 默认缺 WS_MINIMIZEBOX）。
     放在最底层、重试两次：窗口可能还没完全建好。 */
  (function () {
    function apply() {
      try {
        if (window.pywebview && window.pywebview.api && window.pywebview.api.apply_window_features)
          window.pywebview.api.apply_window_features();
      } catch (e) {}
    }
    setTimeout(apply, 300);
    setTimeout(apply, 1500);
  })();
  </script>

  <script>

    var expanded = {};         // 已展开的文件夹路径 -> true
    var treeRoot = null;       // 当前树实际渲染的根（用于判断是否需要重绘）
    var locatePath = null;     // 需要定位/高亮的文件（跟随当前标签）
    var cfgPending = false;    // 配置恢复中：此期间文件树同步先 stash，等配置落地再跑
    var activeId = null;

    // 锁定字号，让三种主题完全一致。
    // 背景：模板里暗色用的是 .markdown-body.dark h1{font-size:2em}，特异度(0,2,1)高于
    // 排版覆盖层的 .markdown-body h1{font-size:20px}(0,1,1)，于是暗色标题会退回 2em
    // → 14px×2 = 28px，比亮色/米色的 20px 明显偏大。这里用 !important 一并锁死。
    // 数值取自 wb_overrides.css（WorkBuddy 同款排版）：正文14 / H1 20 / H2 18 / H3 16 / H4-H6 14
    var FONT_PIN_CSS = [
      ".markdown-body{font-size:14px !important;}",
      ".markdown-body h1{font-size:20px !important;}",
      ".markdown-body h2{font-size:18px !important;}",
      ".markdown-body h3{font-size:16px !important;}",
      ".markdown-body h4,.markdown-body h5,.markdown-body h6{font-size:14px !important;}"
    ].join("");
    function ensureFontPin(iframe) {
      try {
        var d = iframe.contentDocument;
        if (!d || !d.head) return;

        var s = d.getElementById("md-font-pin");

          s.id = "md-font-pin";
          d.head.appendChild(s);

        d.head.appendChild(s);
      } catch (e) {}
    }

    // 米色主题：柔和米色底 + 暖深灰字，长时间阅读比纯白更柔和（替代原护眼绿）
    var BEIGE_VARS = [
      "--bgColor-default:#f4ecd8",
      "--fgColor-default:#4a3b28",
      "--fgColor-muted:#6b5c46",
      "--borderColor-default:#d8cba8",
      "--bgColor-muted:#efe7d2",
      "--borderColor-muted:#d8cba8b3",
      "--fgColor-accent:#8a5a2b",
      "--fgColor-success:#4a7a2c",
      "--fgColor-danger:#a63d2f",
      "--fgColor-attention:#8a6d00",
      "--fgColor-done:#6b4fa0",
      "--borderColor-accent-emphasis:#8a5a2b",
      "--borderColor-danger-emphasis:#a63d2f",
      "--borderColor-success-emphasis:#4a7a2c",
      "--borderColor-attention-emphasis:#8a6d00",
      "--borderColor-done-emphasis:#6b4fa0"
    ];
    var BEIGE_VARS_CSS =
      "html.beige,body.beige{background-color:#f4ecd8;color:#4a3b28;}" +
      ".markdown-body.beige{color-scheme:light;" + BEIGE_VARS.join(";") + ";}" +
      ".markdown-body.beige{background-color:#f4ecd8;color:#4a3b28;}" +
      ".markdown-body.beige h1,.markdown-body.beige h2,.markdown-body.beige h3,.markdown-body.beige h4,.markdown-body.beige h5,.markdown-body.beige h6{color:#3d3020;border-bottom-color:#d8cba8;}" +
      ".markdown-body.beige a{color:#8a5a2b;}" +
      ".markdown-body.beige blockquote{border-left-color:#d8cba8;color:#6b5c46;}" +
      ".markdown-body.beige hr{border-top-color:#d8cba8;}" +
      ".markdown-body.beige table th,.markdown-body.beige table td{border-color:#d8cba8;}" +
      ".markdown-body.beige pre{background:#efe7d2 !important;border-color:#d8cba8 !important;}" +
      ".markdown-body.beige code,.markdown-body.beige tt{background:#e6dcc3 !important;color:#3d3020;}" +
      // 内容页残留的模板元素（隐藏前的工具栏/提示区）一并染米色
      "body.beige #toolbar{background:#efe7d2;border-bottom-color:#d8cba8;}" +
      "body.beige #toolbar button{background:#e6dcc3;color:#4a3b28;border-color:#d8cba8;}" +
      "body.beige #status{color:#6b5c46;}" +
      "body.beige #hint{color:#6b5c46;}" +
      "body.beige #hint code{background:#e6dcc3;}";

    function ensureBeigeVars(iframe) {
      try {
        var d = iframe.contentDocument;
        if (!d || !d.head) return;
        if (d.getElementById("md-beige-vars")) return;
        var s = d.createElement("style");
        s.id = "md-beige-vars";
        s.textContent = BEIGE_VARS_CSS;
        d.head.appendChild(s);
      } catch (e) {}
    }

    function addTab(p) {
      p = (typeof p === "string") ? JSON.parse(p) : p;
      // 同名文档：直接激活已有标签，避免重复（优先按绝对路径去重，跨文件夹同名文件互不冲突）
      var hit = null;
      for (var i = 0; i < tabs.length; i++) {
        if (p.path && tabs[i].path && tabs[i].path === p.path) { hit = tabs[i]; break; }
        if (!p.path && !tabs[i].path && tabs[i].name === p.name) { hit = tabs[i]; break; }
      }
      if (hit) { activate(hit.id); return; }

      var empty = document.querySelector("#views .empty");
      if (empty) empty.remove();

      var id = "t" + (counter++);
      var el = document.createElement("div");
      el.className = "tab";
      el.draggable = true;      // 允许拖拽调整顺序
      el.dataset.tid = id;      // 供拖放后同步 tabs 数组顺序
      el.title = "点击切换，拖拽可调整顺序";
      var nm = document.createElement("span");
      nm.className = "nm"; nm.textContent = p.name; nm.title = p.name;
      var x = document.createElement("span");
      x.className = "x"; x.textContent = "×";
      el.appendChild(nm); el.appendChild(x);

      el.addEventListener("click", function (e) {
        if (e.target === x) return;
        activate(id);
      });
      // 拖拽排序：只移动标签条上的小标签，绝不搬动 iframe（搬 iframe 会触发重载、丢失滚动位置）
      el.addEventListener("dragstart", function (e) {
        tabDragId = id;
        el.classList.add("dragging");
        try {
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", id);
        } catch (err) {}
      });
      el.addEventListener("dragend", function () {
        tabDragId = null;
        el.classList.remove("dragging");
        syncTabOrderFromDom();
        updateNav();
      });
      x.addEventListener("click", function (e) {
        e.stopPropagation(); closeTab(id);
      });

      // 标签直接追加进可滚动区（不再依赖已移除的 .spacer 占位）
      document.getElementById("tabs").appendChild(el);

      var iframe = document.createElement("iframe");
      // scrollY：恢复上次关闭本软件时的阅读位置（由 Python 侧从会话配置带入）
      var t = { id: id, name: p.name, path: p.path || "", el: el, iframe: iframe,
                scrollY: p.scrollY || 0 };
      try {
        iframe.addEventListener("load", function () {
          applyTheme(iframe);
          applyZoomTo(iframe);                  // 新标签也沿用当前正文字号
          ensureZoomWired(iframe);              // 正文里的 Ctrl+滚轮 / Ctrl+数字
          watchScroll(t);                       // 监听滚动，实时记下阅读位置
          hlAttachTo(t);                        // 装选区/点击交互，并恢复本文的高亮
          applyHighlightsFor(t);
          if (t.scrollY) restoreScroll(iframe, t.scrollY);
          if (sbMode === "toc" && t.id === activeId) buildOutline(0);
          else if (sbMode === "hl" && t.id === activeId) renderHlList();
        });
      } catch (e) {}
      iframe.srcdoc = p.html;
      document.getElementById("views").appendChild(iframe);

      tabs.push(t);
      activate(id);
      updateNav();
      saveSession();
      scheduleTreeSync(t);      // 侧栏文件树自动切到该文件所属文件夹并高亮它
      syncTreeCloseBtns();      // 新打开的文件，行尾 × 显形
    }

    // ---- 阅读位置记忆：切换标签时记住滚动位置，切回时恢复 ----
    // iframe 一旦 display:none 就脱离布局，再次显示会重新布局并把滚动位置清零，
    // 所以必须在切走前主动读取、切回后主动写回。
    function ifScrollY(fr) {
      try {
        var w = fr.contentWindow, d = fr.contentDocument;
        if (!w || !d) return 0;
        if (typeof w.pageYOffset === "number") return w.pageYOffset;
        return (d.documentElement && d.documentElement.scrollTop) || (d.body && d.body.scrollTop) || 0;
      } catch (e) { return 0; }
    }
    function ifScrollTo(fr, y) {
      try {
        var w = fr.contentWindow, d = fr.contentDocument;
        if (!w || !d || !y) return;
        if (w.scrollTo) w.scrollTo(0, y);
        else {
          if (d.documentElement) d.documentElement.scrollTop = y;
          if (d.body) d.body.scrollTop = y;
        }
      } catch (e) {}
    }
    // 恢复显示后布局要 1~2 帧才稳定，重试几次确保真的落位。
    // __restoreTo 有三重作用：① 记录恢复目标；② 期间 saveSession 不得用实时读数
    // 覆盖已记位置；③ 恢复自身引起的 scroll 事件可被识别并忽略。
    function restoreScroll(fr, y) {
      if (!fr || !y) return;
      var tries = 0;
      fr.__restoreTo = y;
      function step() {
        if (!fr.parentNode || fr.__restoreTo !== y) return;  // 标签已关 / 用户已接管
        if (fr.style.display === "none") { fr.__restoreTo = 0; return; }
        ifScrollTo(fr, y);
        if (Math.abs(ifScrollY(fr) - y) <= 2 || ++tries >= 6) { fr.__restoreTo = 0; return; }
        setTimeout(step, 80);
      }
      step();
    }

    // ---- 阅读位置持续持久化 ----
    // 只在滚动停止后写一次配置（尾部防抖），避免每帧都写盘；这样即使直接关窗口
    // 或被强杀，上次读到的位置也已经落盘，下次冷启动能接着读。
    var scrollSaveTimer = null;
    function scheduleSave() {
      try {
        if (scrollSaveTimer) clearTimeout(scrollSaveTimer);
        scrollSaveTimer = setTimeout(function () { scrollSaveTimer = null; saveSession(); }, 800);
      } catch (e) {}
    }
    // iframe 内容尚未就绪时 ifScrollY 会返回 0，不能拿它覆盖已记住的位置
    function ifScrollReady(fr) {
      try {
        return !!(fr && fr.contentWindow && fr.contentDocument && fr.contentDocument.body);
      } catch (e) { return false; }
    }
    // 给已加载的标签装上滚动监听
    function watchScroll(t) {
      try {
        var w = t.iframe.contentWindow;
        if (!w || t.__scrollWatched) return;
        t.__scrollWatched = true;
        w.addEventListener("scroll", function () {
          // 关键：iframe 被 display:none 隐藏时，Chromium 会把它的滚动归零并
          // 派发一次 scroll 事件。绝不能拿这个 0 覆盖已记住的位置——否则每次
          // 切走标签，位置就被清零了。
          if (t.iframe.style.display === "none") return;
          var cur = ifScrollY(t.iframe);
          // 恢复滚动动作自身引起的滚动（位置≈目标值）不是用户滚动，忽略
          if (t.iframe.__restoreTo && Math.abs(cur - t.iframe.__restoreTo) <= 2) return;
          t.iframe.__restoreTo = 0;      // 用户真的自己滚了 → 立即取消恢复
          t.scrollY = cur;
          markTocActive(t);              // 同步大纲高亮
          scheduleSave();
        }, { passive: true });
      } catch (e) {}
    }

    function activate(id) {
      // 切走前：先记下当前活动标签的阅读位置
      // （恢复还在进行中的标签不动它——此刻实时读数可能还是 0）
      for (var k = 0; k < tabs.length; k++) {
        if (tabs[k].id === activeId && tabs[k].iframe && !tabs[k].iframe.__restoreTo) {
          tabs[k].scrollY = ifScrollY(tabs[k].iframe);
        }
      }
      activeId = id;
      for (var i = 0; i < tabs.length; i++) {
        var on = tabs[i].id === id;
        tabs[i].el.classList.toggle("active", on);
        tabs[i].iframe.style.display = on ? "block" : "none";
        if (on) restoreScroll(tabs[i].iframe, tabs[i].scrollY || 0);
        // 切换时把当前标签滚进可视范围
        if (on && tabs[i].el && tabs[i].el.scrollIntoView) {
          try { tabs[i].el.scrollIntoView({ block: "nearest", inline: "nearest" }); } catch (e) {}
        }
      }
      refreshTabListIfOpen();
      if (sbMode === "toc") buildOutline(0);   // 切换文档后大纲跟着换
      else if (sbMode === "hl") renderHlList();
      closeHlPop();
      saveSession();
      var _at = activeTab();
      if (_at) scheduleTreeSync(_at);           // 切标签时文件树跟着定位到该文件
      if (typeof updateEditUI === "function") updateEditUI();
    }

    // 标签栏左右滚动
    function scrollTabs(dir) {
      try {
        var t = document.getElementById("tabs");
        if (!t) return;
        var step = Math.max(120, Math.round(t.clientWidth * 0.6));
        if (t.scrollBy) t.scrollBy({ left: dir * step, behavior: "smooth" });
        else t.scrollLeft += dir * step;
      } catch (e) {}
    }

    // ---- 拖拽调整标签顺序 ----
    // 根据指针 x 坐标判断应插入到哪个标签之前
    function dragAfterElement(container, x) {
      var els = container.querySelectorAll(".tab:not(.dragging)");
      for (var i = 0; i < els.length; i++) {
        var b = els[i].getBoundingClientRect();
        if (x < b.left + b.width / 2) return els[i];
      }
      return null;
    }
    // 拖放后，让 tabs 数组顺序与标签条上的 DOM 顺序一致
    function syncTabOrderFromDom() {
      try {
        var els = document.getElementById("tabs").querySelectorAll(".tab");
        var order = [];
        for (var i = 0; i < els.length; i++) order.push(els[i].dataset.tid);
        tabs.sort(function (a, b) { return order.indexOf(a.id) - order.indexOf(b.id); });
        refreshTabListIfOpen();
        saveSession();
      } catch (e) {}
    }

    // 垂直版插入点：☰ 列表里被拖项应插到指针上方第一个「中线在指针之下」的项之前
    function dragAfterElementY(container, y) {
      var els = container.querySelectorAll(".li:not(.dragging)");
      for (var i = 0; i < els.length; i++) {
        if (!els[i].dataset || !els[i].dataset.tid) continue;   // 跳过「(没有打开的文档)」占位
        var b = els[i].getBoundingClientRect();
        if (y < b.top + b.height / 2) return els[i];
      }
      return null;
    }
    // 拖放后，让 tabs 数组顺序与 ☰ 列表的顺序一致，并同步顶部标签条 DOM
    function syncTabOrderFromList() {
      try {
        var box = document.getElementById("tablist");
        var strip = document.getElementById("tabs");
        if (!box || !strip) return;
        var ids = [];
        var kids = box.children;
        for (var i = 0; i < kids.length; i++) {
          if (kids[i].dataset && kids[i].dataset.tid) ids.push(kids[i].dataset.tid);
        }
        // 数量对不上（拖拽途中有关闭竞态）就整体重渲染兜底，避免脏顺序写进 tabs
        if (ids.length !== tabs.length) { refreshTabListIfOpen(); return; }
        var seen = {}, ordered = [];
        for (var j = 0; j < ids.length; j++) {
          if (seen[ids[j]]) { refreshTabListIfOpen(); return; }
          seen[ids[j]] = 1;
          for (var k = 0; k < tabs.length; k++) {
            if (tabs[k].id === ids[j]) { ordered.push(tabs[k]); break; }
          }
        }
        if (ordered.length !== tabs.length) { refreshTabListIfOpen(); return; }
        tabs = ordered;
        // 顶部标签条同步到新顺序（appendChild 只移动已有节点，不重建、不动 iframe，
        // 所以不会触发重载、不丢滚动位置）
        for (var m = 0; m < tabs.length; m++) strip.appendChild(tabs[m].el);
        saveSession();
        updateNav();
      } catch (e) {}
    }

    // 标签没溢出时隐藏左右滚动按钮，溢出时才显示
    function updateNav() {
      try {
        var t = document.getElementById("tabs");
        var pv = document.getElementById("navPrev");
        var nx = document.getElementById("navNext");
        if (!t || !pv || !nx) return;
        var over = t.scrollWidth > t.clientWidth + 2;
        pv.style.display = over ? "inline-flex" : "none";
        nx.style.display = over ? "inline-flex" : "none";
      } catch (e) {}
      refreshTabListIfOpen();
    }

    // ---- 垂直列显示：把所有标签名竖排列出，点一条即切换 ----
    function renderTabList() {
      try {
        var box = document.getElementById("tablist");
        if (!box) return;
        box.innerHTML = "";
        if (tabs.length === 0) {
          var e = document.createElement("div");
          e.className = "li"; e.style.cursor = "default";
          e.textContent = "(没有打开的文档)";
          box.appendChild(e);
          return;
        }
        for (var i = 0; i < tabs.length; i++) {
          (function (t) {
            var d = document.createElement("div");
            d.className = "li" + (t.id === activeId ? " active" : "");
            var nm = document.createElement("span");
            nm.className = "tl-nm"; nm.textContent = t.name; nm.title = t.name;
            var x = document.createElement("span");
            x.className = "tl-x"; x.textContent = "×"; x.title = "关闭这个文件";
            d.appendChild(nm); d.appendChild(x);
            d.addEventListener("click", function () { activate(t.id); toggleTabList(false); });
            // 行尾 × ：直接关掉这个标签。列表保持展开，closeTab→activate 内部会
            // refreshTabListIfOpen 自动刷新，于是可以连着关好几个
            x.addEventListener("click", function (e) {
              e.stopPropagation();
              closeTab(t.id);
            });
            // 拖动排序：与顶部标签条共用同一套机制（tabDragId 共享），
            // 落定后 syncTabOrderFromList 把列表顺序写回 tabs 数组，
            // 并同步顶部标签条 DOM —— 两个入口看到的顺序永远一致
            d.draggable = true;
            d.dataset.tid = t.id;
            d.title = t.name + "（点击切换，拖动可调整顺序）";
            d.addEventListener("dragstart", function (e) {
              tabDragId = t.id;
              d.classList.add("dragging");
              try {
                e.dataTransfer.effectAllowed = "move";
                e.dataTransfer.setData("text/plain", t.id);
              } catch (err) {}
            });
            d.addEventListener("dragend", function () {
              tabDragId = null;
              // 快速拖动可能残留多个 .dragging，统一清掉
              var ds = box.querySelectorAll(".li.dragging");
              for (var q = 0; q < ds.length; q++) ds[q].classList.remove("dragging");
              syncTabOrderFromList();
            });
            box.appendChild(d);
          })(tabs[i]);
        }
      } catch (err) {}
    }

    function refreshTabListIfOpen() {
      try {
        var box = document.getElementById("tablist");
        if (box && box.style.display === "block") renderTabList();
      } catch (err) {}
    }

    // ---- 菜单系统：☰面板 / 「导出」/ 「帮助」共用一套开合与掩体逻辑 ----
    function _closePopMenus(exceptId) {
      // 同一时刻只开一个顶栏下拉：开一个先收其它
      var ids = ["exportMenu", "helpMenu"];
      for (var i = 0; i < ids.length; i++) {
        if (ids[i] === exceptId) continue;
        var m = document.getElementById(ids[i]);
        if (m) m.style.display = "none";
        var b = document.getElementById(ids[i].replace(/Menu$/, "Btn"));
        if (b) b.classList.remove("on");           // 同步清掉按钮选中态
      }
    }
    function _anyMenuOpen() {
      var tl = document.getElementById("tablist");
      var hm = document.getElementById("helpMenu");
      var em = document.getElementById("exportMenu");
      return (tl && tl.style.display === "block")
          || (hm && hm.style.display === "block")
          || (em && em.style.display === "block");
    }
    function _syncMask() {
      // 有任一面板/菜单开着就保留掩体（iframe 内点击不冒泡，靠它兜底），全关即撤
      var mask = document.getElementById("tabmask");
      if (mask) mask.style.display = _anyMenuOpen() ? "block" : "none";
    }
    function toggleTabList(force) {
      try {
        var box = document.getElementById("tablist");
        var btn = document.getElementById("navList");
        if (!box || !btn) return;
        var show = (typeof force === "boolean") ? force : (box.style.display !== "block");
        if (show) {
          renderTabList();
          _closePopMenus(null);                 // 顶栏下拉让位
          var r = btn.getBoundingClientRect();   // 让面板出现在按钮正下方
          box.style.left = Math.max(4, r.left) + "px";
          box.style.top = (r.bottom + 4) + "px";
          box.style.display = "block";
          btn.classList.add("on");               // ☰ 选中态：立体凸起 + 阴影
          var mask = document.getElementById("tabmask");
          if (mask) mask.style.display = "block";
        } else {
          box.style.display = "none";
          btn.classList.remove("on");
          _syncMask();
        }
      } catch (err) {}
    }

    // ---- 顶栏下拉菜单（「导出」「帮助」共用；按钮 id = 菜单 id 去掉 Menu 后缀）----
    function toggleMenu(menuId, force) {
      try {
        var menu = document.getElementById(menuId);
        var btn = document.getElementById(menuId.replace(/Menu$/, "Btn"));
        if (!menu || !btn) return;
        var show = (typeof force === "boolean") ? force : (menu.style.display !== "block");
        if (show) {
          _closePopMenus(menuId);                // 收起另一个下拉
          var tl = document.getElementById("tablist");
          if (tl) tl.style.display = "none";     // ☰ 面板也让位
          var r = btn.getBoundingClientRect();   // 菜单出现在按钮正下方
          menu.style.left = Math.max(4, r.left) + "px";
          menu.style.top = (r.bottom + 4) + "px";
          menu.style.display = "block";
          if (btn) btn.classList.add("on");      // 下拉展开 = 按钮选中态：立体凸起 + 阴影
          var mask = document.getElementById("tabmask");
          if (mask) mask.style.display = "block";
        } else {
          menu.style.display = "none";
          if (btn) btn.classList.remove("on");
          _syncMask();
        }
      } catch (err) {}
    }
    function toggleExportMenu(force) { toggleMenu("exportMenu", force); }
    function toggleHelpMenu(force) { toggleMenu("helpMenu", force); }
    function showAboutModal() {
      try {
        var v = document.getElementById("aboutVer");
        if (v) v.textContent = "PureMD v" + APP_VERSION;
        var m = document.getElementById("aboutModal");
        if (m) m.style.display = "flex";
      } catch (err) {}
    }
    function closeAboutModal() {
      try { var m = document.getElementById("aboutModal"); if (m) m.style.display = "none"; } catch (err) {}
    }
    // ---- 会话保存：把当前打开的标签（文件路径）与激活项写入本地配置 ----
    // 下次启动（双击 .md）时由 Python 侧读取并自动恢复这些标签
    function saveSession() {
      try {
        if (!hasApi() || !window.pywebview.api.set_config) return;
        var files = [], scroll = {};
        for (var i = 0; i < tabs.length; i++) {
          if (!tabs[i].path) continue;
          files.push(tabs[i].path);
          // 当前可见标签以实时滚动位置为准；其余用切走时记下的值。
          // 内容还没加载好时不能拿 0 覆盖掉已记住的位置，否则冷启动恢复会失效。
          var y = tabs[i].scrollY || 0;
          if (tabs[i].id === activeId && ifScrollReady(tabs[i].iframe) &&
              !tabs[i].iframe.__restoreTo) {
            y = ifScrollY(tabs[i].iframe);
            tabs[i].scrollY = y;
          }
          scroll[tabs[i].path] = Math.round(y) || 0;
        }
        var active = activeTab();
        saveCfg({ session: { files: files, active: (active && active.path) ? active.path : "",
                             scroll: scroll } });
      } catch (e) {}
    }
    // 窗口被关闭/进程退出前的最后一道保险：尽力再写一次会话
    window.addEventListener("beforeunload", function () { try { saveSession(); } catch (e) {} });
    window.addEventListener("pagehide", function () { try { saveSession(); } catch (e) {} });

    function closeTab(id) {
      var idx = -1;
      for (var i = 0; i < tabs.length; i++) { if (tabs[i].id === id) { idx = i; break; } }
      if (idx < 0) return;
      // 有未保存的编辑时先确认，避免手快点×把改动作废
      if (EDITED[id] && !closeTab.__force) {
        var tt = tabs[idx];
        askConfirm("关闭前要保存吗", "「" + (tt.name || "") + "」里有改动还没写回文件。", [
          { label: "取消", value: "cancel" },
          { label: "不保存", value: "discard" },
          { label: "保存并关闭", value: "save", primary: true }
        ]).then(function (v) {
          if (v === "discard") { delete EDITED[id]; closeTab(id); }
          else if (v === "save") {
            var pm = pmOf(tt);
            window.pywebview.api.save_md(tt.path, pm ? pm.buildText() : "").then(function (r) {
              if (!r || r.error) { setStatus("保存失败：" + ((r && r.error) || "未知错误")); return; }
              delete EDITED[id];
              closeTab(id);
            }).catch(function () {});
          }
        });
        return;
      }
      delete EDITED[id];
      // 关闭前先记下当前活动标签的位置，用来决定关闭后谁保持激活
      var activeIdx = -1;
      for (var i = 0; i < tabs.length; i++) { if (tabs[i].id === activeId) { activeIdx = i; break; } }
      tabs[idx].el.remove();
      tabs[idx].iframe.remove();
      tabs.splice(idx, 1);
      if (tabs.length === 0) {
        activeId = null;
        document.getElementById("views").innerHTML =
          '<div class="empty">没有打开的文档 &mdash; 双击任意 .md 即可在此打开</div>';
        locatePath = null;
        markTreeFile("");          // 没有打开的文件了，清掉树里的选中态
        syncTreeCloseBtns();       // 文件行的 × 也一并收起
        tocItems = []; tocTabId = null;      // 大纲也清掉，别留着上一篇的标题
        var tocBox = document.getElementById("toc");
        if (tocBox) tocBox.innerHTML = '<div class="sb-err" style="color:#6e7781">（没有打开的文档）</div>';
        updateNav();
        refreshTabListIfOpen();   // ☰ 列表若开着，刷新成"没有打开的文档"
        saveSession();
        return;
      }
      // 激活项选择规则：
      //  · 被关标签在当前标签之前 → 当前文档随之前移一格，仍保持激活（后面的标签往前移补位）
      //  · 被关标签是当前标签、或在它之后 → 选定到被关标签的前一个
      if (idx < activeIdx) activate(tabs[activeIdx - 1].id);
      else activate(tabs[Math.max(0, idx - 1)].id);
      updateNav();
      saveSession();
      syncTreeCloseBtns();        // 被关文件行尾的 × 收起
    }

    function applyTheme(iframe) {
      try {
        var d = iframe.contentDocument;
        if (!d) return;
        var on = (theme !== "light");
        [d.body, d.documentElement].forEach(function (el) {
          if (!el) return;
          el.classList.remove("dark", "beige");
          if (on) el.classList.add(theme);
        });
        var nodes = d.querySelectorAll(".markdown-body");
        for (var i = 0; i < nodes.length; i++) {
          nodes[i].classList.remove("dark", "beige");
          if (on) nodes[i].classList.add(theme);
        }
        var c = d.getElementById("content");
        if (c) { c.classList.remove("dark", "beige"); if (on) c.classList.add(theme); }
        ensureFontPin(iframe);
        if (theme === "dark") ensureDarkVars(iframe);
        else if (theme === "beige") ensureBeigeVars(iframe);
      } catch (e) {}
    }

    }

    // 统一套用当前主题：顶层界面（标签栏/按钮/窗口底） + 每个内容标签页
    function applyAll() {
      document.body.classList.remove("dark", "beige", "light");
      if (theme !== "light") document.body.classList.add(theme);
      else document.body.classList.add("light");

    }

    // 点击循环：亮色 → 暗色 → 米色 → 亮色
    function toggleTheme() {
